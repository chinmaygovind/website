[pytest]
# `exhaustive` is the evaluator's proof: it scores all 2,598,960 five-card hands
# against an independent sort-and-group implementation and checks every category
# count against the textbook figures. It is the reason `evaluate()` can be
# trusted, and it is ~90s, which is longer than the rest of this suite put
# together.
#
# So it is deselected by default and turned back on by `scripts/tests.sh` on
# `--all` or when `gto/evaluator.py` or `gto/cards.py` actually changed - the
# only time the thing it proves can have broken. Same arrangement, and same
# reasoning, as `kot/pytest.ini`.
#
# `addopts` is prepended to the command line, so a later `-m` wins.
#
# The hazard is the one CLAUDE.md names: a skipped test reads as a pass. The
# runner prints a line saying the proof was left out rather than letting a green
# run quietly mean less than it looks like.
# `calibration` is the same arrangement for the bots: it deals thousands of
# hands and checks each bot's *measured* VPIP and PFR land near the numbers on
# its profile. That is the only thing that makes those numbers mean anything -
# a profile saying 58/31 is a claim, and this is the test of it - but it is
# about a hundred seconds, so it runs on --all or when bots.py / profiles.py
# actually changed.
# `validation` is the third: it compares this code against eval7 and against
# published preflop solutions - the only tests here that can catch a number that
# has been wrong since the first commit, since everything else checks this
# project against itself. It is gated not for speed (four seconds) but because
# it needs `eval7`, which is test-only and is not installed in production.
markers =
    validation: compares against eval7 and published charts; needs the test-only eval7
    exhaustive: full 2.6M-hand evaluator proof; only on --all or a change to evaluator.py/cards.py
    calibration: thousands of simulated hands; only on --all or a change to bots.py/profiles.py
addopts = -m "not exhaustive and not calibration and not validation"
# eval7 0.1.11 calls a pyparsing API that pyparsing has deprecated, once per
# range it parses - eighty-odd lines of somebody else's warning in a run that
# has nothing to do with it. Nothing here can fix it and nothing here should
# read it.
filterwarnings =
    ignore::DeprecationWarning:eval7.*
    ignore:.*deprecated - use.*
