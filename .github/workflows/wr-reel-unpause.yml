name: World record reel - unpause

# One-off, Oct 2026: World record reel was switched off for six hours after
# cetung's Starport record posted, so Brumm's and BotTyler's would follow it
# later rather than straight after. This switches it back on, runs it at once
# (it posts every record set since, oldest first), and switches itself off.
# Delete this file once it has run.
on:
  schedule:
    - cron: "0 3 27 10 *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  unpause:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh workflow enable wr-reel.yml
          gh workflow run wr-reel.yml -f urgent=true
          gh workflow disable wr-reel-unpause.yml
