name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_all:
        description: "Run every module's tests, not just the changed ones"
        type: boolean
        default: true

# One deploy at a time; a newer push cancels an in-progress run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Work out which suites this push actually needs. The whole suite is about
  # five minutes and nearly every push touches one game, so the rest of it is
  # waste. scripts/changed-modules.sh owns the path -> module mapping and is
  # the same script used locally, so CI and a laptop cannot disagree.
  pick:
    name: Pick tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      # Only the scripts. Cone mode brings the root files along, and .git here
      # is half a gigabyte of committed media, so nothing else is worth pulling.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_all }}
        run: |
          set -uo pipefail
          ALL='["site","drive","ers","kot"]'

          if [ "$RUN_ALL" = "true" ]; then
            modules="$ALL"
            why="asked for everything"
          elif files=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" \
                --jq '.files[].filename' 2>/dev/null) && [ -n "$files" ]; then
            modules=$(printf '%s\n' "$files" | scripts/changed-modules.sh --json --stdin)
            why=$(printf '%s\n' "$files" | wc -l)" file(s) changed"
          else
            # A first push, a force push or an API hiccup: no idea what moved,
            # so do not guess.
            modules="$ALL"
            why="could not tell what changed"
          fi

          echo "modules=$modules" >>"$GITHUB_OUTPUT"
          echo "### Tests: \`$modules\` ($why)" >>"$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.module }}
    needs: pick
    if: needs.pick.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.pick.outputs.modules) }}
    steps:
      # Just this module. Note the empty line when the module is "site": its
      # test is `import app`, which does not read site/ (that is 500MB of video
      # and images, and is only touched per request).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            ${{ matrix.module != 'site' && matrix.module || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ${{ matrix.module }}/requirements*.txt

      - name: Install dependencies
        run: |
          set -e
          M='${{ matrix.module }}'
          if [ "$M" = site ]; then
            pip install -r requirements.txt
          else
            pip install -r "$M/requirements.txt"
            # Test-only extras, e.g. drive's QuickJS. Without it test_sim.py
            # skips itself, which reads as a pass.
            if [ -f "$M/requirements-test.txt" ]; then
              pip install -r "$M/requirements-test.txt"
            fi
          fi

      - run: scripts/tests.sh '${{ matrix.module }}'

  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    needs: [pick, test]
    # `test` is skipped when nothing testable changed, and a skipped job would
    # otherwise skip this one too.
    if: >-
      always()
      && needs.pick.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP=/home/ubuntu/website

            echo "==> Pulling latest from main (with submodules)"
            cd "$APP"
            git fetch origin main
            git checkout main 2>/dev/null || true
            git reset --hard origin/main
            git submodule sync --recursive
            git submodule update --init --recursive

            echo "==> Installing/upgrading Python dependencies"
            "$APP/venv/bin/pip" install -q -r requirements.txt

            echo "==> Restarting website"
            sudo systemctl restart website

            echo "==> Egyptian Rat Screw (ers): venv + deps + restart"
            if [ -f "$APP/ers/.env" ]; then
              [ -d "$APP/ers/venv" ] || python3 -m venv "$APP/ers/venv"
              "$APP/ers/venv/bin/pip" install -q -r "$APP/ers/requirements.txt"
              sudo systemctl restart ers || echo "ers service not installed yet (one-time setup)"
            else
              echo "ers/.env missing - skipping ers (do the one-time bring-up first)"
            fi

            echo "==> King of Tokyo (kot): venv + deps + restart"
            if [ -f "$APP/kot/.env" ]; then
              [ -d "$APP/kot/venv" ] || python3 -m venv "$APP/kot/venv"
              "$APP/kot/venv/bin/pip" install -q -r "$APP/kot/requirements.txt"
              sudo systemctl restart kot || echo "kot service not installed yet (one-time setup)"
            else
              echo "kot/.env missing - skipping kot (do the one-time bring-up first)"
            fi

            echo "==> Drive (drive): venv + deps + restart"
            if [ -f "$APP/drive/.env" ]; then
              [ -d "$APP/drive/venv" ] || python3 -m venv "$APP/drive/venv"
              "$APP/drive/venv/bin/pip" install -q -r "$APP/drive/requirements.txt"
              sudo systemctl restart drive || echo "drive service not installed yet (one-time setup)"
            else
              echo "drive/.env missing - skipping drive (do the one-time bring-up first)"
            fi

            echo "==> Deploy complete"
