name: Deploy

on:
  push:
    branches: [main]
  # **Pull requests run the tests and stop there.** Without this a PR ran nothing
  # at all - the suite only fired once the branch was already merged to main,
  # which is the wrong end of the process to find out a track does not load.
  # The `deploy` job below is guarded so a PR can never ship anything.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_all:
        description: "Run every module's tests, not just the changed ones"
        type: boolean
        default: true

# One deploy at a time; a newer push cancels an in-progress run. Keyed on the
# ref, so a pull request's runs cancel each other rather than the one on main:
# `github.ref` is `refs/pull/<n>/merge` for a PR.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Work out which suites this push actually needs. The whole suite is about
  # five minutes and nearly every push touches one game, so the rest of it is
  # waste. scripts/changed-modules.sh owns the path -> module mapping and is
  # the same script used locally, so CI and a laptop cannot disagree.
  pick:
    name: Pick tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      # Only the scripts. Cone mode brings the root files along, and .git here
      # is half a gigabyte of committed media, so nothing else is worth pulling.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          # On a push these are the two ends of the push. On a pull request
          # `github.event.before` does not exist, and `github.sha` is the *merge*
          # commit rather than the branch tip - so both come off the PR payload,
          # and the comparison is base...head, which is what the PR actually
          # proposes to change.
          BEFORE: ${{ github.event_name == 'pull_request'
                      && github.event.pull_request.base.sha
                      || github.event.before }}
          SHA: ${{ github.event_name == 'pull_request'
                   && github.event.pull_request.head.sha
                   || github.sha }}
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_all }}
        run: |
          set -uo pipefail
          ALL='["site","drive","ers","kot"]'

          if [ "$RUN_ALL" = "true" ]; then
            modules="$ALL"
            why="asked for everything"
          elif files=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" \
                --jq '.files[].filename' 2>/dev/null) && [ -n "$files" ]; then
            modules=$(printf '%s\n' "$files" | scripts/changed-modules.sh --json --stdin)
            why=$(printf '%s\n' "$files" | wc -l)" file(s) changed"
          else
            # A first push, a force push or an API hiccup: no idea what moved,
            # so do not guess.
            modules="$ALL"
            why="could not tell what changed"
          fi

          echo "modules=$modules" >>"$GITHUB_OUTPUT"
          echo "### Tests: \`$modules\` ($why)" >>"$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.module }}
    needs: pick
    if: needs.pick.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.pick.outputs.modules) }}
    steps:
      # Just this module. "site" is the root app, whose suite is the accounts
      # pages: that needs `accounts/` and `tests/`, plus the flag art the
      # picker is generated from - and nothing else under site/, which is
      # 500MB of video and images only ever read per request.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            ${{ matrix.module == 'site' && 'accounts' || matrix.module }}
            ${{ matrix.module == 'site' && 'tests' || '' }}
            ${{ matrix.module == 'site' && 'site/assets/flags' || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ${{ matrix.module }}/requirements*.txt

      - name: Install dependencies
        run: |
          set -e
          M='${{ matrix.module }}'
          if [ "$M" = site ]; then
            pip install -r requirements.txt
            pip install -r requirements-test.txt
          else
            pip install -r "$M/requirements.txt"
            # Test-only extras, e.g. drive's QuickJS. Without it test_sim.py
            # skips itself, which reads as a pass.
            if [ -f "$M/requirements-test.txt" ]; then
              pip install -r "$M/requirements-test.txt"
            fi
          fi

      - run: scripts/tests.sh '${{ matrix.module }}'

  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    needs: [pick, test]
    # Two conditions, and the first is the important one.
    #
    # **A pull request must never reach this job.** It runs for PRs now so the
    # tests gate them, and the whole point of a PR gate is that the code has not
    # been reviewed yet - shipping it to prod on open would be strictly worse than
    # having no gate at all. `github.event_name` is the check rather than the
    # branch, because a PR's `github.ref` is `refs/pull/<n>/merge` and would pass
    # a naive branch test.
    #
    # Then the original one: `test` is skipped when nothing testable changed, and
    # a skipped need would otherwise skip this too.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.pick.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP=/home/ubuntu/website
            # The live Ticket to Ride is NOT this repo's ttr/ submodule: it is
            # its own clone, and its instance/ holds the SQLite file all five
            # services share. **Never `git clean` in there** - the database and
            # the .env are both untracked, and cleaning would delete the site's
            # entire data. `reset --hard` is safe: neither is tracked, so
            # neither is touched.
            TTR=/home/ubuntu/TicketToRide

            echo "==> Pulling latest from main (with submodules)"
            cd "$APP"
            BEFORE="$(git rev-parse HEAD 2>/dev/null || true)"
            git fetch origin main
            git checkout main 2>/dev/null || true
            git reset --hard origin/main
            git submodule sync --recursive
            git submodule update --init --recursive
            AFTER="$(git rev-parse HEAD)"

            # What actually moved, asked of git on the box rather than passed
            # in - so a deploy that is several commits behind still restarts
            # everything those commits touched. Restarting a game service drops
            # every live game in it, which is why this is worth knowing: before
            # this, one CSS tweak on the landing page ended whatever was being
            # played in ERS and KoT.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$AFTER" ]; then
              CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || echo ALL)"
            else
              # Same commit: a hand-triggered re-run, where the intent is
              # "deploy it again" and nothing can be safely assumed unchanged.
              CHANGED=ALL
            fi
            touched() {
              [ "$CHANGED" = ALL ] && return 0
              printf '%s\n' "$CHANGED" | grep -qE "$1"
            }
            echo "changed since $BEFORE:"; printf '%s\n' "$CHANGED" | sed 's/^/    /'

            # One game: venv, deps, restart - but only if that game moved.
            game() {
              name="$1"; dir="$APP/$1"
              if [ ! -f "$dir/.env" ]; then
                echo "==> $name: no .env, skipping (do the one-time bring-up first)"
                return 0
              fi
              if ! touched "^$1/"; then
                echo "==> $name: unchanged, leaving it running"
                return 0
              fi
              echo "==> $name: venv + deps + restart"
              [ -d "$dir/venv" ] || python3 -m venv "$dir/venv"
              "$dir/venv/bin/pip" install -q -r "$dir/requirements.txt"
              sudo systemctl restart "$name" || echo "$name service not installed yet"
            }

            # The website itself: everything that is not one of the four games.
            if touched '^(app\.py|visits\.py|requirements\.txt|accounts/|site/|deploy/)'; then
              echo "==> Installing/upgrading Python dependencies"
              "$APP/venv/bin/pip" install -q -r requirements.txt
              echo "==> Restarting website"
              sudo systemctl restart website
            else
              echo "==> website: unchanged, leaving it running"
            fi

            game ers
            game kot
            game drive
            # gto was missing from this list from the day the service was set
            # up, so every gto deploy since has reset the code on the box and
            # left gunicorn serving the old one - a green deploy and an
            # unchanged site. Nothing catches that but looking at the page.
            game gto

            # Ticket to Ride, from this repo's submodule pointer.
            #
            # The pointer is the source of truth on purpose: shipping TTR means
            # bumping it here and pushing, so what this repo records is what
            # prod runs, and you can read one `git ls-tree` to know. The clone
            # is left on a detached HEAD at exactly that commit.
            if touched '^ttr($|/)|^\.gitmodules$'; then
              WANT="$(git -C "$APP" rev-parse HEAD:ttr)"
              if [ ! -d "$TTR/.git" ]; then
                echo "==> ttr: no clone at $TTR, skipping"
              elif [ ! -f "$TTR/.env" ]; then
                echo "==> ttr: no .env at $TTR, skipping"
              elif [ "$(git -C "$TTR" rev-parse HEAD)" = "$WANT" ]; then
                echo "==> ttr: already on $WANT"
              else
                echo "==> ttr: $WANT"
                git -C "$TTR" fetch origin
                git -C "$TTR" reset --hard "$WANT"
                "$TTR/venv/bin/pip" install -q -r "$TTR/requirements.txt"
                sudo systemctl restart tickettoride || echo "tickettoride service not installed yet"
              fi
            else
              echo "==> ttr: unchanged, leaving it running"
            fi

            echo "==> Deploy complete"
