name: World record reel

# Started by Drive itself the moment a lap becomes a record (`_maybe_wr_reel`),
# and every ten minutes as a backstop: any world record set since the last
# look, filmed and posted to Instagram as soon as it is seen - all of a burst at
# once, one runner each, each posted as soon as it and the ones set before it
# are filmed. Every six hours between the dailies, also
# the next record off the queue, or every third time a room race.
# See drive/tools/wr_queue.py.
on:
  schedule:
    - cron: "*/10 * * * *"
    # The daily reel has 05:10; these are the other three six-hour slots.
    - cron: "10 11,17,23 * * *"
  workflow_dispatch:
    inputs:
      urgent:
        description: "Only new world records (skip the queue and races)"
        type: boolean
        default: false
      post:
        description: "Post to Instagram"
        type: boolean
        default: true

concurrency:
  group: wr-reel
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      reels: ${{ steps.plan.outputs.reels }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: drive/tools
      - id: plan
        run: |
          URGENT=""
          if [ "${{ github.event.schedule }}" = "*/10 * * * *" ] || [ "${{ inputs.urgent }}" = true ]; then URGENT=--urgent; fi
          REELS="$(python3 drive/tools/wr_queue.py --out reels $URGENT)"
          echo "filming: $REELS"
          echo "reels=$REELS" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wr-state
          path: reels/wr-state.next.json

  # One runner per reel: ~15 minutes of software GL each, and sharing a runner
  # made them 35-60 minutes each - a burst would fall behind.
  film:
    needs: plan
    if: needs.plan.outputs.reels != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # A race reel is the whole comeback, two or three minutes of film, and a
    # reel may then wait on the films before it.
    strategy:
      fail-fast: false
      matrix:
        reel: ${{ fromJSON(needs.plan.outputs.reels) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            drive/tools
            drive/static/fonts
            drive/static/img
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install playwright==1.62.0
          playwright install --with-deps chromium
      - run: python drive/tools/shoot_daily.py ${{ matrix.reel.args }} --out reels
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ matrix.reel.name }}
          path: reels/
      - name: Publish to the box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "reels/*"
          target: /home/ubuntu/website/drive/static
      # Posted the moment it is filmed, once every record set before it is up -
      # so the order holds and nobody waits on the slowest film in the batch.
      # A reel before it that failed leaves a .failed marker rather than a
      # .posted one, and is not waited for.
      - name: Post to Instagram, in order
        if: github.event_name == 'schedule' || inputs.post
        uses: appleboy/ssh-action@v1.0.3
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          NAME: ${{ matrix.reel.name }}
          AFTER: ${{ join(matrix.reel.after, ' ') }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IG_TOKEN,NAME,AFTER
          command_timeout: 180m
          script: |
            set -e
            F=/home/ubuntu/data/ig_token
            if [ ! -s "$F" ]; then (umask 077; printf %s "$IG_TOKEN" > "$F"); fi
            R=/home/ubuntu/website/drive/static/reels
            rm -f "$R/$NAME.failed"
            for a in $AFTER; do
              until [ -f "$R/$a.posted" ] || [ -f "$R/$a.failed" ]; do sleep 20; done
            done
            [ -f "$R/$NAME.posted" ] || python3 /home/ubuntu/website/drive/tools/post_reel.py "$NAME"
      - name: Let the reels after this one go
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        env:
          NAME: ${{ matrix.reel.name }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NAME
          script: touch "/home/ubuntu/website/drive/static/reels/$NAME.failed"

  save:
    needs: [plan, film]
    # A run with nothing to film has nothing to save: no new record means the
    # state did not move.
    if: always() && needs.plan.outputs.reels != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wr-state
          path: reels
      - name: Publish the state to the box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "reels/wr-state.next.json"
          target: /home/ubuntu/website/drive/static
      - name: Swap it in once every reel is up
        uses: appleboy/ssh-action@v1.0.3
        env:
          NAMES: ${{ join(fromJSON(needs.plan.outputs.reels).*.name, ' ') }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NAMES
          script: |
            R=/home/ubuntu/website/drive/static/reels
            # Only once every one is up, so a failed reel is planned again; the
            # ones that did post have a .posted marker and are skipped.
            for n in $NAMES; do [ -f "$R/$n.posted" ] || { echo "$n not posted, state kept"; exit 0; }; done
            mv "$R/wr-state.next.json" "$R/wr-state.json"
