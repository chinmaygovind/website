<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#15121f"/>
  <title>{% block title %}King of Tokyo{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json"/>
  <link rel="icon" href="/static/img/icon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/icon-32.png"/>
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="King of Tokyo"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}"/>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
  <!-- The heartbeat behind the green dot on cgovind.com/accounts. Inline
       rather than a file of its own: it is a dozen lines, and a new file would
       have to join `sw.js`'s precache list to work offline, which is a lot of
       machinery for a ping. -->
  <script>
    (function () {
      var where = {{ (presence_where or 'home')|tojson }};
      function ping() {
        // A hidden tab is not somebody playing. Skipping it is most of what
        // makes the dot honest about a browser left open for three days.
        if (document.hidden || !{{ 'true' if current_user else 'false' }}) return;
        try {
          fetch('/api/presence', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ where: where }), keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      }
      ping();
      setInterval(ping, 60000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) ping();
      });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
    }
  </script>
</body>
</html>
