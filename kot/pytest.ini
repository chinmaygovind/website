[pytest]
# `strength` is the bot's self-play strength suite: three tests that play a few
# hundred real games to assert the bot is actually good, and they were 24s of kot's
# 31s. They are deselected by default and turned back on by `scripts/tests.sh` when
# `--all` is passed or when `kot/bot.py` / `kot/cards.py` actually changed, which is
# the only time bot strength can have regressed.
#
# `addopts` is prepended to the command line, so a later `-m` wins - that is how the
# runner re-enables them (`-m ""` selects everything again).
#
# The risk this creates is the one CLAUDE.md already warns about: a skipped test
# reads as a pass. So `tests.sh` prints a line saying they were left out, rather
# than letting a green run quietly mean less than it looks like.
markers =
    strength: expensive bot self-play; only run on --all or a change to bot.py/cards.py
addopts = -m "not strength"
