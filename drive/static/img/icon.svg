<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Drive</title>
  <rect width="64" height="64" rx="10" fill="#4d5460"/>
  <!-- road markings -->
  <g fill="#f2f2f2" opacity=".55">
    <rect x="30.5" y="2" width="3" height="9" rx="1.5"/>
    <rect x="30.5" y="53" width="3" height="9" rx="1.5"/>
  </g>
  <g fill="#f2f2f2" opacity=".8">
    <rect x="5" y="4" width="3" height="56"/>
    <rect x="56" y="4" width="3" height="56"/>
  </g>
  <!-- car, seen from above -->
  <g>
    <rect x="16" y="19" width="7" height="9" rx="2" fill="#1c1f26"/>
    <rect x="41" y="19" width="7" height="9" rx="2" fill="#1c1f26"/>
    <rect x="16" y="37" width="7" height="9" rx="2" fill="#1c1f26"/>
    <rect x="41" y="37" width="7" height="9" rx="2" fill="#1c1f26"/>
    <rect x="19" y="14" width="26" height="37" rx="7" fill="#c0182b"/>
    <rect x="23" y="20" width="18" height="10" rx="3" fill="#2b3240"/>
    <rect x="23" y="38" width="18" height="7" rx="3" fill="#8f0f1e"/>
  </g>
</svg>
