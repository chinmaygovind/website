<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#faf8f4"/>
  <title>{% block title %}Drive{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json"/>
  <link rel="icon" href="/static/img/icon.svg"/>
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Drive"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}"/>
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% block body %}{% endblock %}
  <!-- Before any page's own script: a guest's unsaved times are handed over the
       moment the browser is logged in, whichever page that turns out to be. -->
  <script>
    window.DRIVE_USER = {{ 'true' if current_user else 'false' }};
    window.DRIVE_TRACK_NAMES = {{ track_names|tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/pending.js') }}?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
    }
  </script>
</body>
</html>
