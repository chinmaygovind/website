# Personal website - serves the Wii menu (and the rest of the static site) at /.
# The Flask app handles /conductor itself (302 redirect to CONDUCTOR_URL), so nginx just
# proxies everything to gunicorn on 127.0.0.1:5002.
#
# HTTPS is managed by certbot (Let's Encrypt): after this file is installed and
# DNS points cgovind.com at the box, `certbot --nginx` adds the 443 server
# blocks and an HTTP->HTTPS redirect in-place. Re-running deploy/setup.sh
# overwrites this file, so re-run certbot afterwards to restore TLS.
server {
    listen 80 default_server;
    server_name cgovind.com www.cgovind.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Conductor subdomain (the /conductor redirect target).
#
# Conductor serves everything at its own root and speaks WebSockets, so it needs
# its OWN host - it runs as its own gunicorn (eventlet worker) on 127.0.0.1:5001.
# Set CONDUCTOR_URL=https://conductor.cgovind.com in .env so /conductor redirects
# here.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name conductor.cgovind.com;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        # WebSocket upgrade headers - required for Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# ---------------------------------------------------------------------------
# There is deliberately NO server block for ttr.cgovind.com, and this note is
# here so nobody helpfully adds one back.
#
# That is the hostname Rapid7 named for Asmodee (AWS case 178949924200884-1).
# It serves nothing: no vhost, no DNS record, and its name has been taken out
# of the cgovind.com certificate. A request for it does not reach the box.
#
# It did 301 to conductor.cgovind.com for a few hours. That was removed on
# purpose - a redirect is still that hostname answering, and the point is that
# it does not answer.
#
# If it ever has to resolve again, put the name back in the certificate FIRST.
# A cert whose SAN list holds a hostname that no longer resolves fails HTTP-01
# at renewal, and every other name on the same cert goes down with it - here
# that is cgovind.com and www.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Egyptian Rat Screw subdomain - same deal as TTR: its own eventlet gunicorn
# (127.0.0.1:5003), speaks WebSockets, served from website/ers. Shares the TTR
# accounts DB so one login works on both. Set /ers on the main site to redirect
# here via ERS_URL=https://ers.cgovind.com.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name ers.cgovind.com;

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# ---------------------------------------------------------------------------
# The GTO poker trainer - gto.cgovind.com, plain gunicorn on 127.0.0.1:5006.
#
# No WebSocket upgrade headers here, because it does not speak WebSockets: a
# single player acts and the server answers. The long read/send timeouts the
# game subdomains need are absent for the same reason - nothing holds a
# connection open, and a request that takes 86400 seconds is a bug, not a
# player thinking.
#
# The avatars are served by the app, not by nginx, because they are photographs
# of real people and only their owner may see them. Handing that off to a
# `location /avatars/` alias would put them on the public internet.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name gto.cgovind.com;

    location / {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
