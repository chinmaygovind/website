{
  id: "det", name: "object detection", title: "Object detection (YOLO)", tag: "exam section 4 · project 8", glyph: [[1,1,1],[1,0,1],[1,1,1]],
  lessons: [
    {h: "What a detector outputs", b: () => `
      <p class="lede">Image classification answers one question: what is in this picture? Object detection answers two questions for every object at once: what is it, and where is it?</p>
      <p>The "where" is a <b>bounding box</b>, the smallest axis-aligned rectangle around the object. The "what" is a <b>class label</b>, such as pedestrian, traffic light or car. So a detector's answer for one image is a list of boxes, each carrying a class and a score that says how sure the detector is.</p>
      ${fig("seg-5", "Detection gives a box and a label per object; segmentation labels pixels instead")}
      <h4>Two ways to write a box</h4>
      <p>Project 8 writes every ground-truth box as <span class="mono">(class, x1, y1, x2, y2)</span> in pixels. The point (x1, y1) is the top-left corner and (x2, y2) is the bottom-right corner. As usual, x runs to the right (columns) and y runs down (rows).</p>
      <p>The network itself thinks in a different format: a <b>center</b> (cx, cy) plus a <b>width and height</b> (w, h). Converting between the two is simple arithmetic, and the exam expects you to do it without thinking:</p>
      ${eq("cx = (x1 + x2) / 2, &nbsp; cy = (y1 + y2) / 2, &nbsp; w = x2 − x1, &nbsp; h = y2 − y1")}
      ${eq("x1 = cx − w/2, &nbsp; y1 = cy − h/2, &nbsp; x2 = cx + w/2, &nbsp; y2 = cy + h/2")}
      ${worked("Convert one box", `
        <p>The car box (2, 40, 20, 72, 60) has class 2 (car).</p>
        <ol><li>Center: cx = (40 + 72)/2 = <b>56</b>, cy = (20 + 60)/2 = <b>40</b>.</li>
        <li>Size: w = 72 − 40 = <b>32</b>, h = 60 − 20 = <b>40</b>.</li></ol>`)}
      <h4>Detection versus segmentation</h4>
      <p>The segmentation lecture lined up three related tasks. <b>Object detection</b> outputs N boxes, each with 4 numbers and C class scores. <b>Semantic segmentation</b> labels every pixel with a class but does not separate two people standing side by side. <b>Instance segmentation</b> gives every object its own pixel mask, so two people get two masks.</p>
      ${idea("A detection is (class, score, box). The box can be written as corners (x1, y1, x2, y2) or as center and size (cx, cy, w, h). Always check which one a formula or a line of code expects.")}`,
      quick: [{t: "vec", q: "Box (x1, y1, x2, y2) = (12, 30, 52, 90). What are cx, cy, w, h?", fmt: "cx, cy, w, h", a: [32,60,40,60], tol: 0, why: "cx = (12 + 52)/2 = 32, cy = (30 + 90)/2 = 60, w = 40, h = 60."}]},

    {h: "IoU: how much two boxes overlap", b: () => `
      <p class="lede">Almost every step of detection needs one number: how much do two boxes overlap? That number is the Intersection over Union, or IoU.</p>
      ${eq("IoU(A, B) = area(A ∩ B) / area(A ∪ B) = inter / (area<sub>A</sub> + area<sub>B</sub> − inter)")}
      ${fig("yolo-43", "IoU near 0 is a poor match, near 1 is an excellent one; 0.5 is the usual cutoff")}
      <p>The intersection of two axis-aligned boxes is itself a box. Its left edge is the <b>larger</b> of the two left edges, and its right edge is the <b>smaller</b> of the two right edges. The same goes for top and bottom. If the boxes don't overlap, the width or height comes out negative, so you clamp it at 0.</p>
      ${worked("Compute IoU by hand", `
        <p>A = (10, 10, 50, 50) and B = (30, 30, 70, 70).</p>
        <ol><li>Intersection corners: x1 = max(10, 30) = 30, y1 = max(10, 30) = 30, x2 = min(50, 70) = 50, y2 = min(50, 70) = 50.</li>
        <li>Intersection area: max(0, 50 − 30) · max(0, 50 − 30) = 20 · 20 = 400.</li>
        <li>Each box is 40 × 40 = 1600, so the union is 1600 + 1600 − 400 = 2800. We subtract the intersection because it was counted twice.</li>
        <li>IoU = 400 / 2800 = <b>1/7 ≈ 0.143</b>. These boxes barely match.</li></ol>`)}
      <h4>Where IoU is used</h4>
      <ul><li><b>Evaluation:</b> a detection counts as correct (a true positive) only if its IoU with a ground-truth box of the same class is at least 0.5.</li>
      <li><b>NMS:</b> two detections of the same class with IoU above 0.5 are treated as duplicates.</li>
      <li><b>Training:</b> in Project 8 the confidence target for an occupied cell is the IoU between the predicted box and the true box.</li></ul>
      ${idea("Intersection uses max of the starts and min of the ends, clamped at 0. Union = sum of areas minus the intersection. Forgetting either the clamp or the minus is the classic IoU bug.")}`,
      quick: [{t: "num", q: "IoU of (0, 0, 40, 40) and (5, 0, 45, 40)? (A fraction is fine.)", a: 7/9, tol: .005, why: "Intersection 35 × 40 = 1400. Union 1600 + 1600 − 1400 = 1800. IoU = 1400/1800 = 7/9 ≈ 0.778."}]},

    {h: "YOLO: one grid, one pass", b: () => `
      <p class="lede">YOLO stands for "You Only Look Once". Instead of proposing regions and classifying each one, it runs the image through a single network that outputs every box at once. The trick is a fixed grid.</p>
      <p>The image is divided into an S × S grid of cells. Each cell is responsible for the objects whose <b>center</b> falls inside it, and it predicts a small fixed-length vector. Stacking those vectors gives an output tensor of shape S × S × (B·5 + C), where B is the number of boxes per cell and C the number of classes.</p>
      ${fig("yolo-30", "Original YOLO: S = 7, B = 2, C = 20, so the output is 7 × 7 × 30")}
      <h4>Project 8's version</h4>
      <p>The project uses 128 × 128 images and an 8 × 8 grid, so each cell is 16 × 16 pixels. Each cell predicts just <b>one</b> box (B = 1) and three classes (C = 3), so the output is 8 × 8 × 8, stored as <span class="mono">[N, channel, row, column]</span>:</p>
      <div class="scroll"><table class="t"><tr><th>Channel</th><th>Meaning</th><th>Activation</th></tr>
      <tr><td>0</td><td>Confidence (object indicator in the labels)</td><td>sigmoid</td></tr>
      <tr><td>1–2</td><td>Center offset (x, y) inside the cell, divided by 16</td><td>sigmoid</td></tr>
      <tr><td>3–4</td><td>Width and height, divided by 128</td><td>sigmoid</td></tr>
      <tr><td>5–7</td><td>Class probabilities (one-hot in the labels)</td><td>softmax</td></tr></table></div>
      <p>The backbone halves the image four times (128 → 64 → 32 → 16 → 8) with stride-2 convolutions, so the 8 × 8 feature map lines up exactly with the 8 × 8 grid.</p>
      ${fig("yolo-78", "Find the box center, assign it to the cell that contains it, then store the offset inside that cell")}
      ${worked("Encode a box into the label tensor", `
        <p>Car box (2, 40, 20, 72, 60). From the last article, its center is (56, 40) and its size is 32 × 40.</p>
        <ol><li>Responsible cell: column = ⌊56 / 16⌋ = <b>3</b>, row = ⌊40 / 16⌋ = <b>2</b>. Note that x picks the column and y picks the row.</li>
        <li>Offsets inside the cell: x = (56 mod 16)/16 = 8/16 = <b>0.5</b>, y = (40 mod 16)/16 = 8/16 = <b>0.5</b>. The center sits in the middle of its cell.</li>
        <li>Sizes: w = 32/128 = <b>0.25</b>, h = 40/128 = <b>0.3125</b>. Sizes are relative to the whole image, not the cell.</li>
        <li>Write [1, 0.5, 0.5, 0.25, 0.3125, 0, 0, 1] into <span class="mono">encoded[n, :, 2, 3]</span>. The 1 in channel 7 is the one-hot "car".</li></ol>`)}
      <h4>Decoding goes the other way</h4>
      <p>For the cell at (row r, column c): cx = (c + x-offset) · 16, cy = (r + y-offset) · 16, w = w-channel · 128, h = h-channel · 128. Then convert center and size to corners. The class is the argmax of channels 5–7, and the <b>detection score</b> is confidence × the highest class probability.</p>
      <h4>Cell collisions</h4>
      <p>One box per cell means that if two object centers land in the same 16 × 16 cell, only one can be written into the labels. Project 8 keeps the <b>larger</b> box. The other object can never be detected, however good the network gets. Crowds of small pedestrians suffer most.</p>
      ${idea("Offsets are relative to the cell (÷16); sizes are relative to the image (÷128). Column comes from x, row comes from y. One box per cell means colliding centers lose an object before training even starts.")}`,
      quick: [{t: "vec", q: "Cell (row 5, column 2) predicts x-offset 0.25, y-offset 0.75, w 0.125, h 0.25. Decode the box (x1, y1, x2, y2) in pixels.", fmt: "x1, y1, x2, y2", a: [28,76,44,108], tol: 0, why: "cx = (2 + 0.25)·16 = 36, cy = (5 + 0.75)·16 = 92, w = 16, h = 32. Corners: (36 − 8, 92 − 16, 36 + 8, 92 + 16)."}]},

    {h: "The YOLO loss", b: () => `
      <p class="lede">The network learns by comparing its 8 × 8 × 8 output with the label tensor. The YOLO loss is a sum of squared errors, but each part is weighted to fix a specific problem.</p>
      ${fig("yolo-62", "Location loss, confidence loss and classification loss")}
      <p>Project 8 implements this version. Here o<sub>i</sub> is 1 if cell i holds an object and 0 otherwise:</p>
      ${eq("L = 5 Σ o<sub>i</sub> ‖x̂<sub>i</sub> − x<sub>i</sub>‖² + 5 Σ o<sub>i</sub> ‖√ŝ<sub>i</sub> − √s<sub>i</sub>‖² + Σ o<sub>i</sub> (Ĉ<sub>i</sub> − IoU<sub>i</sub>)² + 0.5 Σ (1 − o<sub>i</sub>) Ĉ<sub>i</sub>² + Σ o<sub>i</sub> ‖p̂<sub>i</sub> − p<sub>i</sub>‖²")}
      <p>Sum over all cells, then divide by the batch size. Each term has a reason:</p>
      <ul><li><b>λ<sub>coord</sub> = 5 on the box terms.</b> Getting the location right matters most, so its error is weighted up.</li>
      <li><b>Square roots of width and height.</b> A 4-pixel error on a 100-pixel car is small, but on a 10-pixel traffic light it is huge. Taking square roots first makes the same absolute error cost more on a small box.</li>
      <li><b>Confidence target = IoU.</b> An occupied cell's confidence should say how good its box is, not just that an object exists. The IoU is computed with <span class="mono">torch.no_grad()</span> (a "stop-gradient"), because it is a moving target: we don't want the network to change its box just to change the target.</li>
      <li><b>λ<sub>noobj</sub> = 0.5 on empty cells.</b> Most of the 64 cells are empty. Without down-weighting, the many "no object here" errors would drown out the few real objects, and the network would learn to predict 0 everywhere. This is a <b>class imbalance</b> problem.</li>
      <li><b>Class error only in occupied cells.</b> An empty cell has no class to learn.</li></ul>
      ${fig("yolo-75", "Why the square root: equal absolute errors should not cost the same on small and large boxes")}
      ${fig("yolo-83", "Most cells are background, so the no-object term is weighted down by λnoobj = 0.5")}
      <h4>Squared error versus cross-entropy for confidence</h4>
      <p>The practice exam asks you to compare two losses for the confidence C = σ(a), where a is the raw network output (the logit) and σ′(a) = σ(a)(1 − σ(a)).</p>
      ${worked("Derive ∂L/∂a for both losses", `
        <ol><li><b>Squared error</b> L = (C − C<sub>gt</sub>)². The chain rule gives ∂L/∂a = 2(C − C<sub>gt</sub>) · C(1 − C).</li>
        <li><b>Binary cross-entropy</b> L = −[C<sub>gt</sub> ln C + (1 − C<sub>gt</sub>) ln(1 − C)]. First ∂L/∂C = −C<sub>gt</sub>/C + (1 − C<sub>gt</sub>)/(1 − C). Multiply by C(1 − C): ∂L/∂a = −C<sub>gt</sub>(1 − C) + (1 − C<sub>gt</sub>)C = <b>C − C<sub>gt</sub></b>.</li>
        <li>Plug in a confident mistake, C<sub>gt</sub> = 1 and C = 0.02. BCE: |0.02 − 1| = <b>0.98</b>. Squared error: 2 · 0.98 · 0.02 · 0.98 ≈ <b>0.038</b>.</li></ol>
        <p>The squared-error gradient carries the factor C(1 − C), which goes to 0 when the sigmoid saturates. So a confidently wrong prediction gets almost no push. BCE's gradient is just the error, so it corrects confident mistakes fastest.</p>`)}
      ${idea("λcoord = 5 (boxes matter), √w √h (small boxes matter), confidence target = IoU (with no gradient), λnoobj = 0.5 (fight class imbalance). BCE gives ∂L/∂a = C − Cgt; squared error multiplies that by 2C(1 − C), which vanishes when the sigmoid saturates.")}`,
      quick: [{t: "mc", q: "Why does the YOLO loss multiply the no-object confidence term by 0.5?", opts: ["Most cells are empty, so without it background errors dominate training", "Empty cells have no class, so their loss is undefined", "It makes the loss a probability", "To speed up NMS"], a: 0, why: "This is class imbalance: far more empty cells than occupied ones."}]},

    {h: "From 64 cells to a clean list: filtering and NMS", b: () => `
      <p class="lede">The network always outputs 64 candidate boxes, one per cell. Post-processing turns them into a short list of confident, non-duplicate detections in two steps.</p>
      <h4>Step 1: score filtering</h4>
      <p>Each cell's detection score is confidence × its highest class probability. Project 8 keeps only cells with score ≥ 0.3. This throws away the background cells.</p>
      ${worked("Score one cell", `
        <p>Confidence 0.8, class probabilities [0.1, 0.6, 0.3]. The best class is 1 (traffic light) with probability 0.6, so the score is 0.8 · 0.6 = <b>0.48</b>. It passes a 0.3 threshold.</p>`)}
      <h4>Step 2: non-maximum suppression (NMS)</h4>
      <p>One object often lights up several neighboring cells, giving overlapping duplicates. Greedy NMS keeps the best one and removes the copies:</p>
      <ol><li>Sort the remaining detections by score, highest first.</li>
      <li>Keep the top one.</li>
      <li>Remove every remaining detection of the <b>same class</b> whose IoU with it is <b>greater than</b> 0.5.</li>
      <li>Repeat with the highest-scoring detection that is left, until none are left.</li></ol>
      ${fig("yolo-37", "Sort by score, then suppress same-class boxes with IoU > 0.5")}
      ${fig("pr-3", "Greedy NMS: B is removed by A, so B can no longer remove C")}
      ${worked("Run NMS by hand", `
        <p>Four car detections: A 0.9, B 0.8, C 0.7, D 0.6, with IoU(A, B) = 0.6, IoU(A, C) = 0.2, IoU(A, D) = 0.1, IoU(B, C) = 0.7, IoU(B, D) = 0, IoU(C, D) = 0.55.</p>
        <ol><li>Keep A. Compare the rest with A: B has 0.6 &gt; 0.5, so B is removed. C (0.2) and D (0.1) stay.</li>
        <li>Keep C, the best one left. D has IoU 0.55 with C, so D is removed.</li>
        <li>Nothing is left. Result: <b>A and C</b>. B's large overlap with C never mattered, because B was gone.</li></ol>`)}
      <p>The slide above shows a subtle point. A beats B, and B overlaps C strongly, but C survives. That's because B was already removed before it got the chance to suppress anything. Only boxes that are <b>kept</b> can suppress others.</p>
      <p>NMS runs <b>per class</b>. A pedestrian standing in front of a car can overlap the car box heavily, but they are different objects, so neither should remove the other.</p>
      <h4>What lowering the threshold can and can't fix</h4>
      <p>Lowering the score threshold lets more weak detections through, so it can recover objects the network was unsure about. It cannot recover an object that NMS removed, and it cannot recover an object lost to a cell collision, because no cell ever predicted it.</p>
      ${idea("Filter by score first, then NMS per class: sort descending, keep the best, drop same-class boxes with IoU > 0.5, repeat. Only kept boxes suppress others.")}`,
      quick: [{t: "mc", q: "Two same-class detections have IoU 0.5 exactly. With the rule \"remove if IoU > 0.5\", what happens to the lower-scoring one?", opts: ["It is kept", "It is removed", "Both are removed", "It depends on the class"], a: 0, why: "0.5 is not greater than 0.5, so it survives."}]},

    {h: "Precision, recall and average precision", b: () => `
      <p class="lede">How do you score a detector? Accuracy doesn't work: there is no fixed set of "negatives" to count. Instead we ask two questions, and then summarize how the answers trade off.</p>
      ${eq("precision = TP / (TP + FP) = (correct detections) / (all detections)")}
      ${eq("recall = TP / N<sub>GT</sub> = (objects found) / (all ground-truth objects)")}
      <p>A detection is a <b>true positive</b> if its IoU with a not-yet-matched ground-truth box of the same class is ≥ 0.5. Everything else is a <b>false positive</b>, including a second detection of an object that was already matched. Precision asks "of what I said, how much was right?" Recall asks "of what was there, how much did I find?"</p>
      <h4>The precision–recall curve</h4>
      <p>Sort all detections of one class by score. Walk down the list, adding one detection at a time, and record (recall, precision) after each. Lowering the threshold this way can only raise recall, but precision zig-zags: a false positive pushes it down, a true positive pulls it back up.</p>
      ${fig("pr-25", "Lecture example: 4 ground-truth objects, detections TP, FP, TP, TP, FP")}
      <h4>Average precision (AP)</h4>
      <p>AP summarizes the whole curve in one number. The practice exam uses the <b>interpolated</b> precision: P<sub>interp</sub>(r) is the highest precision at any recall ≥ r. This removes the zig-zags.</p>
      ${eq("AP = Σ<sub>k</sub> (R<sub>k</sub> − R<sub>k−1</sub>) · P<sub>interp</sub>(R<sub>k</sub>), &nbsp; over the distinct recall values reached, with R<sub>0</sub> = 0")}
      ${worked("AP for the lecture example", `
        <p>4 ground truths, detections in score order: TP, FP, TP, TP, FP.</p>
        <ol><li>(recall, precision) after each: (0.25, 1), (0.25, 0.5), (0.5, 0.67), (0.75, 0.75), (0.75, 0.6).</li>
        <li>Distinct recalls: 0.25, 0.5, 0.75.</li>
        <li>P<sub>interp</sub>(0.25) = max precision at recall ≥ 0.25 = 1. P<sub>interp</sub>(0.5) = max(0.67, 0.75, 0.6) = 0.75. P<sub>interp</sub>(0.75) = 0.75.</li>
        <li>AP = 0.25 · 1 + 0.25 · 0.75 + 0.25 · 0.75 = <b>0.625</b>.</li></ol>
        <p>The detector never found the 4th object, so recall stops at 0.75 and AP can't reach 1, no matter how well it ranks.</p>`)}
      <h4>Why AP and not one precision/recall pair</h4>
      <p>Two detectors can tie on precision and recall at a single threshold but rank their detections differently. AP rewards putting the true positives <b>first</b>: a false positive at rank 1 hurts precision at every recall level after it, while the same false positive at rank 6 hurts nothing. AP also has a loophole the lecture pointed out: duplicates ranked below all the true positives cost nothing, because full recall was already reached at perfect precision.</p>
      ${idea("Precision = TP/(all detections). Recall = TP/(all ground truths). AP = area under the interpolated PR curve: for each recall step, multiply the step by the best precision at that recall or later. AP < 1 whenever some object is never found or a false positive outranks a true positive.")}`,
      quick: [{t: "vec", q: "6 ground-truth objects. Above some threshold the detector outputs 5 boxes, 4 of them true positives. Precision and recall?", fmt: "precision, recall", a: [0.8,4/6], tol: .005, why: "Precision 4/5 = 0.8. Recall 4/6 ≈ 0.667."}]},

    {h: "Beyond one grid: anchors, scales and segmentation", b: () => `
      <p class="lede">YOLO v1's design has known weak spots. The later lectures show how other detectors fix them, and the exam's "propose a change" questions draw on these ideas.</p>
      <h4>Weak spots of a single grid with one box per cell</h4>
      <ul><li><b>Cell collisions.</b> Two centers in one cell means one object is lost. Fixes: a finer grid (cost: more cells, less context per cell, more empty cells), or several boxes per cell, as in original YOLO's B = 2 or anchor-based detectors (cost: more outputs and a rule for which box is responsible).</li>
      <li><b>Small objects.</b> After four stride-2 stages, a 6-pixel traffic light is less than half a feature cell. Fixes: predict from several resolutions, a <b>feature pyramid</b> (FPN), so small objects are handled on a fine map and large ones on a coarse map (cost: more computation).</li>
      <li><b>Duplicates of overlapping same-class objects.</b> Two cars close together can have IoU > 0.5, and NMS will delete the real second car. Fixes: a higher NMS threshold (cost: more duplicates survive) or soft/matrix NMS that lowers scores instead of deleting.</li></ul>
      <h4>Anchors</h4>
      <p>An <b>anchor</b> is a default box with a preset size and aspect ratio placed at each grid location. The network predicts small corrections to the anchor instead of a box from scratch, and each ground truth is assigned to the anchor it overlaps best. Anchors make tall pedestrians and wide cars at the same location easy to separate, but they add hyper-parameters (scales, ratios, density) that must be tuned to the dataset. Anchor-free detectors such as FCOS and FoveaBox predict directly from each location.</p>
      <h4>Focal loss</h4>
      <p>Cross-entropy for the right class is −ln p<sub>t</sub>. Focal loss multiplies it by (1 − p<sub>t</sub>)<sup>γ</sup>. When an example is already easy (p<sub>t</sub> near 1), the factor is tiny, so the flood of easy background locations stops dominating. It attacks the same class imbalance that λ<sub>noobj</sub> does, but adaptively.</p>
      ${worked("Focal loss on two examples", `
        <p>γ = 2. An easy background location has p<sub>t</sub> = 0.9; a hard one has p<sub>t</sub> = 0.2.</p>
        <ol><li>Cross-entropy: −ln 0.9 ≈ 0.105 and −ln 0.2 ≈ 1.609.</li>
        <li>Focal factors: (1 − 0.9)² = 0.01 and (1 − 0.2)² = 0.64.</li>
        <li>Focal loss: 0.01 · 0.105 ≈ 0.001 and 0.64 · 1.609 ≈ 1.03. The easy example now counts about 1000× less than the hard one, instead of 15× less.</li></ol>`)}
      ${fig("seg-91", "Focal loss down-weights easy examples by (1 − pt)^γ")}
      <h4>SOLO: segmentation by location</h4>
      <p>SOLO applies the YOLO idea to instance segmentation. It puts an S × S grid on the image; the cell containing an object's center is responsible for it. A category branch predicts the class per cell, and a mask branch predicts S² full-image masks, where the mask for cell (i, j) lives in channel <b>k = i·S + j</b>. Instances are told apart purely by where they are, and objects at the same location by size (different pyramid levels).</p>
      ${fig("seg-77", "SOLO: the instance at grid cell (i, j) gets mask channel k = i × S + j")}
      ${idea("Single-grid YOLO loses colliding and tiny objects. Fixes: more boxes per cell or anchors, a finer grid, multi-scale feature pyramids. Each fix costs computation or extra hyper-parameters. Focal loss (1 − pt)^γ fights class imbalance. SOLO: grid cell (i, j) owns mask channel i·S + j.")}`,
      quick: [{t: "num", q: "SOLO with S = 5. Which mask channel k belongs to the object centered in grid cell (i, j) = (2, 3)?", a: 13, tol: 0, why: "k = i·S + j = 2·5 + 3 = 13."}]}
  ],

     accept: ["boxes[boxes[:,1]>=threshold]","boxes[np.where(boxes[:,1]>=threshold)]","boxes[np.where(boxes[:,1]>=threshold)[0]]","boxes[threshold<=boxes[:,1]]"], model: "boxes[boxes[:, 1] >= threshold]"},
    {t: "fill", q: "In <code>yolo_loss</code>: the no-object confidence term, using <code>pred_conf</code> ([B, 8, 8]) and the boolean mask <code>noobj</code>.", src: "loss_noobj = ____",
     accept: ["0.5*(pred_conf[noobj]**2).sum()","0.5*pred_conf[noobj].pow(2).sum()","0.5*torch.sum(pred_conf[noobj]**2)","((pred_conf[noobj]**2).sum())*0.5","0.5*(pred_conf[noobj]*pred_conf[noobj]).sum()"], model: "0.5 * (pred_conf[noobj] ** 2).sum()"},
    {t: "vec", q: "What does this print? A batch of 4 images contains 5 occupied cells in total.<pre><code>output = model(images)            # [4, 8, 8, 8]\nobj = target[:, 0] > 0.5          # [4, 8, 8]\npred_xy = output[:, 1:3].permute(0, 2, 3, 1)[obj]\nprint(tuple(pred_xy.shape))</code></pre>", fmt: "dim0, dim1", a: [5,2], tol: 0, why: "permute gives [4, 8, 8, 2]; a [4, 8, 8] boolean mask picks the 5 True cells, leaving [5, 2]."}
  ]
},
{
  id: "gen", name: "vae & diffusion", title: "VAE & diffusion models", tag: "exam section 5 · project 9", glyph: [[1,0,.5],[0,1,0],[.5,0,1]],
  lessons: [
    {h: "Generative models and latent variables", b: () => `
      <p class="lede">Everything so far took an image in and produced something about it. A generative model runs the other way: it produces brand-new images that look like they came from the training set.</p>
      <p>Write <span class="mono">p(x)</span> for the probability of an image x under the true distribution of, say, faces. A generative model tries to learn this distribution well enough to <b>sample</b> from it. Directly describing p(x) over millions of pixels is hopeless, so both the VAE and diffusion use a two-step recipe built on a hidden variable z, called the <b>latent</b> variable:</p>
      <ol><li>Draw a latent code z from a simple distribution p(z), usually a standard Gaussian N(0, I). This is called the <b>prior</b>.</li>
      <li>Push z through a neural network (the <b>decoder</b>) that defines p(x | z), and draw the image from it.</li></ol>
      ${fig("vae-7", "The four distributions in a VAE and what each one does")}
      <p>The table above is worth memorizing. The prior p(z) is fixed. The decoder p<sub>θ</sub>(x | z) is learned (θ are its weights). The exact posterior p(z | x), meaning "which codes could have produced this image", is what we would need for training, but it can't be computed. So we train a second network, the <b>encoder</b> q<sub>φ</sub>(z | x), to approximate it (φ are the encoder's weights).</p>
      <h4>Why we can't just maximize p(x)</h4>
      <p>Training should make the real images likely. But the likelihood of one image is an integral over every possible code: ${eq("p(x) = ∫ p(z) p(x | z) dz")} With a neural-network decoder, this integral has no closed form. The VAE's whole trick is to replace it with a lower bound that we can compute.</p>
      ${worked("Let's marginalize a toy model by hand", `
        <p>Suppose there are only two latent codes, z<sub>1</sub> and z<sub>2</sub>, each with prior probability p(z) = 0.5. For one particular image x, the decoder says p(x | z<sub>1</sub>) = 0.2 and p(x | z<sub>2</sub>) = 0.6.</p>
        <ol><li>With a discrete z, the integral becomes a sum: p(x) = Σ<sub>z</sub> p(z) p(x | z).</li>
        <li>p(x) = 0.5 × 0.2 + 0.5 × 0.6 = 0.1 + 0.3 = <b>0.4</b>.</li>
        <li>By Bayes' rule the exact posterior is p(z<sub>1</sub> | x) = 0.1/0.4 = 0.25 and p(z<sub>2</sub> | x) = 0.3/0.4 = 0.75. With two codes this is easy. With a continuous, high-dimensional z and a neural decoder there are infinitely many terms, which is why we train an encoder to <i>approximate</i> the posterior instead.</li></ol>`)}
      <h4>Autoencoder versus variational autoencoder</h4>
      <p>A plain <b>autoencoder</b> squeezes an image into a small code and decodes it back. Its code is a single point, and nothing forces the codes of different images to fill the space nicely, so decoding a random code usually gives garbage. A <b>VAE</b> makes the encoder output a whole Gaussian distribution, with a mean μ and a variance σ², and pushes those Gaussians toward the prior. Then a random code drawn from N(0, I) lands somewhere the decoder knows how to handle.</p>
      ${fig("vae-14", "The VAE: the encoder outputs (μ, Σ) for z, we sample z, and the decoder outputs a distribution over x")}
      ${idea("To <b>generate</b> with a trained VAE you only need the decoder: sample z ~ N(0, I), then decode. The encoder is only needed during training.")}`,
      quick: [{t: "mc", q: "In a VAE, which distribution is fixed rather than learned?", opts: ["The prior p(z)", "The encoder q(z | x)", "The decoder p(x | z)", "The exact posterior p(z | x)"], a: 0, why: "The prior is chosen in advance, usually N(0, I). The encoder and decoder are networks; the exact posterior is intractable."}]},

    {h: "KL divergence and the ELBO", b: () => `
      <p class="lede">The VAE is trained by maximizing a quantity called the evidence lower bound, or ELBO. Exam question 5.1(a) asks you to derive it, so let's go through it slowly.</p>
      <h4>KL divergence: a distance between distributions</h4>
      <p>The Kullback–Leibler divergence measures how badly a distribution Q matches a distribution P:</p>
      ${eq("KL(P ‖ Q) = Σ<sub>z</sub> P(z) log [ P(z) / Q(z) ]")}
      ${fig("vae-17", "Three properties of KL: never negative, not symmetric, infinite when Q misses P's support")}
      <ul><li>It is always <b>≥ 0</b>, and it is 0 only when the two distributions are identical.</li>
      <li>It is <b>not symmetric</b>: KL(P ‖ Q) and KL(Q ‖ P) are usually different numbers, so the order matters.</li>
      <li>If P puts probability on an outcome where Q puts zero, the KL is infinite.</li></ul>
      ${worked("The slide's example: KL in both directions", `
        <p>P = (0.9, 0.1) and Q = (0.5, 0.5) over two outcomes. Use ln 1.8 ≈ 0.588, ln 0.2 ≈ −1.609, ln(5/9) ≈ −0.588 and ln 5 ≈ 1.609.</p>
        <ol><li>KL(P ‖ Q) = 0.9 ln(0.9/0.5) + 0.1 ln(0.1/0.5) = 0.9(0.588) + 0.1(−1.609) = 0.529 − 0.161 ≈ <b>0.368</b> nats.</li>
        <li>KL(Q ‖ P) = 0.5 ln(0.5/0.9) + 0.5 ln(0.5/0.1) = 0.5(−0.588) + 0.5(1.609) ≈ <b>0.511</b> nats.</li>
        <li>Different numbers, so the order matters. The weights in front of each log always come from the <b>first</b> distribution.</li></ol>`)}
      <h4>Deriving the ELBO</h4>
      <p>Start from the log-likelihood of one image, L = log p(x). Because q(z | x) sums to 1 over z, we can multiply by it for free:</p>
      ${fig("vae-26", "Splitting log p(x) into the lower bound L<sup>v</sup> plus a KL that is ≥ 0")}
      <ol><li><b>Multiply by 1:</b> log p(x) = Σ<sub>z</sub> q(z | x) log p(x).</li>
      <li><b>Bayes' rule:</b> p(x) = p(z, x) / p(z | x), so log p(x) = Σ<sub>z</sub> q(z | x) log [ p(z, x) / p(z | x) ].</li>
      <li><b>Multiply by q/q inside the log</b> and split the log of a product into a sum:
      Σ<sub>z</sub> q log [ p(z, x) / q(z | x) ] + Σ<sub>z</sub> q log [ q(z | x) / p(z | x) ].</li>
      <li>The first sum is the lower bound <b>L<sup>v</sup></b>. The second sum is KL(q(z | x) ‖ p(z | x)), which is ≥ 0. So L<sup>v</sup> ≤ log p(x).</li></ol>
      ${fig("vae-31", "Splitting the lower bound into a KL to the prior and a reconstruction term")}
      <p>Now split L<sup>v</sup> itself, using the hint p(z, x) = p(z) p(x | z):</p>
      ${eq("L<sup>v</sup> = Σ<sub>z</sub> q(z | x) log [ p(z) / q(z | x) ] + Σ<sub>z</sub> q(z | x) log p(x | z) = −KL(q(z | x) ‖ p(z)) + E<sub>z~q(z|x)</sub>[ log p(x | z) ]")}
      <ul><li>The <b>reconstruction term</b> E[log p(x | z)] rewards the decoder for turning the encoder's codes back into the input. With a Gaussian decoder it becomes a squared error between x and the decoded image.</li>
      <li>The <b>prior-matching (KL) term</b> keeps each encoder Gaussian close to the prior N(0, I). This is what makes random codes decodable.</li></ul>
      ${fig("vae-19", "Two different KL divergences: the bound gap and the training regularizer")}
      ${idea("There are two KLs. KL(q(z|x) ‖ p(z|x)) is the <b>gap</b> between the ELBO and log p(x); we can't compute it. KL(q(z|x) ‖ p(z)) is the <b>regularizer</b> inside the ELBO; for Gaussians it has a closed form. The training loss is −ELBO = reconstruction loss + KL to the prior.")}`,
      quick: [{t: "mc", q: "log p(x) = ELBO + KL(q(z | x) ‖ p(z | x)). What does this tell you?", opts: ["ELBO ≤ log p(x), with equality when q(z|x) equals the true posterior", "ELBO ≥ log p(x)", "The ELBO equals log p(x) whenever the decoder is perfect", "The KL term is the reconstruction loss"], a: 0, why: "The KL is never negative, so the ELBO sits below log p(x). The gap closes when the encoder matches the exact posterior."}]},

    {h: "The Gaussian KL and the reparameterization trick", b: () => `
      <p class="lede">With a Gaussian encoder and a standard Gaussian prior, the KL term has a closed form. That's the formula behind exam question 5.1(b).</p>
      <p>The encoder outputs, for each latent dimension, a mean μ and a <b>log-variance</b> ln σ². It predicts the log because a network output can be any real number, while a variance must be positive; σ² = exp(ln σ²) is always positive. For one dimension:</p>
      ${eq("KL( N(μ, σ²) ‖ N(0, 1) ) = ½ ( μ² + σ² − 1 − ln σ² )")}
      <p>For a d-dimensional latent with independent dimensions, add this up over the dimensions.</p>
      ${worked("Worked example: the three encoder outputs from the practice exam", `
        <ol><li>(μ, ln σ²) = (0, 0): σ² = 1. KL = ½(0 + 1 − 1 − 0) = <b>0</b>. The encoder output is exactly the prior.</li>
        <li>(2, 0): σ² = 1. KL = ½(4 + 1 − 1 − 0) = <b>2</b>. A shifted mean costs μ²/2.</li>
        <li>(0, −4): σ² = e<sup>−4</sup> ≈ 0.02. KL = ½(0 + 0.02 − 1 + 4) ≈ <b>1.51</b>. A variance that is too small is also penalized, through the −ln σ² term.</li></ol>`)}
      ${worked("Which output minimizes the KL?", `
        <ol><li>Write s = ln σ², so KL = ½(μ² + e<sup>s</sup> − 1 − s).</li>
        <li>∂KL/∂μ = μ. Setting it to zero gives μ = 0.</li>
        <li>∂KL/∂s = ½(e<sup>s</sup> − 1). Setting it to zero gives e<sup>s</sup> = 1, so s = ln σ² = 0, meaning σ² = 1.</li>
        <li>The minimum is at (μ, ln σ²) = (0, 0), the prior itself, with KL = 0. Any departure from the prior costs something.</li></ol>`)}
      <h4>The reparameterization trick</h4>
      <p>During training we have to sample z from N(μ, σ²) and then backpropagate the loss into the encoder. But "draw a random number" is not a differentiable operation. The trick is to move the randomness into a separate input:</p>
      ${eq("ε ~ N(0, I),  z = μ + σ ⊙ ε,  σ = exp(½ ln σ²)")}
      ${fig("vae-35", "VAE training (encode, sample with the trick, decode, update) and generation")}
      <p>Now z is a plain differentiable function of μ and σ, with ε held fixed as if it were a constant input. Gradients flow from the decoder's loss through z back into the encoder. The symbol ⊙ means element-by-element multiplication.</p>
      ${fig("vae-18", "The VAE objective: reconstruction minus the KL to the prior")}
      ${idea("Two classic bugs: using ln σ² (or σ²) where σ belongs in z = μ + σε, and getting the sign of the ln σ² term in the KL wrong. σ = exp(0.5 · logvar).")}`,
      quick: [{t: "num", q: "The encoder outputs μ = 1 and ln σ² = ln 4. With ε = −0.5, what is z from the reparameterization trick?", a: 0, tol: .001, why: "σ² = 4 so σ = 2. z = μ + σε = 1 + 2(−0.5) = 0."}]},

    {h: "The forward diffusion process", b: () => `
      <p class="lede">Diffusion models learn to generate by learning to remove noise. Training starts by destroying real images with noise in a fixed, known way. That fixed corruption is called the forward process.</p>
      ${fig("diff-13", "The forward process: a real image x₀ becomes pure Gaussian noise x<sub>T</sub> over many steps")}
      <h4>One small step at a time</h4>
      <p>At each step t = 1, …, T the image shrinks slightly and gets a little fresh noise. The schedule β<sub>t</sub> (the noise variance added at step t) is chosen by hand, for example increasing linearly from 10<sup>−4</sup> to 0.02 over T = 1000 steps in Project 9. Write α<sub>t</sub> = 1 − β<sub>t</sub> for the fraction of signal variance kept.</p>
      ${eq("x<sub>t</sub> = √α<sub>t</sub> · x<sub>t−1</sub> + √β<sub>t</sub> · ε<sub>t</sub>,  ε<sub>t</sub> ~ N(0, I)")}
      <p>No neural network is involved here. The forward process has nothing to learn.</p>
      <h4>Jumping to any step in one go</h4>
      <p>Chaining Gaussian steps gives another Gaussian, so we never have to simulate all the earlier steps. Define the cumulative product ᾱ<sub>t</sub> = α<sub>1</sub> · α<sub>2</sub> ⋯ α<sub>t</sub> (read "alpha bar"). Then:</p>
      ${eq("x<sub>t</sub> = √ᾱ<sub>t</sub> · x<sub>0</sub> + √(1 − ᾱ<sub>t</sub>) · ε,  ε ~ N(0, I)")}
      ${fig("diff-35", "The closed form q(x<sub>t</sub> | x<sub>0</sub>) and the signal-to-noise ratio")}
      <p>ᾱ<sub>t</sub> starts near 1 (almost all signal) and falls toward 0 (almost all noise). The two coefficients always satisfy (√ᾱ)² + (√(1 − ᾱ))² = 1, which is why this is called <b>variance preserving</b>: if x<sub>0</sub> has unit variance, so does every x<sub>t</sub>. The <b>signal-to-noise ratio</b> is SNR(t) = ᾱ<sub>t</sub> / (1 − ᾱ<sub>t</sub>).</p>
      ${worked("Let's noise one pixel", `
        <p>Three steps with α = 0.9, 0.8, 0.5. Clean value x<sub>0</sub> = 5, noise sample ε = −1.</p>
        <ol><li>ᾱ<sub>3</sub> = 0.9 × 0.8 × 0.5 = <b>0.36</b>.</li>
        <li>√ᾱ<sub>3</sub> = 0.6 and √(1 − ᾱ<sub>3</sub>) = √0.64 = 0.8.</li>
        <li>x<sub>3</sub> = 0.6 × 5 + 0.8 × (−1) = 3 − 0.8 = <b>2.2</b>.</li>
        <li>SNR = 0.36 / 0.64 = 0.5625.</li></ol>`)}
      ${fig("diff-38", "Two conventions: additive noise x₀ + σε versus variance preserving (DDPM)")}
      ${idea("In code, alpha_bars = torch.cumprod(1 − betas, dim=0), and alpha_bars[t] has shape [B]. It must be reshaped to [B, 1, 1, 1] before multiplying an image batch [B, C, H, W].")}`,
      quick: [{t: "num", q: "α<sub>1</sub> = 0.8 and α<sub>2</sub> = 0.8. What is ᾱ<sub>2</sub>?", a: 0.64, tol: .001, why: "ᾱ is the running product: 0.8 × 0.8 = 0.64."}]},

    {h: "Training: predict the noise (or v)", b: () => `
      <p class="lede">The network ε<sub>θ</sub>(x<sub>t</sub>, t) is shown a noisy image and the step number, and it learns to tell us what noise was added. Because we added the noise ourselves, we know the right answer.</p>
      ${fig("diff-40", "Training is supervised regression on the noise")}
      <ol><li>Draw a real image x<sub>0</sub> and a random step t.</li>
      <li>Draw ε ~ N(0, I) and build x<sub>t</sub> directly with the closed form.</li>
      <li>Predict ε<sub>θ</sub>(x<sub>t</sub>, t).</li>
      <li>Minimize the squared error ‖ε − ε<sub>θ</sub>(x<sub>t</sub>, t)‖² and backpropagate.</li></ol>
      ${fig("diff-46", "One network handles every noise level, so it must be told t")}
      <p>The same network serves all 1000 noise levels, so it must be given t. At low noise the clean image is almost visible. At high noise many clean images are compatible with what it sees, so it must rely on what faces usually look like.</p>
      <h4>Three things the network could predict</h4>
      <p>Because x<sub>t</sub> = √ᾱ x<sub>0</sub> + √(1 − ᾱ) ε, knowing any one of (ε, x<sub>0</sub>) together with x<sub>t</sub> gives the other:</p>
      ${eq("x̂<sub>0</sub> = ( x<sub>t</sub> − √(1 − ᾱ<sub>t</sub>) · ε̂ ) / √ᾱ<sub>t</sub>")}
      <p>Project 9 predicts a third quantity, the <b>velocity</b> v, which has unit scale at every t:</p>
      ${eq("v = √ᾱ<sub>t</sub> · ε − √(1 − ᾱ<sub>t</sub>) · x<sub>0</sub>")}
      <p>To turn a v prediction back into noise, substitute x<sub>0</sub> = (x<sub>t</sub> − √(1 − ᾱ)ε)/√ᾱ into v and solve. The x<sub>0</sub> terms cancel neatly because ᾱ + (1 − ᾱ) = 1:</p>
      ${eq("ε = √(1 − ᾱ<sub>t</sub>) · x<sub>t</sub> + √ᾱ<sub>t</sub> · v,  x<sub>0</sub> = √ᾱ<sub>t</sub> · x<sub>t</sub> − √(1 − ᾱ<sub>t</sub>) · v")}
      ${worked("Check the conversions on our pixel", `
        <p>ᾱ = 0.36, x<sub>0</sub> = 5, ε = −1, x<sub>t</sub> = 2.2 (from the last article).</p>
        <ol><li>v = 0.6 × (−1) − 0.8 × 5 = −0.6 − 4 = <b>−4.6</b>.</li>
        <li>ε from v: 0.8 × 2.2 + 0.6 × (−4.6) = 1.76 − 2.76 = <b>−1</b>. ✓</li>
        <li>x<sub>0</sub> from v: 0.6 × 2.2 − 0.8 × (−4.6) = 1.32 + 3.68 = <b>5</b>. ✓</li>
        <li>x̂<sub>0</sub> from ε: (2.2 − 0.8 × (−1)) / 0.6 = 3 / 0.6 = <b>5</b>. ✓</li></ol>`)}
      <h4>Why not just predict ε?</h4>
      <p>From x̂<sub>0</sub> = (x<sub>t</sub> − √(1 − ᾱ)ε̂)/√ᾱ, an error δ in ε̂ becomes an error of δ · √(1 − ᾱ)/√ᾱ in x̂<sub>0</sub>. When ᾱ is tiny (very noisy steps) that factor is huge: about 160 at t = 999 in Project 9. The v target avoids this blow-up.</p>
      ${idea("The training loss is plain MSE. The two classic bugs are feeding the network x<sub>0</sub> instead of x<sub>t</sub>, and comparing its output with the wrong target (x<sub>t</sub> or x<sub>0</sub> instead of ε or v).")}`,
      quick: [{t: "mc", q: "A network predicts v. Which expression gives the predicted noise?", opts: ["√(1 − ᾱ)·x<sub>t</sub> + √ᾱ·v", "√ᾱ·x<sub>t</sub> − √(1 − ᾱ)·v", "(x<sub>t</sub> − √ᾱ·v) / √(1 − ᾱ)", "√ᾱ·v − √(1 − ᾱ)·x<sub>t</sub>"], a: 0, why: "Substitute x₀ into the definition of v and solve for ε. The second option is x₀, not ε."}]},

    {h: "Sampling: DDPM and DDIM", b: () => `
      <p class="lede">At test time we start from pure noise x<sub>T</sub> ~ N(0, I) and use the trained network over and over to walk back to a clean image.</p>
      ${fig("diff-44", "DDPM ancestral sampling and the clean-image estimate x̂₀")}
      <h4>DDPM: stochastic, one step at a time</h4>
      ${eq("x<sub>t−1</sub> = (1/√α<sub>t</sub>) ( x<sub>t</sub> − β<sub>t</sub>/√(1 − ᾱ<sub>t</sub>) · ε<sub>θ</sub>(x<sub>t</sub>, t) ) + √β<sub>t</sub> · z,  z ~ N(0, I)")}
      <p>Each step removes a bit of the predicted noise and then adds a little fresh noise z (none on the very last step). DDPM has to visit every one of the T steps.</p>
      <h4>DDIM: deterministic, can skip steps</h4>
      <p>DDIM (with η = 0) first estimates the clean image, then re-noises that estimate to the earlier step t′ using the <b>same</b> predicted noise:</p>
      ${eq("x̂<sub>0</sub> = ( x<sub>t</sub> − √(1 − ᾱ<sub>t</sub>) ε̂ ) / √ᾱ<sub>t</sub>,  x<sub>t′</sub> = √ᾱ<sub>t′</sub> · x̂<sub>0</sub> + √(1 − ᾱ<sub>t′</sub>) · ε̂")}
      <p>No new randomness is added, so the same starting noise always gives the same image, and t′ can be many steps earlier (50 steps instead of 1000). At the final step, t′ = −1 means ᾱ = 1, so the output is exactly x̂<sub>0</sub>.</p>
      ${worked("One DDIM step by hand", `
        <p>ᾱ<sub>t</sub> = 0.36, x<sub>t</sub> = 2.2, the network predicts ε̂ = −1, and the next step has ᾱ<sub>t′</sub> = 0.64.</p>
        <ol><li>x̂<sub>0</sub> = (2.2 − 0.8 × (−1)) / 0.6 = 5.</li>
        <li>x<sub>t′</sub> = √0.64 × 5 + √0.36 × (−1) = 0.8 × 5 − 0.6 = <b>3.4</b>.</li></ol>`)}
      <h4>The practice-exam bug</h4>
      <p>If the last line of a DDIM step re-noises with ᾱ<sub>t</sub> instead of ᾱ<sub>t′</sub>, it computes √ᾱ<sub>t</sub> x̂<sub>0</sub> + √(1 − ᾱ<sub>t</sub>) ε̂, which is exactly x<sub>t</sub> again (that's how x̂<sub>0</sub> was defined). Every step returns its input, so the "sample" equals the starting noise.</p>
      <h4>Why many small steps?</h4>
      <p>From pure noise, many different clean images are equally plausible. A network trained with squared error predicts their <b>average</b>, which is a blurry blob. A small step only commits to a little detail; the next prediction, made from a less noisy input, can then be sharper. Many small steps let the sample settle on one specific image instead of the mean of all of them.</p>
      ${idea("The time grid matters too: torch.linspace(999, 0, n).long() <b>truncates</b> (749.25 → 749), while .round().long() rounds. Project 9 rounds.")}`,
      quick: [{t: "mc", q: "A DDIM step returns √ᾱ<sub>t</sub>·x̂<sub>0</sub> + √(1 − ᾱ<sub>t</sub>)·ε̂, using the <b>current</b> step's ᾱ. What happens?", opts: ["Each step returns x<sub>t</sub> unchanged, so the output equals the input noise", "The samples become blurry but recognizable", "The sampler becomes stochastic", "It works but needs more steps"], a: 0, why: "Plugging x̂₀ back in with the same ᾱ just reverses the x̂₀ formula and gives x_t again."}]},

    {h: "Conditioning, guidance and latent diffusion", b: () => `
      <p class="lede">The last pieces turn a diffusion model into a practical image generator: work in a compressed latent space, and steer the output with a label or text.</p>
      <h4>Latent diffusion</h4>
      ${fig("diff-61", "Latent diffusion: an autoencoder compresses images; diffusion runs on the latents")}
      <p>A pretrained autoencoder maps an image to a much smaller latent. In Project 9, TAESD maps a 3 × 128 × 128 face (49,152 numbers) to a 4 × 16 × 16 latent (1,024 numbers), 48 times fewer. Diffusion is trained and run entirely on latents, and the decoder turns the final latent back into pixels. The autoencoder's encoder compresses; the forward process adds noise. They are different things with different jobs.</p>
      <h4>Conditioning and classifier-free guidance</h4>
      <p>The network can take a condition y (a class label like "smiling", or text) as an extra input: ε<sub>θ</sub>(x<sub>t</sub>, t, y). During training, the label is replaced by a special <b>null label</b> ∅ with probability 0.1, so the same network also learns the unconditional prediction ε<sub>θ</sub>(x<sub>t</sub>, t, ∅). At sampling time, guidance with scale w extrapolates away from the unconditional prediction:</p>
      ${eq("ε̃ = ε<sub>θ</sub>(x<sub>t</sub>, t, ∅) + w · ( ε<sub>θ</sub>(x<sub>t</sub>, t, y) − ε<sub>θ</sub>(x<sub>t</sub>, t, ∅) )")}
      <ul><li>w = 0 gives the unconditional model.</li><li>w = 1 gives the plain conditional model.</li><li>w &gt; 1 exaggerates whatever makes the image look like y (stronger label, less variety).</li></ul>
      ${worked("Guidance on one number", `<p>ε<sub>u</sub> = 0.2, ε<sub>c</sub> = 0.5, w = 3. ε̃ = 0.2 + 3 × (0.5 − 0.2) = <b>1.1</b>.</p>`)}
      <h4>Diffusion as an image prior (SDEdit)</h4>
      <p>To edit a rough image, encode it, noise it part of the way to a step t<sub>0</sub> with the forward process, then denoise from t<sub>0</sub> with DDIM. A small t<sub>0</sub> keeps the input's details; a large t<sub>0</sub> keeps only the coarse layout and lets the model invent the rest.</p>

    {t: "explain", q: "<b>Short answer.</b> (a) What does the forward process do during training? (b) How is a new image generated at test time?", model: "(a) Given a real image x₀, pick a random step t and noise ε ~ N(0, I) and build x_t = √ᾱ_t x₀ + √(1 − ᾱ_t) ε directly in one step (no network involved). The network is trained to predict ε (or v) from x_t and t with a squared-error loss; the forward process supplies the noisy input and the known target. (b) Start from x_T ~ N(0, I) and repeatedly apply the network: predict the noise, remove part of it to get x_{t−1} (DDPM adds a little fresh noise; DDIM does not), stepping t down to 0. The final x₀ is the sample (decoded by the autoencoder for latent diffusion).", points: ["Forward: x_t = √ᾱ x₀ + √(1−ᾱ) ε sampled directly, no learning", "The sampled ε is the regression target", "Reverse: start from N(0, I), denoise step by step with the network", "Ends at x₀ (decode if latent)"]},
    {t: "explain", q: "<b>Short answer.</b> The network can estimate x₀ from any x<sub>t</sub>. Why generate with many small steps instead of one jump from x<sub>T</sub> to x₀?", model: "From pure noise, many clean images are equally consistent with x_T. A network trained with squared error predicts the conditional mean E[x₀ | x_t], the average of all those images, which is a blurry blob. Taking a small step commits to only a little structure; the next prediction is made from a less noisy input where fewer images are plausible, so it can be sharper. Repeating this lets the sample settle on one specific, detailed image.", points: ["At high noise many x₀ are plausible", "MSE gives their average: blurry", "Small steps refine from less noisy inputs, so detail is added gradually"]},
    {t: "explain", q: "<b>Derivation.</b> Starting from L<sub>v</sub> = Σ<sub>z</sub> q(z | x) log [ p(z, x) / q(z | x) ], split it into a reconstruction term and a prior-matching term. Hint: p(z, x) = p(z) p(x | z).", model: "Substitute p(z, x) = p(z) p(x | z): L_v = Σ_z q(z|x) log [ p(z) p(x|z) / q(z|x) ]. The log of a product is a sum of logs: L_v = Σ_z q(z|x) log [ p(z) / q(z|x) ] + Σ_z q(z|x) log p(x|z). The first sum is −Σ_z q log [ q(z|x)/p(z) ] = −KL(q(z|x) ‖ p(z)), the prior-matching term. The second is E_{z~q(z|x)}[ log p(x|z) ], the reconstruction term. So L_v = E_q[log p(x|z)] − KL(q(z|x) ‖ p(z)).", points: ["Substitute p(z,x) = p(z) p(x|z)", "Split the log into two sums", "First sum = −KL(q(z|x) ‖ p(z)) (flip the fraction)", "Second sum = E_q[log p(x|z)] (reconstruction)"]},
    {t: "explain", q: "<b>Derivation.</b> Show that log p(x) = L<sub>v</sub> + KL(q(z | x) ‖ p(z | x)), and explain why this makes L<sub>v</sub> a lower bound.", model: "log p(x) = Σ_z q(z|x) log p(x) because q sums to 1 over z. By Bayes' rule p(x) = p(z,x)/p(z|x), so log p(x) = Σ_z q log [ p(z,x)/p(z|x) ]. Multiply inside by q(z|x)/q(z|x): Σ_z q log [ p(z,x)/q(z|x) ] + Σ_z q log [ q(z|x)/p(z|x) ] = L_v + KL(q(z|x) ‖ p(z|x)). A KL divergence is always ≥ 0, so L_v ≤ log p(x), with equality when q(z|x) equals the exact posterior p(z|x). Maximizing L_v therefore pushes up the likelihood.", points: ["Multiply by Σ q(z|x) = 1", "Bayes: p(x) = p(z,x)/p(z|x)", "Multiply by q/q and split the log", "KL ≥ 0 so L_v ≤ log p(x); equal when q = true posterior"]},
    {t: "explain", q: "<b>Short answer.</b> Why can training sample x<sub>t</sub> for a random t in one step, while generation must go through many steps?", model: "During training x₀ is known, and the forward process is a fixed Gaussian chain, so q(x_t | x₀) = N(√ᾱ_t x₀, (1−ᾱ_t) I) in closed form: draw ε and build x_t directly, no network needed. At generation time x₀ is unknown; we only have x_T ~ N(0, I). The reverse step depends on the network's prediction from the current state, so we must apply it repeatedly (DDPM every step, DDIM a shorter grid), each step from a slightly less noisy state.", points: ["Training knows x₀: closed form x_t = √ᾱ x₀ + √(1−ᾱ) ε", "Forward process is fixed, no network", "Generation doesn't know x₀; starts at N(0, I)", "Must iterate network predictions step by step"]},

["torch.randn_like(x)", "Gaussian noise with x's shape, dtype and device. torch.randn(shape, generator=g) for reproducible noise (CPU, then .to(device))."],
["torch.cumprod(1 - betas, dim=0)", "Running product: alpha_bars[t] = α₀·α₁⋯α_t. The DDPM ᾱ schedule in one line."],
["alpha_bars[t].view(-1, 1, 1, 1)", "t is a [B] tensor, so alpha_bars[t] is [B]. Reshape before multiplying a [B, C, H, W] batch, or broadcasting fails (or silently lines up with the wrong axis)."],
["x.sqrt(), (1 - ab).sqrt()", "Elementwise √. The forward-process coefficients are √ᾱ and √(1 − ᾱ), not ᾱ and 1 − ᾱ."],
["torch.linspace(start, end, n).long()", "n values, end inclusive. .long() truncates toward zero (749.25 → 749); .round().long() rounds."],
["@torch.no_grad()", "Sampling needs no gradients: saves memory and time. Training must not use it."],
["torch.exp(0.5 * logvar)", "σ from the encoder's log-variance. Used in z = μ + σ·ε."],
["F.mse_loss(pred, target)", "Mean squared error. Diffusion target: the sampled noise (or v), never x_t."],
["torch.full_like(y, NULL_CLASS)", "A batch of null labels for the unconditional pass of classifier-free guidance."],
["torch.tensor(1.0) for t_prev = −1", "ᾱ of the clean image is 1, so the last DDIM step returns x̂₀."]
];

function num(s) {
  s = String(s).trim().replace(/[−–]/g, "-");
  if (!s || !/^[0-9+\-*/().\s]+$/.test(s)) return NaN;
  try { const v = Function('"use strict";return (' + s + ")")(); return typeof v === "number" && isFinite(v) ? v : NaN; } catch (e) { return NaN; }
}
const vec = s => String(s).replace(/[\[\]()]/g, " ").split(/[,;]|\s+/).map(x => x.trim()).filter(Boolean).map(num);
const norm = s => String(s).replace(/\s+/g, "").replace(/"/g, "'").replace(/;$/, "").replace(/\.0+(?=\D|$)/g, "");
const fmtN = x => Number.isInteger(x) ? String(x) : String(+x.toFixed(4));
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function btn(t, cls) { const b = el("button", cls || "pillbtn"); b.textContent = t; return b; }
function row(...k) { const r = el("div", "row"); r.append(...k); return r; }

function renderQ(host, q, done) {
  host.innerHTML = "";
  const card = el("div", "card q");
  card.append(el("div", "qtext", q.q));
  if (q.show) card.append(el("div", "", q.show()));
  host.append(card);
  const fb = el("div", "fb");
  let over = false;
  const finish = (ok, html, label) => {
    if (over) return; over = true;
    card.classList.add(ok ? "hit" : "miss");
    fb.innerHTML = '<div class="verdict ' + (ok ? "ok" : "bad") + '">' + (label || (ok ? "✓ correct" : "✗ not quite")) + '</div><div class="why">' + html + "</div>";
    card.append(fb); done(ok, fb);
  };
  const selfGrade = (html, onYes, onNo, yesLabel, noLabel) => {
    over = true;
    fb.innerHTML = html; card.append(fb);
    const y = btn(yesLabel || "I had it", "pillbtn go"), n = btn(noLabel || "I missed something");
    const r = row(y, n); fb.append(r);
    y.onclick = () => { r.remove(); card.classList.add("hit"); onYes(); };
    n.onclick = () => { r.remove(); card.classList.add("miss"); onNo(); };
  };

  if (q.t === "mc") {
    const order = q.opts.map((_, i) => i).sort(() => Math.random() - .5);
    const opts = el("div", "opts"); let pick = -1;
    const chk = btn("check", "pillbtn go"); chk.disabled = true;
    const bs = order.map(i => {
      const b = el("button", "opt", q.opts[i]); b.dataset.i = i; b.setAttribute("aria-pressed", "false");
      b.onclick = () => { if (over) return; pick = i; bs.forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); chk.disabled = false; };
      opts.append(b); return b;
    });
    card.append(opts, row(chk));
    chk.onclick = () => { chk.parentNode.remove(); bs.forEach(b => { const i = +b.dataset.i; if (i === q.a) b.classList.add("right"); else if (i === pick) b.classList.add("wrong"); b.disabled = true; }); finish(pick === q.a, q.why); };
  }

  if (q.t === "num" || q.t === "vec") {
    const ent = el("div", "entry"); const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false; inp.id = "ans";
    inp.placeholder = q.t === "num" ? "a number (17/9 works)" : (q.fmt || "comma-separated");
    const chk = btn("check", "pillbtn go"); ent.append(inp, chk); card.append(ent);
    if (q.t === "vec") card.append(el("div", "hint", "format: " + esc(q.fmt || "comma-separated numbers")));
    const run = () => {
      if (over || !inp.value.trim()) return;
      const tol = (q.tol || 0) + 1e-9; let ok;
      if (q.t === "num") ok = Math.abs(num(inp.value) - q.a) <= tol;
      else { const v = vec(inp.value); ok = v.length === q.a.length && v.every((x, i) => Math.abs(x - q.a[i]) <= tol); }
      inp.disabled = true; chk.remove();
      const ans = q.t === "num" ? fmtN(q.a) : q.a.map(fmtN).join(", ");
      finish(ok, (ok ? "" : 'answer: <span class="mono">' + ans + "</span>. ") + q.why);
    };
    chk.onclick = run; inp.onkeydown = e => { if (e.key === "Enter") run(); };
    setTimeout(() => inp.focus({preventScroll: true}), 0);
  }

  if (q.t === "explain") {
    const ta = el("textarea"); ta.id = "explain"; ta.placeholder = "write your answer the way you would on the exam…";
    const show = btn("compare with model answer", "pillbtn go");
    card.append(ta, row(show));
    show.onclick = () => {
      show.parentNode.remove(); ta.readOnly = true;
      selfGrade('<div class="verdict">model answer</div><div class="why">' + esc(q.model) + '</div><div class="why"><b>a full-credit answer hits:</b><ul>' + q.points.map(p => "<li>" + p + "</li>").join("") + "</ul></div>",
        () => done(true, fb), () => done(false, fb), "I hit every point", "I missed a point");
    };
  }

  if (q.t === "grid") {
    const state = {};
    const g = el("div", "gridq"); g.style.gridTemplateColumns = "repeat(" + q.cols + ", 2.6rem)";
    const cells = [];
    for (let r = 0; r < q.rows; r++) for (let c = 0; c < q.cols; c++) {
      const k = r + "," + c, b = el("button"); b.setAttribute("aria-label", "row " + (r + 1) + " column " + (c + 1));
      b.onclick = () => { if (over) return; const cyc = ["", ...q.marks]; state[k] = cyc[(cyc.indexOf(state[k] || "") + 1) % cyc.length]; b.textContent = state[k]; b.classList.toggle("on", !!state[k]); };
      g.append(b); cells.push([k, b]);
    }
    const wrap = el("div", "scroll"); wrap.append(g);
    const chk = btn("check", "pillbtn go");
    card.append(el("div", "hint", "click a cell to cycle: blank → " + q.marks.join(" → ") + " → blank"), wrap, row(chk));
    chk.onclick = () => {
      chk.parentNode.remove();
      let ok = true;
      cells.forEach(([k, b]) => {
        const want = q.answer[k] || "", got = state[k] || "";
        if (want !== got) { ok = false; b.classList.add("badc"); b.textContent = want || "·"; }
        else if (want) b.classList.add("good");
        b.disabled = true;
      });
      finish(ok, (ok ? "" : "red cells were wrong; they now show the right mark (· = blank). ") + q.why);
    };
  }

  if (q.t === "bug") {
    const picked = new Set();
    const box = el("div", "code"); box.setAttribute("role", "group"); box.setAttribute("aria-label", "code lines; click to mark as buggy");
    const chk = btn("check lines", "pillbtn go"); chk.disabled = true;
    const lines = q.lines.map((l, i) => {
      const b = el("button", "line", '<span class="n">' + (i + 1) + "</span>" + esc(l || " ")); b.setAttribute("aria-pressed", "false");
      b.onclick = () => { if (over) return; const n = i + 1; picked.has(n) ? picked.delete(n) : picked.add(n); b.classList.toggle("picked"); b.setAttribute("aria-pressed", picked.has(n)); chk.disabled = !picked.size; };
      box.append(b); return b;
    });
    card.append(el("div", "hint", "step 1: click every line with a bug (" + q.bugs.length + " bug" + (q.bugs.length > 1 ? "s" : "") + "). step 2: write the corrected line(s), like the exam asks."), box, row(chk));
    chk.onclick = () => {
      chk.parentNode.remove();
      const allowed = new Set(q.bugs.flat());
      const linesOk = [...picked].every(n => allowed.has(n)) && q.bugs.every(gr => gr.filter(n => picked.has(n)).length === 1);
      lines.forEach((b, i) => {
        const n = i + 1; b.disabled = true;
        if (picked.has(n)) b.classList.add(allowed.has(n) ? "isbug" : "notbug");
        else if (q.bugs.some(gr => gr[0] === n && !gr.some(m => picked.has(m)))) b.classList.add("missed");
      });
      if (!linesOk) { finish(false, "the bugs are on line" + (q.bugs.length > 1 ? "s " : " ") + q.bugs.map(gr => gr.join("/")).join(", ") + " (marked in amber if you missed them). " + q.fix + '<div class="model">' + esc(q.fixes.join("\n")) + "</div>"); return; }
      const fx = el("div", "stack");
      fx.append(el("div", "verdict ok", "✓ right lines. now write the fix" + (q.bugs.length > 1 ? "es" : "")));
      q.bugs.forEach((gr, k) => {
        const r = el("div", "fixrow"); const id = "fix" + k;
        r.innerHTML = '<label for="' + id + '">corrected line ' + gr[0] + "</label>";
        const inp = el("input"); inp.id = id; inp.type = "text"; inp.spellcheck = false; inp.autocomplete = "off"; inp.value = q.lines[gr[0] - 1].trim();
        r.append(inp); fx.append(r);
      });
      const cmp = btn("compare with the model fix", "pillbtn go"); fx.append(row(cmp)); card.append(fx);
      cmp.onclick = () => {
        cmp.parentNode.remove(); fx.querySelectorAll("input").forEach(i => i.readOnly = true);
        selfGrade('<div class="verdict">model fix</div><div class="model">' + esc(q.fixes.join("\n")) + '</div><div class="why">' + q.fix + "</div>",
          () => done(true, fb), () => done(false, fb), "my fix matches", "mine was wrong");
      };
    };
  }

  if (q.t === "fill") {
    const parts = esc(q.src).split("____");
    card.append(el("div", "code", '<div style="padding:0.4rem 0.9rem;white-space:pre">' + parts[0] + '<span class="blank">?</span>' + (parts[1] || "") + "</div>"));
    const ent = el("div", "entry"); const inp = el("input"); inp.type = "text"; inp.id = "ans"; inp.autocomplete = "off"; inp.spellcheck = false; inp.placeholder = "type the missing code";
    const chk = btn("check", "pillbtn go"); ent.append(inp, chk); card.append(ent);
    const run = () => {
      if (over || !inp.value.trim()) return;
      inp.disabled = true; chk.remove();
      if (q.accept.map(norm).includes(norm(inp.value))) { finish(true, 'model answer: <code>' + esc(q.model) + "</code>"); return; }
      selfGrade('<div class="verdict warn">compare with the model answer</div><div class="model">' + esc(q.model) + '</div><div class="why">free-form code is hard to auto-check. if yours does the same thing, take the credit.</div>',
        () => done(true, fb), () => done(false, fb), "mine is equivalent", "I had it wrong");
    };
    chk.onclick = run; inp.onkeydown = e => { if (e.key === "Enter") run(); };
    setTimeout(() => inp.focus({preventScroll: true}), 0);
  }
}

      </aside>
    </section>
    <div class="sechead"><h2>units</h2><span class="faint">in exam order · morphing through diffusion</span></div>
    <section class="ucards">${UNITS.map(u => `<button class="ucard" data-unit="${u.id}" style="--a:${color(u.id)}">
      <span class="uicon">${mglyph(u.glyph)}</span>
      <span class="top-l"><span class="tag">${u.tag}</span><h3>${u.title}</h3><span class="blurb">${BLURB[u.id]}</span>${steps(u)}</span></button>`).join("")}</section>
    <div class="sechead"><h2>tools</h2></div>
    <section class="tcards">${TOOLS.map(t => `<button class="tcard" data-go="${t.id}" style="--a:${color(t.id)}"><span class="ti">${t.mark}</span><span><b>${t.name}</b><span>${t.desc}</span></span></button>`).join("")}</section>
  </main>`;
  bindGo();
  document.getElementById("cont").onclick = () => go(nextStep());
  app.querySelectorAll("[data-unit]").forEach(b => b.onclick = () => {
    const u = unit(b.dataset.unit), seen = S.read[u.id] || [];
    const unread = u.lessons.findIndex((_, i) => !seen.includes(i));
    go({page: "unit", id: u.id, sec: unread >= 0 ? "a" + unread : (pracDone(u) ? "code" : "practice")});
  });
}

function page(accentId, kicker, title, sideHtml, extra) {
  app.innerHTML = topbar() + `<div style="--a:${color(accentId)}">
    <section class="uhead"><div class="in"><button class="crumb" data-go="home">← all units</button><div class="eyebrow">${kicker}</div><h1>${title}</h1>${extra || ""}</div></section>
    <div class="ubody ${sideHtml ? "" : "single"}">${sideHtml ? '<nav class="side" aria-label="unit contents">' + sideHtml + "</nav>" : ""}<main id="main"></main></div></div>`;
  bindGo();
  return document.getElementById("main");
}

function renderUnit() {
  const u = unit(view.id), seen = S.read[u.id] = S.read[u.id] || [];
  if (view.sec.startsWith("a") && !seen.includes(+view.sec.slice(1))) { seen.push(+view.sec.slice(1)); save(); }
  const side = "<h3>ARTICLES</h3>" + u.lessons.map((l, i) => `<button class="navitem" data-sec="a${i}" aria-current="${view.sec === "a" + i}"><span class="num ${seen.includes(i) ? "on" : ""}">${seen.includes(i) ? "✓" : i + 1}</span><span>${l.h}</span></button>`).join("") +
    "<h3>PRACTICE</h3>" +
    `<button class="navitem" data-sec="practice" aria-current="${view.sec === "practice"}"><span class="num ${pracDone(u) ? "on" : ""}">${pracDone(u) ? "✓" : "?"}</span><span>practice round</span></button>` +
    `<button class="navitem" data-sec="code" aria-current="${view.sec === "code"}"><span class="num ${codeDone(u) ? "on" : ""}">${codeDone(u) ? "✓" : "{}"}</span><span>code lab</span></button>`;
  const main = page(u.id, u.tag, u.title, side, steps(u));
  app.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => { view.sec = b.dataset.sec; render(); window.scrollTo(0, 0); });
  if (view.sec.startsWith("a")) articleView(u, +view.sec.slice(1), main);
  else if (view.sec === "practice") practiceView(u, main);
  else codeView(u, main);
}

function articleView(u, i, main) {
  const L = u.lessons[i];
  const seen = S.read[u.id] = S.read[u.id] || [];
  if (!seen.includes(i)) { seen.push(i); save(); }
  const art = el("article", "", '<div class="eyebrow">article ' + (i + 1) + " of " + u.lessons.length + "</div><h2>" + L.h + "</h2>" + L.b());
  main.append(art);
  if (L.quick && L.quick.length) {
    const cy = el("div", "check-yourself", "<h4>check your understanding</h4>");
    L.quick.forEach(q => { const h = el("div"); cy.append(h); renderQ(h, q, () => {}); });
    art.append(cy);
  }
  const nav = el("div", "artnav");
  const prev = btn("← previous"); prev.disabled = i === 0; prev.onclick = () => { view.sec = "a" + (i - 1); render(); window.scrollTo(0, 0); };
  const next = btn(i < u.lessons.length - 1 ? "next: " + u.lessons[i + 1].h.toLowerCase() + " →" : "start practicing →", "pillbtn go");
  next.onclick = () => { view.sec = i < u.lessons.length - 1 ? "a" + (i + 1) : "practice"; render(); window.scrollTo(0, 0); };
  nav.append(prev, next); art.append(nav);
}

function practiceView(u, main) {
  const bank = u.practice, size = Math.min(7, bank.length), need = size - 1;
  const rec = S.prac[u.id] || {best: 0, mastered: false, missed: []};
  const s = session[u.id];
  if (!s) {
    main.innerHTML = `<article><div class="eyebrow">practice</div><h2>${rec.mastered ? "mastered. keep it warm" : "practice round"}</h2>
      <p class="lede">${size} questions from a bank of ${bank.length}: hand computations, true/false, written short answers${u.practice.some(q => q.t === "grid") ? " and grids" : ""}, like the exam. Get <b>${need} of ${size}</b> to master the unit.</p>
      <p>Questions you missed last time come up first. Best so far: <b>${rec.best} / ${size}</b>.</p></article>`;
    const st = btn(rec.best ? "start another round →" : "start round →", "pillbtn go"); const r = row(st); r.style.marginTop = "1.2rem"; main.append(r);
    st.onclick = () => {
      const missed = (rec.missed || []).filter(i => i < bank.length).sort(() => Math.random() - .5);
      const rest = bank.map((_, i) => i).filter(i => !missed.includes(i)).sort(() => Math.random() - .5);
      session[u.id] = {order: [...missed, ...rest].slice(0, size), i: 0, res: []}; render();
    };
    return;
  }
  if (s.i >= s.order.length) {
    const right = s.res.filter(Boolean).length, passed = right >= need;
    rec.best = Math.max(rec.best, right); rec.mastered = rec.mastered || passed; rec.missed = s.order.filter((_, k) => !s.res[k]);
    S.prac[u.id] = rec; save(); delete session[u.id];
    main.innerHTML = `<article><div class="prog">${s.res.map(r => `<i class="${r ? "ok" : "no"}"></i>`).join("")}</div><div class="big">${right} / ${s.order.length}</div>
      <h2>${passed ? "practice mastered" : "not yet, " + need + " needed"}</h2>
      <p>${passed ? (codeDone(u) ? "This unit is done. Pick the next one, or run a mock exam." : "Next up: the code lab.") : "The ones you missed come first next round. If a mistake surprised you, reread the matching article."}</p></article>`;
    const again = btn("practice again"); again.onclick = () => render();
    const bs = [again];
    if (passed && !codeDone(u)) { const c = btn("go to code lab →", "pillbtn go"); c.onclick = () => { view.sec = "code"; render(); }; bs.unshift(c); }
    const r = row(...bs); r.style.marginTop = "1.2rem"; main.append(r);
    return;
  }
  main.innerHTML = `<div class="stack" style="max-width:760px"><div class="prog">${s.order.map((_, k) => `<i class="${k < s.res.length ? (s.res[k] ? "ok" : "no") : (k === s.i ? "cur" : "")}"></i>`).join("")}</div><div class="eyebrow">question ${s.i + 1} of ${s.order.length}</div><div id="qhost"></div></div>`;
  renderQ(document.getElementById("qhost"), bank[s.order[s.i]], (ok, fb) => {
    s.res.push(ok);
    const nx = btn(s.i + 1 < s.order.length ? "next question →" : "see results", "pillbtn go");
    nx.onclick = () => { s.i++; render(); window.scrollTo(0, 0); };
    fb.append(row(nx));
  });
}

function codeView(u, main) {
  const solved = S.code[u.id] = S.code[u.id] || {};
  const i = Math.min(view.ex || 0, u.code.length - 1);
  const label = e => e.t === "bug" ? "find & fix" : e.t === "fill" ? "fill in" : "predict";
  main.innerHTML = `<div class="stack" style="max-width:760px"><div class="eyebrow">code lab</div>
    <p class="faint">Exam debugging questions give you code, an input and the wrong output, then ask for (1) each buggy line, (2) what it computes instead, (3) the corrected line. The bugs are in the algorithm's logic, not the syntax.</p>
    <div class="row">${u.code.map((e, j) => `<button class="pillbtn ${j === i ? "go" : ""}" data-ex="${j}">${solved[j] ? "✓ " : ""}${j + 1} · ${label(e)}</button>`).join("")}</div><div id="qhost"></div></div>`;
  main.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { view.ex = +b.dataset.ex; render(); });
  renderQ(document.getElementById("qhost"), u.code[i], (ok, fb) => {
    if (ok) { solved[i] = true; save(); }
    const bs = [];
    if (!ok) { const r = btn("try again"); r.onclick = () => render(); bs.push(r); }
    const nu = u.code.findIndex((_, j) => !solved[j]);
    if (nu >= 0) { const n = btn("next exercise →", "pillbtn go"); n.onclick = () => { view.ex = nu === i ? (i + 1) % u.code.length : nu; render(); }; bs.push(n); }
    else { const d = btn("code lab cleared. back to units", "pillbtn go"); d.onclick = () => go({page: "home"}); bs.push(d); }
    fb.append(row(...bs));
  });
}

function renderFormat() {
  const main = page("format", "what the paper actually looks like", "exam format");
  main.innerHTML = `<article>
    <p class="lede">The Exam 2 practice exam (posted on Ed with the logistics, Nov 22) is the best guide. It's a handwritten paper in five sections: image morphing, image blending, pose estimation, object detection, and VAE/diffusion. Each section mixes the same four kinds of question as Exam 1.</p>
    <h4>Compute by hand, showing every step</h4>
    <p>"For computational questions, clearly show all intermediate steps." No calculator, so the numbers are friendly. On the practice paper: barycentric coordinates and moving points to a new triangle, the Poisson matrix A and vector b for a 7-pixel mask, a hand-pose crop and its Gaussian heatmap value, grid-cell responsibility and IoU, precision/recall and AP from a ranked list, BCE versus squared-error gradients, and Gaussian KL values.</p>
    <h4>Short explanations</h4>
    <p>One or two sentences each: why barycentric coordinates, why the triangulation should follow boundaries, the five steps of Poisson blending, why U-Net needs skip connections, why heatmaps beat direct regression, why diffusion uses many small steps. In the practice banks these are the written questions: answer, then compare against a model answer and its checklist.</p>
    <h4>Debugging code</h4>
    <p>A function, its input, the wrong output (or the error message) and the expected output, then "there are exactly N bugs: identify the line, write the corrected version." The practice paper's bugs: wrong matrix entries in a barycentric computation, a U-Net with a stride-2 output head, ×4 upsampling and a concat on the wrong dimension, an IoU with min instead of max plus an ascending argsort in NMS, and a DDIM step that uses the current ᾱ instead of the previous one. Staff say there will be debugging questions on any of the project topics.</p>
    <div class="idea"><b>Rules to remember.</b> Image coordinates are (x, y) with x to the right (column) and y down (row), and ln is the natural log. The exam prints a function reference (meshgrid, find_simplex, argsort, Conv2d, MaxPool2d, Upsample, torch.cat, linspace). You scan your paper and upload it to Gradescope before you leave, then hand in the hard copy.</div>
    <h4>What's covered</h4>
    <p>Lectures from image morphing to VAE/diffusion, Projects 5–9, and the practice exam. Anything not covered in lecture or the projects is off the exam. Exam 2: Thursday Dec 3, 3:30–5:00 pm, Towne 100, one handwritten two-sided A4 sheet.</p></article>`;
}

function renderMock() {
  const main = page("mock", "15 questions, mixed like the real paper", "mock exam");
  if (!mock) {
    main.innerHTML = `<article><p class="lede">Three questions from each of the five exam sections, one of them a debugging question with a written fix. No hints until you answer. Best done after the units, with scratch paper.</p></article>`;
    const st = btn("start mock exam →", "pillbtn go"); const r = row(st); r.style.marginTop = "1.2rem"; main.append(r);
    st.onclick = () => {
      const pick = (a, n) => a.slice().sort(() => Math.random() - .5).slice(0, n);
      const qs = [];
      UNITS.forEach(u => {
        const n = 3, c = 1;
        pick(u.practice, n - c).forEach(q => qs.push({u: u.id, q}));
        pick(u.code.filter(e => e.t === "bug"), c).forEach(q => qs.push({u: u.id, q}));
      });
      mock = {qs, i: 0, res: []}; render();
    };
    return;
  }
  if (mock.i >= mock.qs.length) {
    const right = mock.res.filter(Boolean).length;
    const by = UNITS.map(u => { const ks = mock.qs.map((x, k) => x.u === u.id ? k : -1).filter(k => k >= 0); return {u, n: ks.length, r: ks.filter(k => mock.res[k]).length}; });
    main.innerHTML = `<article><div class="prog">${mock.res.map(r => `<i class="${r ? "ok" : "no"}"></i>`).join("")}</div><div class="big">${right} / ${mock.qs.length}</div>
      <div class="bars">${by.map(b => { const pc = b.n ? Math.round(100 * b.r / b.n) : 0; return `<div class="bar"><span>${b.u.title}</span><span class="track"><span class="fill" style="width:${pc}%;background:${pc >= 80 ? "var(--ok)" : pc >= 55 ? "var(--warn)" : "var(--bad)"}"></span></span><span class="pc">${b.r}/${b.n}</span></div>`; }).join("")}</div>
      <p>${by.filter(b => b.r < b.n).length ? "Reread: " + by.filter(b => b.r < b.n).map(b => b.u.title).join(", ") + "." : "Clean sweep. Now do the official practice exam on paper against a 90-minute clock."}</p></article>`;
    const a = btn("new mock exam", "pillbtn go"); a.onclick = () => { mock = null; render(); }; const r = row(a); r.style.marginTop = "1.2rem"; main.append(r);
    return;
  }
  const cur = mock.qs[mock.i];
  main.innerHTML = `<div class="stack" style="max-width:760px"><div class="prog">${mock.qs.map((_, k) => `<i class="${k < mock.res.length ? (mock.res[k] ? "ok" : "no") : (k === mock.i ? "cur" : "")}"></i>`).join("")}</div><div class="eyebrow">question ${mock.i + 1} of ${mock.qs.length} · ${unit(cur.u).title}</div><div id="qhost"></div></div>`;
  renderQ(document.getElementById("qhost"), cur.q, (ok, fb) => {
    mock.res.push(ok);
    const nx = btn(mock.i + 1 < mock.qs.length ? "next →" : "see results", "pillbtn go");
    nx.onclick = () => { mock.i++; render(); window.scrollTo(0, 0); }; fb.append(row(nx));
  });
}

function renderRef() {
  const main = page("ref", "the calls the projects use, and the reference table printed on the exam", "functions");
  main.innerHTML = `<div class="scroll" style="max-width:900px"><table class="reftable"><tr><th>call</th><th>what to remember</th></tr>${REF.map(([c, d]) => `<tr><td>${esc(c)}</td><td>${d}</td></tr>`).join("")}</table></div>`;
}

function renderSheet() {
  const main = page("sheet", "one A4 page, both sides, handwritten only", "cheat sheet");
  const names = {all: "everything"}; UNITS.forEach(u => names[u.id] = u.title);
  const groups = [...new Set(SHEET.map(s => s[0]))];
  main.innerHTML = `<article><p class="lede">Tick items off as you write them onto your sheet. Writing it by hand is studying too.</p>${groups.map(g => `<div class="sheet"><h4>${names[g]}</h4>${SHEET.map((s, k) => s[0] !== g ? "" :
    `<label for="sh${k}"><input type="checkbox" id="sh${k}" data-k="${k}" ${S.sheet[k] ? "checked" : ""}><span>${s[1]}</span></label>`).join("")}</div>`).join("")}</article>`;
  main.querySelectorAll("[data-k]").forEach(c => c.onchange = () => { S.sheet[c.dataset.k] = c.checked; save(); });
}

function render() {
  ({home: renderHome, unit: renderUnit, format: renderFormat, mock: renderMock, ref: renderRef, sheet: renderSheet}[view.page])();
}
render();
</script>
