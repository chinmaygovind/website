/* Layout: sticky top bar; home = hero + exam-day card, unit cards, tool cards; unit = tinted header band, sticky lesson sidebar, 720px reading column. */
:root {
  color-scheme: light;
  --bg: #ffffff; --fg: #0b0b0c; --panel: #ffffff;
  --hair: rgba(0, 0, 0, 0.11); --wash: rgba(0, 0, 0, 0.025); --wash-2: rgba(0, 0, 0, 0.055);
  --faint: rgba(0, 0, 0, 0.46); --soft: rgba(0, 0, 0, 0.76); --shadow: rgba(16, 17, 20, 0.22);
  --name-blue: #1a3cff; --link: #1a56ff;
  --ok: #1f7a4d; --bad: #b3261e; --warn: #9a6700; --pick: rgba(26, 86, 255, 0.1);
  --c-cam: #6b4226; --c-conv: #1565c0; --c-canny: #c0182b; --c-pyr: #e8590c; --c-homog: #5c2678; --c-flow: #008f42;
  --c-mock: #16295c; --c-format: #3a97d4; --c-ref: #b8860b; --c-sheet: #333333;
  --a: #0b0b0c;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --hand: "xkcd Script", "Comic Sans MS", cursive;
  --gut-l: max(20px, env(safe-area-inset-left, 0px));
  --gut-r: max(20px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #101114; --fg: #ececec; --panel: #17191e;
  --hair: rgba(255, 255, 255, 0.13); --wash: rgba(255, 255, 255, 0.03); --wash-2: rgba(255, 255, 255, 0.07);
  --faint: rgba(255, 255, 255, 0.46); --soft: rgba(255, 255, 255, 0.8); --shadow: rgba(0, 0, 0, 0.6);
  --name-blue: #7fa6ff; --link: #7aa2ff;
  --ok: #52d68a; --bad: #ff7a6e; --warn: #f0b23c; --pick: rgba(122, 162, 255, 0.16);
  --c-cam: #c69a72; --c-conv: #5aa9f0; --c-canny: #ff6b7a; --c-pyr: #ff9a52; --c-homog: #b07ede; --c-flow: #3ad07c;
  --c-mock: #7f9ae8; --c-format: #7cc4f0; --c-ref: #e8c04a; --c-sheet: #d8d8d8;
  --a: #ececec;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101114; --fg: #ececec; --panel: #17191e;
  --hair: rgba(255, 255, 255, 0.13); --wash: rgba(255, 255, 255, 0.03); --wash-2: rgba(255, 255, 255, 0.07);
  --faint: rgba(255, 255, 255, 0.46); --soft: rgba(255, 255, 255, 0.8); --shadow: rgba(0, 0, 0, 0.6);
  --name-blue: #7fa6ff; --link: #7aa2ff;
  --ok: #52d68a; --bad: #ff7a6e; --warn: #f0b23c; --pick: rgba(122, 162, 255, 0.16);
  --c-cam: #c69a72; --c-conv: #5aa9f0; --c-canny: #ff6b7a; --c-pyr: #ff9a52; --c-homog: #b07ede; --c-flow: #3ad07c;
  --c-mock: #7f9ae8; --c-format: #7cc4f0; --c-ref: #e8c04a; --c-sheet: #d8d8d8;
  --a: #ececec;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { color: var(--fg); font-family: var(--hand); font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
p { margin: 0; }
a { color: var(--link); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
.mono, code, pre { font-family: var(--mono); }
code { font-size: 0.8em; background: var(--wash-2); border-radius: 6px; padding: 0.08rem 0.35rem; }
.faint { color: var(--faint); }
.eyebrow { font-size: 0.95rem; letter-spacing: 0.06em; color: var(--faint); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--hair); }
.topbar .in { max-width: 1180px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 0.65rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 0.55rem; background: none; border: 0; padding: 0; font-weight: bold; font-size: 1.25rem; }
.brand .sq { display: grid; grid-template-columns: repeat(2, 0.42rem); gap: 0.12rem; }
.brand .sq i { width: 0.42rem; height: 0.42rem; border-radius: 2px; background: var(--name-blue); }
.brand .sq i:nth-child(2), .brand .sq i:nth-child(3) { opacity: 0.4; }
.nav { display: flex; gap: 0.15rem; margin-left: auto; flex-wrap: wrap; }
.nav button { background: none; border: 0; border-radius: 99px; padding: 0.28rem 0.85rem; color: var(--faint); font-size: 1rem; }
.nav button:hover { color: var(--fg); }
.nav button[aria-current="true"] { color: var(--fg); background: var(--wash-2); }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 2.6rem 5rem; }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: clamp(1.5rem, 5vw, 4rem); align-items: center; margin-bottom: clamp(2.5rem, 6vw, 4rem); }
.hero h1 { font-size: clamp(2.7rem, 6.5vw, 5rem); line-height: 0.98; margin: 0.5rem 0 1.1rem; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--name-blue); }
.hero .sub { font-size: 1.2rem; color: var(--soft); max-width: 44ch; }
.hero .row { margin-top: 1.6rem; }
.daycard { border: 1px solid var(--hair); border-radius: 22px; background: var(--panel); padding: 1.5rem 1.6rem; box-shadow: 0 22px 50px -34px var(--shadow); display: flex; flex-direction: column; gap: 1rem; }
.daycard .when { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }
.daycard .count { font-size: 3.2rem; line-height: 1; font-weight: bold; color: var(--name-blue); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1rem; }
.fact { display: flex; gap: 0.5rem; align-items: center; font-size: 1rem; color: var(--soft); }
.fact svg { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; color: var(--faint); }
.overall { display: flex; flex-direction: column; gap: 0.35rem; border-top: 1px solid var(--hair); padding-top: 1rem; }
.overall .bar-o { height: 10px; border-radius: 99px; background: var(--wash-2); overflow: hidden; }
.overall .bar-o i { display: block; height: 100%; border-radius: 99px; background: var(--name-blue); }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 0 0 1rem; flex-wrap: wrap; }
.sechead h2 { margin: 0; font-size: 1.8rem; }
.ucards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 1rem; margin-bottom: 3.2rem; }
.ucard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1.1rem; text-align: left; border: 1px solid var(--hair); border-radius: 20px; padding: 1.2rem 1.3rem 1.15rem; background: var(--panel); transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease; }
.ucard:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--a) 55%, var(--hair)); box-shadow: 0 22px 44px -32px var(--shadow); }
.uicon { width: 3.6rem; height: 3.6rem; border-radius: 16px; background: color-mix(in srgb, var(--a) 13%, transparent); display: grid; place-items: center; }
.mglyph { display: grid; grid-template-columns: repeat(3, 0.62rem); gap: 0.16rem; }
.mglyph i { width: 0.62rem; height: 0.62rem; border-radius: 3px; }
.ucard .top-l { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.ucard h3 { margin: 0; font-size: 1.4rem; line-height: 1.15; }
.ucard .tag { font-size: 0.9rem; color: var(--faint); }
.ucard .blurb { color: var(--soft); font-size: 1rem; line-height: 1.4; margin: 0.45rem 0 0.8rem; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; }
.step { font-size: 0.85rem; color: var(--faint); }
.step i { display: block; height: 6px; border-radius: 99px; background: var(--wash-2); margin-bottom: 0.3rem; }
.step.on { color: var(--fg); }
.step.on i { background: var(--a); }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 1rem; }
.tcard { display: flex; gap: 0.9rem; align-items: flex-start; text-align: left; border: 1px solid var(--hair); border-radius: 18px; padding: 1rem 1.1rem; background: var(--wash); transition: border-color 0.18s ease, background 0.18s ease; }
.tcard:hover { border-color: var(--a); background: var(--panel); }
.tcard .ti { width: 2.4rem; height: 2.4rem; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--a) 14%, transparent); color: var(--a); font-weight: bold; flex: none; }
.tcard b { display: block; font-size: 1.15rem; line-height: 1.2; }
.tcard span span { color: var(--faint); font-size: 0.95rem; line-height: 1.35; }
.tcard b { color: var(--fg); }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

/* unit + tool pages */
.uhead { background: color-mix(in srgb, var(--a) 8%, var(--bg)); border-bottom: 1px solid var(--hair); }

<body>
<div class="page" id="app"></div>

<script>
"use strict";
(function () {
  try {
    var s = JSON.parse(localStorage.getItem("cgovind:settings")) || {};
    if (s.theme) document.documentElement.dataset.theme = s.theme;
  } catch (e) {}
})();

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const M = rows => '<table class="mat">' + rows.map(r => "<tr>" + r.map(v => "<td>" + v + "</td>").join("") + "</tr>").join("") + "</table>";
const code = s => "<pre><code>" + esc(s.replace(/^\n/, "")) + "</code></pre>";
const eq = s => '<div class="eq">' + s + "</div>";
const idea = s => '<div class="idea"><b>Key idea.</b> ' + s + "</div>";
const worked = (title, body) => '<div class="worked"><b>' + title + "</b>" + body + "</div>";
const DECK = {
  cam: "Camera intro (Aug 25)", conv: "Convolution (Sep 1)", canny: "Canny edge detection (Sep 3)",
  pyr: "Image pyramids (Sep 15)", tf: "Image transform & homography (Sep 22)", rs: "Feature matching & RANSAC (Sep 29)", of: "Optical flow (Oct 8)"
};
const fig = (id, cap) => {
  const [d, n] = id.split("-");
  return '<figure class="slide"><img src="slides/' + id + '.jpg" alt="Lecture slide: ' + esc(cap.replace(/<[^>]+>/g, "")) + '" loading="lazy">' +
    "<figcaption>" + cap + " · " + DECK[d] + " lecture, slide " + n + "</figcaption></figure>";
};

const UNITS = [
{
  id: "conv", name: "convolution", title: "Convolution & filters", tag: "exam section 1 · hw 1", glyph: [[1,1,1],[1,1,1],[1,1,1]],
  lessons: [
    {h: "Images are made of waves", b: () => `
      <p class="lede">Before we learn how to filter an image, it helps to ask why you would. The lecture opened with a surprising idea: an image isn't only a grid of pixels. It's also a sum of waves.</p>
      <p>Take any photo. You can rebuild it by adding up smooth stripes of different <b>frequencies</b> (how fast they wiggle) and <b>orientations</b> (which way they run). Slow, wide waves carry the overall shapes and shading. Fast, tight waves carry sharp edges, texture and noise.</p>
      ${fig("conv-12", "An image as a sum of waves with different frequencies and orientations")}
      <p>Filtering is the reverse process: picking out which waves to keep. You can think about a filter in two ways:</p>
      <ul><li><b>Locally</b>, in image space: each output pixel is a weighted average of nearby input pixels. This is how we compute things.</li>
      <li><b>Globally</b>, in frequency space: which frequencies does the filter keep, and which does it throw away? This is how we reason about what a filter does.</li></ul>
      <h4>Scale matters</h4>
      <p>The same scene gives different edges depending on how blurry you look at it. At a fine scale, edges are precise but noisy. At a coarse scale, they're stable but shifted and missing detail. Medium scale is usually where the useful edges are. This trade-off comes back for Canny, pyramids and optical flow.</p>
      ${fig("conv-16", "Edges found at a medium scale")}
      ${idea("Blurring keeps the slow waves (a <b>low-pass</b> filter). Differentiating or sharpening boosts the fast ones (a <b>high-pass</b> filter).")}`,
      quick: [{t: "mc", q: "A filter removes the fast, tight waves from an image and keeps the slow ones. What kind of filter is it?", opts: ["Low-pass (a blur)", "High-pass (an edge detector)", "A shift", "The identity"], a: 0, why: "Low frequencies pass through; high frequencies (detail, noise) are removed."}]},
    {h: "Linear filtering: weighted sums of neighbors", b: () => `
      <p class="lede">A linear filter computes each output pixel as a weighted sum of the input pixels around it. The grid of weights is called the <b>kernel</b>.</p>
      <p>Let's build some intuition with the examples from lecture, each a 3×3 kernel slid over the image:</p>
      <ul><li><b>Identity:</b> a single 1 in the center, zeros elsewhere. Each output pixel copies the input pixel. No change.</li>
      <li><b>Shift:</b> a single 1 off-center. Each output copies a <i>neighbor</i>, so the whole image shifts by one pixel.</li>
      <li><b>Blur:</b> a row of 1/3s averages each pixel with its left and right neighbors, a horizontal motion blur. A column of 1/3s blurs vertically.</li>
      <li><b>Sharpen:</b> 2 × identity minus a blur. That's the image plus (image − blurred image), so the detail gets added back twice.</li></ul>
      ${fig("conv-39", "Filtering with a shifted impulse shifts the image. Watch the direction")}
      ${fig("conv-41", "A horizontal row of 1/3s gives a motion blur")}
      ${fig("conv-46", "Sharpening = 2 × identity − blur")}
      ${worked("Let's compute one output pixel", `
        <p>Image patch around our pixel and a kernel (no flipping yet, this is plain filtering):</p>
        <div class="matwrap">${M([[200,130,20],[255,100,10],[200,100,30]])} filtered with ${M([[0.5,0,0],[0,1.5,0.5],[0,-0.5,0]])}</div>
        <ol><li>Multiply each pair of overlapping numbers: 200×0.5 = 100, 100×1.5 = 150, 10×0.5 = 5, 100×(−0.5) = −50. Everything else is ×0.</li>
        <li>Add them: 100 + 150 + 5 − 50 = <b>205</b>.</li></ol>`)}
      ${idea("A kernel that sums to 1 keeps the overall brightness (blurs). A kernel that sums to 0 gives 0 on flat regions and responds only to change (derivatives).")}`,
      quick: [{t: "mc", q: "A 3×3 kernel has 1/3 in each cell of its <b>middle column</b> and zeros elsewhere. What does it do?", opts: ["Blurs vertically", "Blurs horizontally", "Shifts the image down", "Sharpens"], a: 0, why: "It averages each pixel with the pixels above and below it."}]},
    {h: "Convolution flips the kernel", b: () => `
      <p class="lede">Convolution is filtering with one twist: the kernel is flipped 180° first. On an exam, almost everything depends on getting this flip right.</p>
      ${eq("g[m, n] = Σ<sub>k,l</sub> I[m − k, n − l] · f[k, l]")}
      ${fig("conv-48", "Convolution: one output pixel is a weighted sum of nearby input pixels")}
      <p>The minus signs in <span class="mono">I[m − k, n − l]</span> are the flip. In practice:</p>
      <ol><li>Rotate the kernel by 180° (flip it left-right and top-bottom).</li><li>Slide the flipped kernel over the image.</li><li>At each position, multiply and add.</li></ol>
      ${fig("conv-50", "Convolution == filtering + kernel flipped")}
      <p>Filtering without the flip is called <b>correlation</b>. For symmetric kernels (box, Gaussian, Laplacian), flipping changes nothing, so the two are identical. For anything lopsided, they differ.</p>
      <h4>The impulse test</h4>
      <p>Feed in an image that is all zeros except a single 1 (an <b>impulse</b>). Convolution returns a copy of the kernel, because the flip during sliding and the flip in the formula cancel. Correlation returns the kernel rotated 180°. This is exactly how the practice exam's conv2d bug was spotted: the output was K upside-down.</p>
      ${fig("conv-51", "With a 1 in the top-left of the kernel, the image moves up and left")}
      ${idea("Under convolution, the image moves <b>toward</b> wherever the 1 sits in the kernel. A 1 to the right of center moves the image right. Under correlation it moves the opposite way.")}
      ${worked("Worked example: convolve by hand (zero padding, same size)", `
        <div class="matwrap">I = ${M([[1,2,0],[0,1,3],[2,0,1]])} f = ${M([[0,1,0],[0,0,2],[0,0,0]])}</div>
        <ol><li>Read the kernel as offsets from its center: a <b>1 at (−1, 0)</b> (one row up) and a <b>2 at (0, +1)</b> (one column right).</li>
        <li>Each entry at offset (a, b) contributes <span class="mono">f·I[m − a, n − b]</span>, so <span class="mono">g[m, n] = 1·I[m+1, n] + 2·I[m, n−1]</span>.</li>
        <li>g[0, 2] = I[1, 2] + 2·I[0, 1] = 3 + 2·2 = 7. g[1, 0] = I[2, 0] + 2·I[1, −1] = 2 + 0 = 2. Keep going for every pixel.</li>
        <li>Result: ${M([[0,3,7],[2,0,3],[0,4,0]])}</li></ol>`)}`,
      quick: [{t: "mc", q: "You convolve an impulse image with a non-symmetric kernel K. The output around the impulse is K rotated by 180°. What does this tell you about the code?", opts: ["It computes correlation (no flip)", "It is correct", "The padding is wrong", "The kernel is too big"], a: 0, why: "True convolution of an impulse gives K exactly."}]},
    {h: "Output sizes, borders and padding", b: () => `
      <p class="lede">When the kernel hangs off the edge of the image, you have to decide what to do. That decision sets both the size of the output and what the borders look like.</p>
      ${fig("conv-57", "Full, same and valid convolution")}
      <div class="scroll"><table class="t"><tr><th>Mode</th><th>What it means</th><th>Output size</th></tr>
      <tr><td><code>valid</code></td><td>Only where the kernel fits entirely inside</td><td>N − k + 1</td></tr>
      <tr><td><code>same</code></td><td>Pad (k − 1)/2 on each side, so the size stays N</td><td>N</td></tr>
      <tr><td><code>full</code></td><td>Any overlap at all. <b>The default for convolve2d!</b></td><td>N + k − 1</td></tr></table></div>
      <p>Rows and columns are handled separately. The lecture's example: a 640×360 image and a 10×10 kernel give 649×369 (full), 640×360 (same) and 631×351 (valid).</p>
      ${worked("Working backwards (practice exam 1.1)", `<p>A 300×400 image, valid mode, gives a 296×398 output. 300 − k + 1 = 296 → k = 5 rows, and 400 − k + 1 = 398 → k = 3 columns, so the kernel is <b>5×3</b>. To keep 300×400 you'd pad <b>2 rows</b> on top and bottom and <b>1 column</b> on left and right.</p>`)}
      <h4>What goes in the padding?</h4>
      ${fig("conv-61", "The filter window falls off the edge of the image")}
      <ul><li><b>Zeros</b> (<code>np.pad</code> default, <code>boundary='fill'</code>): simple, but a blur averages in black, so you get a dark frame.</li>
      <li><b>Replicate</b> (<code>mode='edge'</code>): repeat the border pixel.</li>
      <li><b>Reflect / mirror</b> (<code>'reflect'</code>, <code>'symmetric'</code>, <code>boundary='symm'</code>): mirror the image at the border.</li>
      <li><b>Wrap</b>: treat the image like a torus.</li></ul>
      ${fig("conv-63", "Zero, wrap, clamp and mirror padding, and what each does to a blur")}
      ${worked("Why zero padding darkens the border", `<p>Blur an image where every pixel is 90 with the 3×3 box (all 1/9). An interior pixel averages nine 90s, which gives 90. An edge pixel sees six real pixels and three zeros: 6·90/9 = 60. A corner sees four real pixels: 4·90/9 = 40. Replicate or reflect padding gives 90 everywhere.</p>`)}`,
      quick: [{t: "vec", q: "A 640×360 image is convolved with a 10×10 kernel in <code>full</code> mode. Output size?", fmt: "same order as 640×360", a: [649,369], tol: 0, why: "N + k − 1 in each direction."}]},
    {h: "Properties: commutative, associative, separable", b: () => `
      <p class="lede">Convolution behaves a lot like multiplication, and those properties are what make fast filtering possible.</p>
      <ul><li><b>Linear</b>: filtering a sum = sum of filtered parts, and scaling passes through.</li>
      <li><b>Shift-invariant</b>: the same operation everywhere in the image.</li>
      <li><b>Commutative</b>: f ⊗ g = g ⊗ f. (Correlation is <b>not</b>.)</li>
      <li><b>Associative</b>: (f ⊗ g) ⊗ h = f ⊗ (g ⊗ h).</li>
      <li><b>Distributive</b>: f ⊗ (g + h) = f ⊗ g + f ⊗ h.</li></ul>
      <p class="faint">These hold exactly for full convolution. Cropping to 'same' at each step can break them at the borders.</p>
      <h4>Associativity saves work</h4>
      <p>Canny wants the derivative of a blurred image: (I ⊗ G) ⊗ dx. Associativity says that equals I ⊗ (G ⊗ dx). G ⊗ dx is a tiny kernel you compute once, so you filter the big image one time instead of two. That's exactly what Project 2's <code>findDerivatives</code> does.</p>
      <h4>Separable kernels</h4>
      <p>Some 2-D kernels are an outer product of a column and a row (box, Gaussian, Sobel). Then I ⊗ (column ⊗ row) = (I ⊗ column) ⊗ row, which is two 1-D passes.</p>
      ${worked("Counting the savings (HW 1)", `<p>A k×k kernel costs k² multiplies per output pixel. Two 1-D passes cost k + k = 2k. For a 9×9 Gaussian that's <b>81 vs 18</b>. In HW 1, filtering with [−1, 0, 1] and then a 3×1 column was cheaper than one 3×3 pass, and gave the identical result, which is associativity in action.</p>`)}`,
      quick: [{t: "mc", q: "Why can Project 2 precompute <code>Gx = convolve2d(G, dx)</code> and then do one convolution on the image?", opts: ["Convolution is associative", "Convolution is commutative", "Gaussians are separable", "dx sums to zero"], a: 0, why: "(I ⊗ G) ⊗ dx = I ⊗ (G ⊗ dx)."}]},
    {h: "The kernel zoo", b: () => `
      <p class="lede">A few kernels come up over and over. Know what each looks like and what it does.</p>
      ${fig("conv-66", "Gaussian, derivative of Gaussian, and Laplacian of Gaussian")}
      <div class="scroll"><table class="t"><tr><th>Kernel</th><th>What it does</th></tr>
      <tr><td>Box (all 1/k²)</td><td>Simple blur. Sums to 1.</td></tr>
      <tr><td>Gaussian</td><td>Smooth blur that weights near pixels more. Rotationally symmetric and separable. σ sets the strength. Repeated box blurs approach a Gaussian (HW 1 P5).</td></tr>
      <tr><td>Derivative [1, 0, −1]</td><td>Under <b>convolution</b> it computes I(x+1) − I(x−1): positive where brightness increases to the right. Sums to 0.</td></tr>
      <tr><td>Sobel</td><td>Derivative one way × [1, 2, 1] smoothing the other way.</td></tr>
      <tr><td>Derivative of Gaussian</td><td>Smooth and differentiate in one kernel (Canny step 1).</td></tr>
      <tr><td>Laplacian / LoG</td><td><b>Second</b> derivative: ∇²G = ∂²G/∂x² + ∂²G/∂y². Responds to blobs and edges at the scale σ. A Difference of Gaussians (DoG) approximates it.</td></tr>
      <tr><td>Sharpen 2δ − box</td><td>Center 2 − 1/9 = 17/9, −1/9 everywhere else.</td></tr></table></div>
      <h4>Low-pass vs high-pass, and the hybrid image</h4>
      ${fig("conv-69", "A hybrid image: the dog's low frequencies plus the cat's high frequencies")}
      <p>Blurring removes high spatial frequencies. Derivatives and high-pass filters amplify rapid change, <b>including noise</b>. That's why Canny smooths before it differentiates. A hybrid image adds one picture's low frequencies to another's high frequencies: up close you see the high-frequency picture (cat), from far away the low-frequency one (dog).</p>`,
      quick: [{t: "mc", q: "The Laplacian of Gaussian is…", opts: ["A second-derivative filter", "A first-derivative filter", "A blur that sums to 1", "A shift"], a: 0, why: "∇²G sums the second derivatives in x and y."}]}
  ],

{
  id: "canny", name: "canny edges", title: "Canny edge detection", tag: "exam section 2 · hw 2 · project 2", glyph: [[1,0,-1],[2,0,-2],[1,0,-1]],
  lessons: [
    {h: "What makes a good edge detector", b: () => `
      <p class="lede">An edge map is a binary image: 1 where there's an edge, 0 elsewhere. Canny's 1986 detector set out to do three things well.</p>
      <ol><li><b>Good detection</b>: find real edges, and not noise.</li><li><b>Good localization</b>: put the edge exactly where it is.</li><li><b>Single response</b>: one pixel-wide line per edge, not a thick band.</li></ol>
      ${fig("canny-18", "The Canny pipeline")}
      <p>Each step of the algorithm serves one of those goals:</p>
      <ol><li><b>Smooth and differentiate</b> (derivative of Gaussian), against noise.</li>
      <li><b>Gradient magnitude and orientation</b>: how strong the edge is and which way it faces.</li>
      <li><b>Non-maximum suppression</b>, for a single thin response.</li>
      <li><b>Hysteresis linking</b>: keep connected edges, drop isolated noise.</li></ol>
      <p>Edges come from many physical causes (depth jumps, surface color changes, lighting and shadow boundaries), but the detector only sees intensity change.</p>`,
      quick: []},
    {h: "Steps 1–2: the image gradient", b: () => `
      <p class="lede">The gradient tells you, at each pixel, which direction brightness increases fastest and how fast.</p>
      ${fig("canny-20", "Step 1: filter with the derivative of a Gaussian")}
      <p>Project 2 builds the smoothed derivative kernels once (associativity) and then filters the image:</p>
      ${code(`
dx = np.array([[1, 0, -1], [2, 0, -2], [1, 0, -1]])     # Sobel
dy = np.array([[1, 2, 1], [0, 0, 0], [-1, -2, -1]])
Gx = signal.convolve2d(G, dx, mode='same')
Gy = signal.convolve2d(G, dy, mode='same')
Magx = signal.convolve2d(I, Gx, mode='same')
Magy = signal.convolve2d(I, Gy, mode='same')
Mag = np.sqrt(Magx**2 + Magy**2)
Ori = np.arctan2(Magy, Magx)`)}
      ${fig("canny-25", "Step 2: gradient magnitude")}
      <h4>Getting the directions right</h4>
      <ul><li>Image coordinates: <b>x is the column (right)</b>, <b>y is the row (down)</b>. Angles go from +x toward +y, which is clockwise on screen.</li>
      <li>The gradient points from dark toward bright, <b>across</b> the edge.</li>
      <li>The edge itself runs perpendicular: <b>edge direction = θ + 90°</b>.</li>
      <li>Use <code>np.arctan2(Gy, Gx)</code>, with y first. Plain <code>arctan(Gy/Gx)</code> loses the quadrant and divides by zero.</li></ul>
      ${fig("canny-31", "Gradient magnitude and orientation, color-coded")}
      ${worked("Worked example", `<p>At pixel p, G<sub>x</sub> = 3 and G<sub>y</sub> = 4.</p><ol>
        <li>Magnitude: √(3² + 4²) = <b>5</b>.</li>
        <li>Orientation: θ = arctan2(4, 3) ≈ <b>53.13°</b> (down and to the right on screen).</li>
        <li>Edge direction: 53.13° + 90° = <b>143.13°</b>.</li>
        <li>Unit step along the gradient: (cos θ, sin θ) = (3/5, 4/5) = <b>(0.6, 0.8)</b>.</li></ol>`)}
      ${idea("G<sub>x</sub> large and G<sub>y</sub> = 0 means brightness changes left to right, so the edge is <b>vertical</b> (HW 2 1.2).")}`,
      quick: [{t: "num", q: "G<sub>x</sub> = 5, G<sub>y</sub> = 12. Gradient magnitude?", a: 13, tol: 0, why: "√(25 + 144) = 13."}]},
    {h: "Step 3: non-maximum suppression", b: () => `
      <p class="lede">After step 2, edges are thick bright ridges several pixels wide. NMS thins each ridge to its single peak.</p>
      ${fig("canny-37", "The gradient direction at points along a curved edge")}
      ${fig("canny-38", "Non-maximum suppression along the line of the gradient")}
      <p>The rule: keep p only if it's at least as large as both neighbors <b>along the gradient</b>, the two pixels you reach by stepping across the edge:</p>
      ${eq("keep p  ⇔  Mag(p) ≥ Mag(p + (cos θ, sin θ))  and  Mag(p) ≥ Mag(p − (cos θ, sin θ))")}
      <ul><li>Course convention: use <b>≥</b>, so ties survive. Pixels outside the image count as 0.</li>
      <li>Compare <b>along the gradient</b>, not along the edge. Along the edge, neighbors are supposed to be similar.</li></ul>
      <h4>The quick version: round to 45°</h4>
      <p>Hand problems often round θ to the nearest 45° and compare actual grid neighbors (y points down):</p>
      <div class="scroll"><table class="t"><tr><th>θ (gradient)</th><th>Compare with</th></tr>
      <tr><td>0° or 180°</td><td>left and right</td></tr><tr><td>90° or 270°</td><td>above and below</td></tr>
      <tr><td>45° or 225°</td><td>bottom-right and top-left</td></tr><tr><td>135° or 315°</td><td>bottom-left and top-right</td></tr></table></div>
      <p>The exact version interpolates the off-grid neighbors instead (next article). <b>The two can disagree</b>, and the practice exam asks about exactly that.</p>`,
      quick: [{t: "mc", q: "θ = 135° with y pointing down. Using the rounding method, NMS compares p with:", opts: ["Bottom-left and top-right", "Top-left and bottom-right", "Left and right", "Above and below"], a: 0, why: "(cos 135°, sin 135°) ≈ (−0.71, +0.71): one step left and down, and its opposite."}]},
    {h: "Bilinear interpolation", b: () => `
      <p class="lede">p + (cos θ, sin θ) usually lands between pixels. The lecture is clear: <b>don't round the location</b>, interpolate the value.</p>
      ${fig("canny-46", "There are no intensity values at r and p, so interpolate them from neighbors")}
      <p>For a query point (x, y), let x<sub>0</sub> = ⌊x⌋, y<sub>0</sub> = ⌊y⌋, a = x − x<sub>0</sub>, b = y − y<sub>0</sub>. Blend the four surrounding pixels:</p>
      ${eq("f ≈ (1−a)(1−b)·f(x₀,y₀) + a(1−b)·f(x₀+1,y₀) + (1−a)b·f(x₀,y₀+1) + ab·f(x₀+1,y₀+1)")}
      <p>Each corner's weight is the area of the rectangle <b>opposite</b> it, so closer corners count more. In numpy, f(x, y) is <code>M[y, x]</code>: row first.</p>
      ${worked("Worked example (same style as practice exam 2.1)", `
        <p>Magnitudes around p (center, value 10). The gradient step is (0.6, 0.8):</p><div class="matwrap">${M([[9,4,1],[6,10,5],[2,7,12]])}</div>
        <ol><li>Forward neighbor at (x, y) = (1.6, 1.8). Corners (1,1) = 10, (2,1) = 5, (1,2) = 7, (2,2) = 12, with a = 0.6, b = 0.8.</li>
        <li>0.4·0.2·10 + 0.6·0.2·5 + 0.4·0.8·7 + 0.6·0.8·12 = 0.8 + 0.6 + 2.24 + 5.76 = <b>9.4</b>.</li>
        <li>Backward neighbor at (0.4, 0.2): 0.6·0.8·9 + 0.4·0.8·4 + 0.6·0.2·6 + 0.4·0.2·10 = <b>7.12</b>.</li>
        <li>10 ≥ 9.4 and 10 ≥ 7.12, so p is <b>kept</b>.</li>
        <li>With 45° rounding, 53° → 45° compares with 12 (bottom-right) and 9 (top-left), so p is <b>suppressed</b>.</li></ol>`)}
      <h4>In code: no loops</h4>
      ${fig("canny-50", "Edge detection without loops using meshgrid")}
      ${fig("canny-48", "The interp2 helper: interp2(V, Xq, Yq)")}
      <p><code>interp2(v, xq, yq)</code> takes <b>x (columns) first</b>. Build xq, yq for every pixel at once with <code>np.meshgrid</code> or <code>np.indices</code>, and remember that <code>np.indices</code> returns rows (y) first.</p>`,
      quick: [{t: "num", q: "Bilinear: f(0,0) = 0, f(1,0) = 10, f(0,1) = 20, f(1,1) = 30. Value at (x, y) = (0.5, 0.5)?", a: 15, tol: .001, why: "All four weights are 0.25: (0 + 10 + 20 + 30)/4 = 15."}]},
    {h: "Step 4: hysteresis linking", b: () => `
      <p class="lede">One threshold can't do the job. Set it high and edges break up; set it low and noise floods in. Hysteresis uses two.</p>
      ${fig("canny-63", "The next edge point lies along the tangent, which is normal to the gradient")}
      <ul><li><b>Strong</b> pixels (Mag ≥ high) are definitely edges and act as seeds.</li>
      <li><b>Weak</b> pixels (low ≤ Mag &lt; high) are kept only if connected to a strong pixel, possibly through a chain of other kept weak pixels.</li>
      <li>Connections follow the <b>edge direction</b>, perpendicular to the gradient. A 0° gradient means a vertical edge, so link up/down. A 90° gradient means a horizontal edge, so link left/right.</li></ul>
      ${fig("canny-67", "A high threshold starts edge curves")}
      ${fig("canny-68", "A low threshold continues them")}
      ${worked("Walk through practice exam 2.3", `<p>Strong pixel in column 2, row 3; weak pixels above and below it; orientation 0° everywhere in that column.</p><ol>
        <li>0° gradient means a vertical edge, so from the strong pixel look up and down.</li>
        <li>Rows 2 and 4 are weak, so keep them (Y). From row 2, look up: row 1 is weak, so keep it too.</li>
        <li>In row 5 the orientation is 90° (horizontal edge), so the strong pixel there links left and right.</li>
        <li>A weak chain with no strong seed anywhere (column 5) is dropped.</li></ol>`)}
      ${idea("NMS compares along the <b>gradient</b>. Hysteresis links along the <b>edge</b>. Swapping these two is the classic mistake.")}
      <p>Thresholds trade off: too high → too few seeds → gaps. Too low → texture and noise get linked in. Project 2 tuned a (low, high) pair per image, with high ≈ 2–2.5 × low.</p>`,
      quick: [{t: "mc", q: "A weak pixel has a gradient orientation of 90°. Along which direction can it link?", opts: ["Left/right", "Up/down", "Diagonally", "Any neighbor"], a: 0, why: "90° means a horizontal edge, and linking follows the edge."}]},
    {h: "Project 2 walkthrough and bug checklist", b: () => `
      <p class="lede">The exam's debugging questions hide logic bugs in code like yours. Read your own implementation once more with this list in hand.</p>
      ${code(`
def nonMaxSup(Mag, Ori):
    y, x = np.indices(Mag.shape)            # rows (y) first!
    x_off, y_off = np.cos(Ori), np.sin(Ori) # step along the GRADIENT
    Mf = interp2(Mag, x + x_off, y + y_off)
    Mb = interp2(Mag, x - x_off, y - y_off)
    return (Mag >= Mf) & (Mag >= Mb)`)}
      <ul><li><code>arctan</code> instead of <code>arctan2</code>, or arguments swapped (<code>arctan2(Gx, Gy)</code>)</li>
      <li><code>dx</code> used for both gradients</li>
      <li>sin and cos swapped (that compares along the edge)</li>
      <li><code>interp2(Mag, y, x)</code> with the arguments reversed</li>
      <li><code>&gt;</code> where the spec says ≥, or comparing magnitude against orientation</li>
      <li>Skipping the Gaussian (noisy edges), or linking weak pixels along the gradient</li>
      <li>Returning a float map where a binary/boolean one is expected</li></ul>`,
      quick: []}
  ],
  practice: [
    {t: "num", q: "G<sub>x</sub> = 3, G<sub>y</sub> = 4. Gradient magnitude?", a: 5, tol: 0, why: "√(9 + 16) = 5."},

{
  id: "pyr", name: "pyramids", title: "Pyramids & Laplacian blending", tag: "exam section 3 · project 3", glyph: [[1,2,1],[2,4,2],[1,2,1]],
  lessons: [
    {h: "Why you can't just throw away pixels", b: () => `
      <p class="lede">To make an image half the size, the obvious move is to keep every other row and column. The lecture shows why that looks terrible.</p>
      ${fig("pyr-29", "Subsampling without blurring: why does this look so bad?")}
      <p>A half-size image can only hold half the detail, meaning lower frequencies. Fine patterns that don't fit don't simply disappear. They <b>alias</b> into false, jagged patterns (look at the stripes in the 1/8 version).</p>
      ${fig("pyr-32", "The fix: Gaussian pre-filtering, then subsample")}
      ${idea("<b>Blur first, then subsample.</b> The blur removes the frequencies the smaller image can't represent, so nothing aliases.")}
      <h4>The Gaussian pyramid</h4>
      <p>Repeat blur-and-subsample to get a stack of smaller and smaller images: G<sub>0</sub> is the original, G<sub>n+1</sub> = reduce(G<sub>n</sub>). A 512×512 image gives 512, 256, 128, 64, 32 for depth 5. Each level holds the image at a coarser scale, which is useful for blending, compression and coarse-to-fine optical flow.</p>`,
      quick: [{t: "num", q: "A 256×256 image, Gaussian pyramid with 4 levels (G<sub>0</sub>…G<sub>3</sub>). Side length of G<sub>3</sub>?", a: 32, tol: 0, why: "256 / 2³ = 32."}]},
    {h: "Reduce and expand", b: () => `
      <p class="lede">Two operations build everything in this unit: <b>reduce</b> goes down a level, <b>expand</b> comes back up.</p>
      ${fig("pyr-34", "Image reduce: each coarse sample is a weighted sum of five finer ones")}
      <h4>reduce</h4>
      <p>Blur with a 5×5 Gaussian (σ = 1 in Project 3), then keep the <b>1st, 3rd, 5th, …</b> rows and columns, which is <code>[::2, ::2]</code> (indices 0, 2, 4).</p>
      <h4>expand</h4>
      ${fig("pyr-42", "2-D expansion: place the pixels on a grid padded with zeros, then blur")}
      <ol><li>Make an array twice as large, filled with zeros.</li>
      <li>Put the original pixels at the even positions: <code>up[::2, ::2] = G</code>.</li>
      <li>Blur with the Gaussian.</li>
      <li>Multiply by <b>4</b> in 2-D (by 2 in 1-D).</li></ol>
      ${idea("Why the 4? After step 2, only 1 in 4 pixels is non-zero, so the blur averages in three zeros for every real pixel and the result is ¼ as bright. The factor restores the brightness.")}
      ${worked("1-D worked example (kernel ¼[1, 2, 1], zero padding)", `
        <p><b>reduce</b> x = [4, 8, 4, 0, 4, 8, 12, 8]:</p>
        <ol><li>Blur only where you'll keep a sample (indices 0, 2, 4, 6). Index 0: (0 + 2·4 + 8)/4 = 4. Index 2: (8 + 2·4 + 0)/4 = 4. Index 4: (0 + 8 + 8)/4 = 4. Index 6: (8 + 24 + 8)/4 = 10.</li>
        <li>G<sub>1</sub> = <b>[4, 4, 4, 10]</b>.</li></ol>
        <p><b>expand</b> G = [4, 12]:</p>
        <ol><li>Insert zeros: [4, 0, 12, 0].</li><li>Blur: [(0 + 8 + 0)/4, (4 + 0 + 12)/4, (0 + 24 + 0)/4, (12 + 0 + 0)/4] = [2, 4, 6, 3].</li><li>×2: <b>[4, 8, 12, 6]</b>.</li></ol>`)}`,
      quick: [{t: "vec", q: "expand [2, 6] with kernel ¼[1, 2, 1], zero padding, ×2.", fmt: "4 numbers", a: [2,4,6,3], tol: .001, why: "[2,0,6,0] → blur [1, 2, 3, 1.5] → ×2 = [2, 4, 6, 3]."}]},
    {h: "The Laplacian pyramid: keeping what the blur removes", b: () => `
      <p class="lede">A Gaussian pyramid throws information away at every level. A Laplacian pyramid saves it, so you can get the original back exactly.</p>
      ${fig("pyr-48", "What does blurring take away? Original minus smoothed")}
      <p>Each Laplacian level is the difference between a Gaussian level and the prediction you'd make from the level below it:</p>
      ${eq("L<sub>n</sub> = G<sub>n</sub> − expand(G<sub>n+1</sub>)  for n &lt; top,      L<sub>top</sub> = G<sub>top</sub>")}
      ${fig("pyr-61", "Extracting the Laplacian: blur, subsample, expand, subtract")}
      <ul><li>Each L<sub>n</sub> is a <b>band-pass</b> image: only the details at that scale. L<sub>0</sub> has the finest edges and texture.</li>
      <li>Flat regions are predicted perfectly, so L ≈ 0 there. Most values are near zero, which compresses well (the lecture's "store only the prediction error").</li>
      <li>Values are <b>negative</b> too. Keep them as float: <code>astype(np.uint8)</code> would wrap −3 to 253.</li></ul>
      ${fig("pyr-60", "Smoothed original + Laplacian image")}`,
      quick: [{t: "vec", q: "G<sub>1</sub> = [4, 4, 4, 10] and expand(G<sub>2</sub>) = [3, 4.25, 5.5, 2.75]. L<sub>1</sub>?", fmt: "4 numbers", a: [1,-.25,-1.5,7.25], tol: .001, why: "Subtract element by element."}]},
    {h: "Collapsing: getting the image back", b: () => `
      <p class="lede">Rebuild the image by running the construction backwards, from the coarsest level down to the finest.</p>
      ${eq("G<sub>n</sub> = expand(G<sub>n+1</sub>) + L<sub>n</sub>")}
      ${fig("pyr-63", "Reconstruction from the Laplacian pyramid, top to bottom")}
      ${code(`
def collapse(L):
    I = L[-1]                               # start at the coarsest level
    for n in range(len(L) - 2, -1, -1):     # go down to L[0]
        I = expand(I) + L[n]
    return I`)}
      ${idea("Reconstruction is <b>exact for any blur kernel</b>, even though reduce threw samples away. L<sub>n</sub> stores exactly what expand(G<sub>n+1</sub>) got wrong, so adding it back recovers G<sub>n</sub>. It only has to be the same expand both ways.")}
      ${worked("Practice exam 3.2, reversed", `<p>Given G<sub>2</sub> = [4, 12] and L<sub>1</sub> = [−2, 4, 4, −2]: expand(G<sub>2</sub>) = [4, 8, 12, 6], so G<sub>1</sub> = [4 − 2, 8 + 4, 12 + 4, 6 − 2] = [2, 12, 16, 4]. Then expand G<sub>1</sub> and add L<sub>0</sub> to get x.</p>`)}`,
      quick: [{t: "mc", q: "In which order do you collapse?", opts: ["Coarsest to finest", "Finest to coarsest", "Any order", "Only the top level matters"], a: 0, why: "You need G<sub>n+1</sub> before you can get G<sub>n</sub>."}]},
    {h: "Blending with pyramids", b: () => `
      <p class="lede">The payoff: seamlessly join two images, like the famous apple/orange or the lecture's dog/cow.</p>
      ${fig("pyr-71", "The recipe")}
      <ol><li>Build Laplacian pyramids LA, LB of the two images.</li>
      <li>Build a <b>Gaussian</b> pyramid GR of the mask (float, values 0 to 1).</li>
      <li>At every level: LS<sub>n</sub> = GR<sub>n</sub> · LA<sub>n</sub> + (1 − GR<sub>n</sub>) · LB<sub>n</sub>.</li>
      <li>Collapse LS.</li></ol>
      ${fig("pyr-69", "Combining the two pyramids level by level")}
      <h4>Why does this beat a simple feathered edge?</h4>
      <p>At coarse levels the mask is very blurry, so low frequencies (overall color and lighting) blend over a <b>wide</b> transition and there's no visible seam. At fine levels the mask is sharp, so fine details switch over a <b>narrow</b> transition and there's no double-image ghosting. A single feather width has to pick one; the pyramid gets both.</p>
      ${fig("pyr-72", "The blended result")}`,
      quick: [{t: "mc", q: "The mask pyramid used as weights must be a…", opts: ["Gaussian pyramid", "Laplacian pyramid", "Full-resolution mask only", "Laplacian of (1 − mask)"], a: 0, why: "Weights have to be smooth and between 0 and 1."}]},
    {h: "Project 3 walkthrough and bug checklist", b: () => `
      <p class="lede">Practice exam 3.1 had three bugs in a blend function. Here's every classic one.</p>
      ${code(`
LA = laplacian_pyramid(A, depth)
LB = laplacian_pyramid(B, depth)
GR = gaussian_pyramid(mask, depth)          # NOT laplacian
LS = [GR[d] * LA[d] + (1 - GR[d]) * LB[d] for d in range(depth)]
result = collapse(LS)                       # NOT LS[0]`)}
      <ul><li><code>[1::2]</code> instead of <code>[::2]</code>: keeps the wrong samples</li>
      <li>Missing <code>4 *</code> in expand: every level gets darker</li>
      <li>Subsampling before blurring: aliasing</li>
      <li>Laplacian pyramid of the mask instead of Gaussian</li>
      <li>LA used twice instead of LA and LB</li>
      <li>Returning LS[0] (only fine detail, so a nearly black image with faint edges) instead of collapse(LS)</li>
      <li>Collapsing from fine to coarse, or forgetting L<sub>top</sub> = G<sub>top</sub></li>
      <li>Mask stored as 0/255 instead of 0/1, or casting to uint8 too early</li>
      <li>Hard-coding 3 channels when the mask has 1</li></ul>`,
      quick: []}
  ],

{
  id: "homog", name: "homography", title: "Homography, matching & RANSAC", tag: "exam section 4 · project 4", glyph: [[1,1,1],[1,1,1],[.35,.35,1]],
  lessons: [
    {h: "Homogeneous coordinates", b: () => `
      <p class="lede">To turn perspective into plain matrix multiplication, we write a 2-D point with three numbers.</p>
      ${fig("tf-2", "A 2-D point is a 3-D ray λ(x, y, 1)")}
      ${eq("(x, y)  →  (x, y, 1)            (X, Y, W)  →  (X / W, Y / W)")}
      <ul><li>Every multiple is the same point: (6, 8, 2), (3, 4, 1) and (30, 40, 10) are all (3, 4). Geometrically, a pixel is a ray through the camera center.</li>
      <li>Translation and perspective become 3×3 matrix multiplications.</li>
      <li><b>Always divide by the third coordinate after multiplying by H.</b> Forgetting this is the most common homography bug.</li></ul>`,
      quick: [{t: "vec", q: "Which 2-D point is (−4, 10, 2)?", fmt: "x, y", a: [-2,5], tol: 0, why: "Divide by 2."}]},
    {h: "A family of transformations", b: () => `
      <p class="lede">Each transformation keeps fewer properties than the one before it but has more freedom. Know the degrees of freedom (DOF) and what each one preserves.</p>
      ${fig("tf-48", "Hierarchy of transformations")}
      <div class="scroll"><table class="t"><tr><th>Transform</th><th>DOF</th><th>Still true afterwards</th></tr>
      <tr><td>Translation</td><td>2</td><td>Everything except position</td></tr>
      <tr><td>Euclidean (rotate + translate)</td><td>3</td><td>Length, angle, area</td></tr>
      <tr><td>Similarity (+ uniform scale)</td><td>4</td><td>Length ratio, angle</td></tr>
      <tr><td>Affine</td><td>6</td><td>Parallelism, ratio of areas, ratio of lengths</td></tr>
      <tr><td>Projective (homography)</td><td>8</td><td>Straight lines (collinearity), concurrency, cross ratio</td></tr></table></div>
      <p>Each row also keeps everything in the rows below it. The jump from affine to projective is that <b>parallel lines can meet</b>, like railroad tracks heading to a vanishing point.</p>`,
      quick: [{t: "num", q: "DOF of a similarity transform?", a: 4, tol: 0, why: "Rotation + scale + 2 translation."}]},
    {h: "Solving for a homography", b: () => `
      <p class="lede">A homography maps one plane to another (a wall seen from two angles, or a panorama from a rotating camera). Let's find H from point matches.</p>
      ${fig("tf-41", "Perspective transform (homography)")}
      ${eq("λ (v<sub>x</sub>, v<sub>y</sub>, 1)ᵀ = H (u<sub>x</sub>, u<sub>y</sub>, 1)ᵀ   ⇒   v<sub>x</sub> = (h₁₁u<sub>x</sub> + h₁₂u<sub>y</sub> + h₁₃) / (h₃₁u<sub>x</sub> + h₃₂u<sub>y</sub> + h₃₃)")}
      ${fig("tf-51", "Homography computation: cross-multiply to get linear equations")}
      <p>Multiply both sides by the denominator and move everything to one side. Each correspondence gives <b>two</b> linear equations in the 9 unknowns of h:</p>
      ${code(`
[u_x, u_y, 1, 0, 0, 0, -u_x*v_x, -u_y*v_x, -v_x]
[0, 0, 0, u_x, u_y, 1, -u_x*v_y, -u_y*v_y, -v_y]`)}
      ${fig("tf-54", "How many correspondences?")}
      <h4>How many points?</h4>
      <p>H has 9 entries, but multiplying H by any k gives the same mapping (the division cancels k), so it has <b>8 DOF</b>. 8 unknowns ÷ 2 equations per point = <b>4 points</b>, with no three on a line.</p>
      <h4>Solving Ah = 0</h4>
      ${code(`
A = np.array(A)                 # (8, 9) for 4 points; (2N, 9) for N
U, S, Vt = np.linalg.svd(A)
h = Vt[-1]                      # last ROW = smallest singular value
H = h.reshape(3, 3)
H = H / H[2, 2]`)}
      <p>The trivial h = 0 always satisfies Ah = 0, so we require ‖h‖ = 1, and the answer is the right singular vector with the smallest singular value. With more than 4 points, the same line gives the least-squares fit.</p>`,
      quick: [{t: "vec", q: "Shape of A for N = 6 correspondences?", fmt: "rows, cols", a: [12,9], tol: 0, why: "2 rows per point, 9 unknowns."}]},
    {h: "Warping images with H", b: () => `
      <p class="lede">Once you have H, you can rectify a tilted photo or stitch a panorama. The question is which way to map the pixels.</p>
      ${fig("tf-49", "Fun with homography: rectify the floor as if seen from the top")}
      ${code(`
p_h = np.hstack([p, np.ones((p.shape[0], 1))])   # (N, 3)
proj = (H @ p_h.T).T
proj = proj / proj[:, 2:3]                         # 2:3 keeps shape (N, 1)`)}
      <ul><li><b>Forward warping</b> pushes every source pixel to its destination. Where the image stretches, some destination pixels receive nothing, leaving holes.</li>
      <li><b>Inverse warping</b> goes the other way: for every destination pixel (use <code>np.meshgrid</code>), map it back to the source, read a value (rounded or bilinear), and skip anything out of bounds. There are no holes.</li></ul>
      ${worked("Project 4 rectification", `<p>H was computed so that λ·p<sub>tilted</sub> = H·p<sub>canvas</sub>. So for each canvas pixel (x, y), <code>H @ [x, y, 1]</code> (then ÷ w) says where to read from the tilted photo. That's inverse warping, and it's why the canvas has no holes.</p>`)}`,
      quick: [{t: "mc", q: "Why does inverse warping leave no holes?", opts: ["Every output pixel looks up a source value", "It uses a bigger kernel", "It skips the divide by w", "It only works for affine maps"], a: 0, why: "You loop over destinations, so each one gets filled."}]},
    {h: "Finding matches: SIFT and the ratio test", b: () => `
      <p class="lede">To estimate H automatically, you need matching points between the images. That means describing local patches in a way that survives changes in rotation, scale and lighting.</p>
      ${fig("rs-14", "SIFT finds each keypoint's own scale and orientation")}
      <p><b>SIFT</b> detects keypoints with a location, scale and orientation, then describes the patch with a <b>128-D descriptor</b>: histograms of gradient orientations over a 4×4 grid of cells × 8 bins, measured relative to the keypoint's own orientation and scale. So the same point looks the same after rotation or zoom.</p>
      ${fig("rs-21", "Nearest neighbor search with the ratio test")}
      <h4>The ratio test</h4>
      <p>For each feature, find its nearest (d₁) and second-nearest (d₂) descriptor distances in the other image. Accept the match only if <b>d₁ / d₂ &lt; 0.7</b>. A ratio near 1 means two candidates look equally good, so the match is ambiguous (think repeated windows on a building).</p>
      ${fig("rs-23", "With the ratio test, the matches are far cleaner")}
      ${fig("rs-26", "Bi-directional consistency check")}
      <p>Run it in both directions (A → B over each row of the distance matrix, B → A over each column) and keep only matches found both ways. That removes many-to-one matches.</p>
      ${worked("Practice exam 4.1 in miniature", `<p>Distances from A₁ to B: [4, 12, 16] → 4/12 = 0.33, accept A₁→B₁. From A₄: [3, 9, 18] → 0.33, accept A₄→B₁. Now go backward from B₁: column [4, 25, 10, 3] → 3/4 = 0.75, rejected. Two A features claimed B₁, and the backward test catches it.</p>`)}`,
      quick: [{t: "mc", q: "Best distance 4, second best 5, threshold 0.7.", opts: ["Rejected (0.8 ≥ 0.7)", "Accepted (0.8)", "Accepted (1.25)", "Need more data"], a: 0, why: "4/5 = 0.8 is too close to 1: ambiguous."}]},
    {h: "RANSAC: ignoring the bad matches", b: () => `
      <p class="lede">Even after the ratio test, some matches are wrong. Least squares lets those outliers drag the whole fit, so RANSAC fits small random samples and lets the data vote.</p>
      ${fig("rs-32", "One outlier ruins a least-squares fit")}
      <ol><li><b>Random sampling</b>: pick 4 matches (no repeats: <code>replace=False</code>).</li>
      <li><b>Model building</b>: fit H to those 4.</li>
      <li><b>Thresholding</b>: project <i>every</i> point with H, divide by w, compute the error to its match.</li>
      <li><b>Inlier counting</b>: count the errors below the threshold. Keep the H with the most inliers. Optionally refit with least squares on all of its inliers.</li></ol>
      ${fig("rs-40", "Inlier counting for one sample")}
      ${fig("rs-54", "How many iterations?")}
      ${eq("k = log(1 − p) / log(1 − wⁿ)")}
      <p>w = inlier fraction, n = points per sample (4 for H), p = desired probability of at least one all-inlier sample.</p>
      ${worked("Worked example", `<ol><li>w = 0.5, n = 4: one sample is all-inlier with probability 0.5⁴ = 0.0625.</li><li>k = log(0.01) / log(0.9375) ≈ 71.4 → <b>72 iterations</b> for p = 0.99.</li><li>At w = 0.7: 0.7⁴ ≈ 0.24 → k ≈ 17.</li></ol>`)}
      ${worked("Scoring a candidate H (practice exam 4.2 style)", `<p>H = [[1, 0, 3], [0, 2, 1], [0, 0.5, 1]] and P1 = (2, 2): H(2, 2, 1)ᵀ = (5, 5, 2) → (2.5, 2.5). If the match is at (2.5, 2.4), the error is 0.1, an inlier at threshold 1.</p>`)}`,
      quick: [{t: "mc", q: "Why sample without replacement?", opts: ["Repeated points make the 4-point fit degenerate", "It's faster", "So the threshold works", "So H is normalized"], a: 0, why: "Duplicates give fewer than 4 distinct constraints."}]}
  ],

    {t: "mc", q: "Best 3, second best 5, threshold 0.7:", opts: ["Accepted (0.6)", "Rejected", "Accepted (5/3)", "Need the third best"], a: 0, why: "0.6 < 0.7."},
    {t: "mc", q: "What does the backward (B → A) test catch?", opts: ["Many-to-one matches", "Rotated features", "Close features", "Nothing"], a: 0, why: "Two A features both picking the same B."},
    {t: "mc", q: "SIFT descriptors are built to be invariant to:", opts: ["Scale and rotation (robust to brightness)", "Any 3-D viewpoint", "Occlusion", "Hue only"], a: 0, why: "Measured relative to each keypoint's own scale and orientation."},
    {t: "explain", q: "<b>Short answer.</b> What is the minimum number of point correspondences needed to compute a homography? Explain why, and what extra condition the points need.", model: "4. H is 3×3 = 9 entries, but it is only defined up to scale (kH maps points identically, because the division by the third coordinate cancels k), so it has 8 degrees of freedom. Each correspondence gives 2 equations (one for x, one for y), so 8/2 = 4 points. No three of them may be collinear, or the equations become dependent.", points: ["8 DOF (9 entries, minus scale)", "2 equations per correspondence → 4 points", "No three collinear"]},
    {t: "explain", q: "<b>Short answer.</b> Why use RANSAC instead of fitting H to all matched points with least squares?", model: "Feature matches include outliers (wrong matches). Least squares minimizes squared error, so a few far-off outliers dominate and pull the fit badly. RANSAC repeatedly fits H to a minimal random sample (4 matches), counts how many matches agree within a threshold (inliers), and keeps the H with the most inliers, so outliers never influence the chosen model. You can then refit with least squares on the inliers only.", points: ["Matches contain outliers", "Squared error lets outliers dominate least squares", "RANSAC: minimal samples + inlier voting, outliers ignored"]}

{
  id: "flow", name: "optical flow", title: "Optical flow (Lucas–Kanade)", tag: "exam section 5 · hw 3", glyph: [[0,0,1],[0,1,0],[1,0,0]],
  lessons: [
    {h: "What optical flow is", b: () => `
      <p class="lede">Two frames of video. Where did each point go? That 2-D displacement at every pixel is the <b>optical flow</b>.</p>
      ${fig("of-14", "Optical flow as 2-D point correspondences between frames")}
      ${fig("of-16", "The model: I(x) = J(x + d)")}
      <p>Call the first frame I and the second J. We want the displacement d = (u, v) such that</p>
      ${eq("J(x + u, y + v) ≈ I(x, y)")}
      <p>This rests on <b>brightness constancy</b>: a point keeps the same intensity as it moves.</p>
      <h4>The brute-force way</h4>
      <p>Take a small window around the point in I. Try every displacement in a search range, compute the sum of squared differences (SSD) with J, and pick the minimum. HW 3 problem 1 does exactly this: a template centered at (2, 2) whose best match is at (3, 4) has flow (3 − 2, 4 − 2) = (1, 2).</p>
      ${fig("of-20", "The cost E(d) as a function of displacement: bumpy and nonlinear")}
      <p>Brute force is slow and only finds whole-pixel answers. Next we'll solve for d directly.</p>`,
      quick: [{t: "vec", q: "Template centered at (x, y) = (4, 1) in frame 1; best SSD match at (x', y') = (2, 2) in frame 2. Flow (u, v)?", fmt: "u, v", a: [-2,1], tol: 0, why: "(2 − 4, 2 − 1)."}]},
    {h: "Linearize with a Taylor expansion", b: () => `
      <p class="lede">E(d) is nonlinear in d because d sits inside J. The lecture's plan has three steps: write it as least squares, linearize with Taylor, then solve and iterate.</p>
      ${fig("of-23", "Three steps for solving this problem")}
      ${fig("of-33", "Step 2: Taylor expansion of J around x")}
      ${eq("J(x + u, y + v) ≈ J(x, y) + J<sub>x</sub> u + J<sub>y</sub> v")}
      <p>Plug that into brightness constancy and rearrange:</p>
      ${eq("J<sub>x</sub> u + J<sub>y</sub> v ≈ I − J      (= −I<sub>t</sub>,  where I<sub>t</sub> = J − I)")}
      <ul><li>The expansion is <b>first order</b>, so it's only accurate when d is <b>small</b>.</li>
      <li>The gradients J<sub>x</sub>, J<sub>y</sub> come from <b>J</b>, the image being shifted. HW 3 and the practice exam both use <code>find_gradient(img2)</code>.</li>
      <li>Watch the sign: b = I − J. The practice exam's buggy line 5 had J − I.</li></ul>`,
      quick: [{t: "mc", q: "With I<sub>t</sub> = J − I, the right-hand side is:", opts: ["−I<sub>t</sub> = I − J", "I<sub>t</sub>", "J", "I + J"], a: 0, why: "J<sub>x</sub>u + J<sub>y</sub>v ≈ I − J."}]},
    {h: "The aperture problem", b: () => `
      <p class="lede">One pixel gives one equation, J<sub>x</sub> u + J<sub>y</sub> v = I − J. But there are two unknowns.</p>
      ${fig("of-41", "2-D unknowns per pixel")}
      <p>Geometrically, the equation only pins down the component of motion <b>along the gradient</b>. Motion along the edge changes nothing you can see. It's like watching a long diagonal bar through a small hole: you can't tell if it's sliding along itself.</p>
      <ul><li><b>Flat region</b>: J<sub>x</sub> = J<sub>y</sub> = 0. The equation says 0 = 0, so any d works and there's no information.</li>
      <li><b>Edge</b>: gradients all point one way. You get the normal component only.</li>
      <li><b>Corner or texture</b>: gradients in several directions, so both components are determined.</li></ul>
      ${idea("To get both u and v, you need more equations from pixels whose gradients point in <b>different directions</b>.")}`,
      quick: [{t: "mc", q: "Why can't you recover flow inside a flat, constant region?", opts: ["Gradients are 0, so every d satisfies the equation", "The window is too small", "Brightness constancy fails", "The Taylor expansion diverges"], a: 0, why: "Motion produces no visible change."}]},
    {h: "Lucas–Kanade: pool a window", b: () => `
      <p class="lede">Lucas and Kanade's fix: assume every pixel in a small window moves together. Then you have many equations for the same two unknowns.</p>
      ${fig("of-51", "Pooling over a window W")}
      ${eq("A = [J<sub>x</sub>  J<sub>y</sub>]  (one row per pixel),   b = I − J,   (AᵀA) d = Aᵀb")}
      ${fig("of-42", "AᵀA is the second-moment matrix")}
      <div class="matwrap">AᵀA = ${M([["ΣJ<sub>x</sub>²","ΣJ<sub>x</sub>J<sub>y</sub>"],["ΣJ<sub>x</sub>J<sub>y</sub>","ΣJ<sub>y</sub>²"]])}   Aᵀb = ${M([["ΣJ<sub>x</sub>(I − J)"],["ΣJ<sub>y</sub>(I − J)"]])}</div>
      <p>You'll invert 2×2 matrices by hand: [[a, b], [c, d]]⁻¹ = 1/(ad − bc) · [[d, −b], [−c, a]].</p>
      ${worked("Practice exam 5.2, step by step", `
        <div class="scroll"><table class="t"><tr><th>pixel</th><th>J<sub>x</sub></th><th>J<sub>y</sub></th><th>J − I</th><th>b = I − J</th></tr>
        <tr><td>1</td><td>2</td><td>1</td><td>−1</td><td>1</td></tr><tr><td>2</td><td>1</td><td>2</td><td>1</td><td>−1</td></tr>
        <tr><td>3</td><td>1</td><td>0</td><td>−1</td><td>1</td></tr><tr><td>4</td><td>0</td><td>1</td><td>1</td><td>−1</td></tr></table></div>
        <ol><li>ΣJ<sub>x</sub>² = 4 + 1 + 1 + 0 = 6. ΣJ<sub>x</sub>J<sub>y</sub> = 2 + 2 + 0 + 0 = 4. ΣJ<sub>y</sub>² = 1 + 4 + 0 + 1 = 6. So AᵀA = [[6, 4], [4, 6]].</li>
        <li>ΣJ<sub>x</sub>b = 2 − 1 + 1 + 0 = 2. ΣJ<sub>y</sub>b = 1 − 2 + 0 − 1 = −2. So Aᵀb = [2, −2].</li>
        <li>det = 36 − 16 = 20. d = (1/20)·[[6, −4], [−4, 6]]·[2, −2] = (1/20)·[20, −20] = <b>(1, −1)</b>.</li></ol>`)}
      ${fig("of-54", "Summing over pixels gives a 2×2 system")}`,
      quick: [{t: "vec", q: "Solve [[6, 2], [2, 6]] d = [4, 8].", fmt: "u, v", a: [.25,1.25], tol: .001, why: "(1/32)·[[6, −2], [−2, 6]]·[4, 8] = (8/32, 40/32)."}]},
    {h: "When LK fails, and how to fix it", b: () => `
      <p class="lede">LK makes three assumptions. Each one can break.</p>
      <ol><li><b>Brightness constancy</b>: lighting changes and reflections break it.</li>
      <li><b>Small motion</b>: the Taylor step is only valid for small d.</li>
      <li><b>Spatial coherence</b>: everything in the window moves together. Bigger windows give more equations but more risk of this failing.</li></ol>
      <h4>Is AᵀA invertible?</h4>
      <p>Look at its eigenvalues. Two large ones means a corner or texture: a good estimate. One large and one ≈ 0 means an edge: the aperture problem, and the matrix is singular. Both ≈ 0 means a flat region.</p>
      <h4>Large motion: iterate</h4>
      ${fig("of-56", "Step 3: solve for the displacement, warp the image, and iterate")}
      <p>Solve once, warp J by the current estimate, solve again for the leftover displacement, add it on, and repeat. Each step is a Gauss–Newton step on the nonlinear least squares.</p>
      ${fig("of-57", "Iterations converge toward the true displacement")}
      <h4>Large motion: coarse-to-fine</h4>
      <p>Build pyramids of I and J. Big motion is small motion at a coarse level. Estimate d at the top, <b>multiply by 2</b> each time you move one level finer, then refine. A flow of (1.5, −0.5) at ¼ resolution starts as (6, −2) at full resolution.</p>
      ${worked("Why HW 3 problem 2 went wrong", `<p>The true motion was (1, 2) pixels, too big for a single linear step, so the 3×3 window gave (0.348, 0.304) and the 5×5 window was worse, at (0.085, −0.047). The bigger window pulled in more pixels whose gradients disagreed with a single small shift.</p>`)}`,
      quick: [{t: "vec", q: "Coarse-to-fine: flow (2, 1) at pyramid level 3 (1/8 resolution). Initial flow at full resolution?", fmt: "u, v", a: [16,8], tol: 0, why: "×2 per level, three levels: ×8."}]},
    {h: "Global affine flow (HW 3 problem 3)", b: () => `
      <p class="lede">Instead of one shift per window, model the whole image's motion with 6 affine parameters and use every pixel.</p>
      ${eq("x + u = A₁₁x + A₁₂y + b₁ ⇒ u = (A₁₁ − 1)x + A₁₂y + b₁,    v = A₂₁x + (A₂₂ − 1)y + b₂")}
      <p>Substitute into J<sub>x</sub>u + J<sub>y</sub>v = −I<sub>t</sub>. Every pixel gives one row:</p>
      ${eq("[J<sub>x</sub>x, J<sub>x</sub>y, J<sub>x</sub>, J<sub>y</sub>x, J<sub>y</sub>y, J<sub>y</sub>] · [A₁₁−1, A₁₂, b₁, A₂₁, A₂₂−1, b₂]ᵀ = −I<sub>t</sub>")}
      ${code(`
fx = np.array([[1, 0, -1]]); fy = fx.T
Jx = convolve2d(img2, fx, mode='same')       # gradients of J = img2
Jy = convolve2d(img2, fy, mode='same')
It = img2 - img1
x, y = np.meshgrid(np.arange(W), np.arange(H))
x = x - W // 2;  y = y - H // 2              # centered coordinates
A = np.c_[(Jx*x).ravel(), (Jx*y).ravel(), Jx.ravel(),
          (Jy*x).ravel(), (Jy*y).ravel(), Jy.ravel()]
b = (-It).ravel()
res = np.linalg.solve(A.T @ A, A.T @ b)
A_ = np.array([[res[0] + 1, res[1]], [res[3], res[4] + 1]])   # add the 1s back`)}
      ${idea("Window slicing is <code>[rows = y, cols = x]</code>. b is −I<sub>t</sub>. The normal matrix is AᵀA (small), not AAᵀ (huge). These three show up as bugs again and again.")}`,
      quick: [{t: "num", q: "How many unknowns does global affine flow solve for?", a: 6, tol: 0, why: "A₁₁−1, A₁₂, b₁, A₂₁, A₂₂−1, b₂."}]}
  ],

    {t: "explain", q: "<b>Short answer.</b> Why can't the displacement be found at a single pixel, or in a flat region? Why does pooling equations over a window help?", model: "Each pixel gives only one equation Jx·u + Jy·v = I − J for two unknowns, which fixes only the motion component along the gradient (aperture problem). In a flat region Jx = Jy = 0, so the equation is 0 = 0 and every d satisfies it, because motion causes no visible change. Pooling a window adds equations from pixels whose gradients point in different directions, which makes AᵀA (the second-moment matrix) invertible, so both u and v are determined.", points: ["One equation, two unknowns (aperture problem)", "Flat: zero gradient, so no constraint", "Window adds gradients in different directions, so AᵀA is invertible"]}

{
  id: "cam", name: "camera", title: "Camera model & dolly zoom", tag: "project 1 (not one of the five exam sections)", glyph: [[1,0,1],[0,1,1],[0,0,1]],
  lessons: [
    {h: "How a camera turns 3D into 2D", b: () => `
      <p class="lede">A pinhole camera sends every ray through a single point. Where a ray hits the image plane depends only on its direction.</p>
      ${fig("cam-51", "The pinhole model: all rays pass through a single point")}
      <p>By similar triangles, a point (X, Y, Z) lands at</p>
      ${eq("x = f · X / Z,     y = f · Y / Z")}
      ${fig("cam-81", "3-D point projection in metric space")}
      <p>So an object of height H at depth d appears with height <b>h = f·H / d</b>. Depth is divided out, which is what you lose going from 3-D to 2-D: a pixel corresponds to a whole ray of possible 3-D points.</p>
      ${worked("Quick example", `<p>A 1.7 m person at 5 m with f = 1000 px: h = 1000 · 1.7 / 5 = <b>340 px</b>. Walk back to 10 m and they're 170 px.</p>`)}`,
      quick: [{t: "num", q: "f = 800 px, a 2 m object 4 m away. Image height in pixels?", a: 400, tol: 0, why: "800 · 2 / 4."}]},
    {h: "From millimetres to pixels: K", b: () => `
      <p class="lede">Real cameras measure the focal length in millimetres on a sensor, while we work in pixels. The intrinsic matrix K converts between them.</p>
      ${fig("cam-84", "Projection in pixel space, with the principal point")}
      ${eq("u = f·X/Z + p<sub>x</sub>,    v = f·Y/Z + p<sub>y</sub>")}
      <div class="matwrap">λ ${M([["u"],["v"],["1"]])} = ${M([["f","0","p<sub>x</sub>"],["0","f","p<sub>y</sub>"],["0","0","1"]])} ${M([["X"],["Y"],["Z"]])}</div>
      <ul><li>f in pixels = f in mm × (image width in px / sensor width in mm).</li>
      <li>(p<sub>x</sub>, p<sub>y</sub>) is the <b>principal point</b>, where the optical axis hits the image, usually near the center.</li>
      <li><b>Intrinsics</b> (K) belong to the camera. <b>Extrinsics</b> [R | t] are its pose in the world: λx = K[R | t]X.</li></ul>
      ${fig("cam-102", "The camera intrinsic parameter matrix")}
      ${worked("Example", `<p>A 50 mm lens on a 36 mm-wide sensor, with a 1200 px-wide image: f = 50 · 1200 / 36 ≈ <b>1667 px</b>.</p>`)}`,
      quick: [{t: "mc", q: "Which are extrinsic parameters?", opts: ["R and t", "f", "(p<sub>x</sub>, p<sub>y</sub>)", "Pixel size"], a: 0, why: "Extrinsics are the camera's pose."}]},
    {h: "The dolly zoom", b: () => `
      <p class="lede">Hitchcock's <i>Vertigo</i> shot: the subject stays the same size while the background seems to stretch or shrink. It's just h = f·H/d applied to two depths.</p>
      ${fig("cam-94", "Dolly zoom, the Vertigo effect")}
      <p>Move the camera by pos toward the subject (positive = closer). The new distance is d − pos. Keep the subject's height fixed:</p>
      ${eq("f · H / d = f' · H / (d − pos)    ⇒    f' = f · (d − pos) / d")}
      ${code(`
def compute_focal_length(d_ref, f_ref, pos):
    return (d_ref - pos) / d_ref * f_ref`)}
      ${worked("Why the background moves", `<ol><li>f = 500, subject at 10 m, dolly 4 m closer: f' = 500 · 6/10 = 300.</li><li>A background object at 20 m was 500/20 = 25 px per metre tall. Now it's 300/16 = 18.75 px per metre.</li><li>The subject's distance shrank by 40% and the background's by only 20%, so zooming out to cancel the subject's growth shrinks the background.</li></ol>`)}
      ${fig("cam-97", "Exercise: what Z keeps the person the same size?")}`,
      quick: [{t: "mc", q: "The camera dollies away from the subject. The focal length must…", opts: ["Increase", "Decrease", "Stay the same", "It depends on the background"], a: 0, why: "f' = f(d − pos)/d, and pos < 0."}]},
    {h: "Two objects, one target ratio", b: () => `
      <p class="lede">Project 1's second function: choose where to put the camera so two objects at different depths appear at a chosen height ratio.</p>
      ${eq("h₁ / h₂ = ratio  ⇒  H₁ / (d₁ − pos) = ratio · H₂ / (d₂ − pos)")}
      <p>f cancels. Cross-multiply and solve for pos:</p>
      ${eq("pos = (H₁·d₂ − ratio·H₂·d₁) / (H₁ − ratio·H₂)")}
      <p>Then get f' from object 1 with the dolly formula.</p>
      ${worked("The test case", `<p>d₁ = 4, d₂ = 20, H₁ = 4, H₂ = 6, ratio = 1.5, f = 400. pos = (80 − 36)/(4 − 9) = <b>−8.8</b> (back up 8.8 m), then f' = 400 · 12.8/4 = <b>1280</b>.</p>`)}
      ${idea("The autograder hint: h₁/h₂ ≠ H₁/H₂, because the objects sit at different depths.")}`,
      quick: []}

  ["flow","Coarse-to-fine ×2 per level; affine flow row"], ["cam","h = fH/d; f' = f(d − pos)/d; K matrix"],
  ["all","Gotchas: convolve2d default 'full', meshgrid vs indices, Vt[-1], replace=False"]
];

/* ---------- state ---------- */
const KEY = "cgovind:cis5810:midterm1";
let S = {read: {}, prac: {}, code: {}, sheet: {}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const app = document.getElementById("app");

let mock = null;
const unit = id => UNITS.find(u => u.id === id);
const learnDone = u => (S.read[u.id] || []).length >= u.lessons.length;
const pracDone = u => !!(S.prac[u.id] && S.prac[u.id].mastered);
const codeDone = u => u.code.every((_, i) => S.code[u.id] && S.code[u.id][i]);
const color = id => "var(--c-" + id + ")";

/* ---------- answer checking ---------- */
function num(s) {
  s = String(s).trim().replace(/[−–]/g, "-");
  if (!s || !/^[0-9+\-*/().\s]+$/.test(s)) return NaN;
  try { const v = Function('"use strict";return (' + s + ")")(); return typeof v === "number" && isFinite(v) ? v : NaN; } catch (e) { return NaN; }
}
const vec = s => String(s).replace(/[\[\]()]/g, " ").split(/[,;]|\s+/).map(x => x.trim()).filter(Boolean).map(num);
const norm = s => String(s).replace(/\s+/g, "").replace(/"/g, "'").replace(/;$/, "").replace(/\.0+(?=\D|$)/g, "");
const fmtN = x => Number.isInteger(x) ? String(x) : String(+x.toFixed(4));
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function btn(t, cls) { const b = el("button", cls || "pillbtn"); b.textContent = t; return b; }
function row(...k) { const r = el("div", "row"); r.append(...k); return r; }

/* ---------- question renderer ---------- */
function renderQ(host, q, done) {
  host.innerHTML = "";
  const card = el("div", "card q");
  card.append(el("div", "qtext", q.q));
  if (q.show) card.append(el("div", "", q.show()));
  host.append(card);
  const fb = el("div", "fb");
  let over = false;
  const finish = (ok, html, label) => {
    if (over) return; over = true;
    card.classList.add(ok ? "hit" : "miss");
    fb.innerHTML = '<div class="verdict ' + (ok ? "ok" : "bad") + '">' + (label || (ok ? "✓ correct" : "✗ not quite")) + '</div><div class="why">' + html + "</div>";
    card.append(fb); done(ok, fb);
  };
  const selfGrade = (html, onYes, onNo, yesLabel, noLabel) => {
    over = true;
    fb.innerHTML = html; card.append(fb);
    const y = btn(yesLabel || "I had it", "pillbtn go"), n = btn(noLabel || "I missed something");
    const r = row(y, n); fb.append(r);
    y.onclick = () => { r.remove(); card.classList.add("hit"); onYes(); };
    n.onclick = () => { r.remove(); card.classList.add("miss"); onNo(); };
  };

  if (q.t === "mc") {
    const order = q.opts.map((_, i) => i).sort(() => Math.random() - .5);
    const opts = el("div", "opts"); let pick = -1;
    const chk = btn("check", "pillbtn go"); chk.disabled = true;
    const bs = order.map(i => {
      const b = el("button", "opt", q.opts[i]); b.dataset.i = i; b.setAttribute("aria-pressed", "false");
      b.onclick = () => { if (over) return; pick = i; bs.forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); chk.disabled = false; };
      opts.append(b); return b;
    });
    card.append(opts, row(chk));
    chk.onclick = () => { chk.parentNode.remove(); bs.forEach(b => { const i = +b.dataset.i; if (i === q.a) b.classList.add("right"); else if (i === pick) b.classList.add("wrong"); b.disabled = true; }); finish(pick === q.a, q.why); };
  }

  if (q.t === "num" || q.t === "vec") {
    const ent = el("div", "entry"); const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false; inp.id = "ans";
    inp.placeholder = q.t === "num" ? "a number (17/9 works)" : (q.fmt || "comma-separated");
    const chk = btn("check", "pillbtn go"); ent.append(inp, chk); card.append(ent);
    if (q.t === "vec") card.append(el("div", "hint", "format: " + esc(q.fmt || "comma-separated numbers")));
    const run = () => {
      if (over || !inp.value.trim()) return;
      const tol = (q.tol || 0) + 1e-9; let ok;
      if (q.t === "num") ok = Math.abs(num(inp.value) - q.a) <= tol;
      else { const v = vec(inp.value); ok = v.length === q.a.length && v.every((x, i) => Math.abs(x - q.a[i]) <= tol); }
      inp.disabled = true; chk.remove();
      const ans = q.t === "num" ? fmtN(q.a) : q.a.map(fmtN).join(", ");
      finish(ok, (ok ? "" : 'answer: <span class="mono">' + ans + "</span>. ") + q.why);
    };
    chk.onclick = run; inp.onkeydown = e => { if (e.key === "Enter") run(); };
    setTimeout(() => inp.focus({preventScroll: true}), 0);
  }

  if (q.t === "explain") {
    const ta = el("textarea"); ta.id = "explain"; ta.placeholder = "write your answer the way you would on the exam…";
    const show = btn("compare with model answer", "pillbtn go");
    card.append(ta, row(show));
    show.onclick = () => {
      show.parentNode.remove(); ta.readOnly = true;
      selfGrade('<div class="verdict">model answer</div><div class="why">' + esc(q.model) + '</div><div class="why"><b>a full-credit answer hits:</b><ul>' + q.points.map(p => "<li>" + p + "</li>").join("") + "</ul></div>",
        () => done(true, fb), () => done(false, fb), "I hit every point", "I missed a point");
    };
  }

  if (q.t === "grid") {
    const state = {};
    const g = el("div", "gridq"); g.style.gridTemplateColumns = "repeat(" + q.cols + ", 2.6rem)";
    const cells = [];
    for (let r = 0; r < q.rows; r++) for (let c = 0; c < q.cols; c++) {
      const k = r + "," + c, b = el("button"); b.setAttribute("aria-label", "row " + (r + 1) + " column " + (c + 1));
      b.onclick = () => { if (over) return; const cyc = ["", ...q.marks]; state[k] = cyc[(cyc.indexOf(state[k] || "") + 1) % cyc.length]; b.textContent = state[k]; b.classList.toggle("on", !!state[k]); };
      g.append(b); cells.push([k, b]);
    }
    const wrap = el("div", "scroll"); wrap.append(g);
    const chk = btn("check", "pillbtn go");
    card.append(el("div", "hint", "click a cell to cycle: blank → " + q.marks.join(" → ") + " → blank"), wrap, row(chk));
    chk.onclick = () => {
      chk.parentNode.remove();
      let ok = true;
      cells.forEach(([k, b]) => {
        const want = q.answer[k] || "", got = state[k] || "";
        if (want !== got) { ok = false; b.classList.add("badc"); b.textContent = want || "·"; }
        else if (want) b.classList.add("good");
        b.disabled = true;
      });
      finish(ok, (ok ? "" : "red cells were wrong; they now show the right mark (· = blank). ") + q.why);
    };
  }

  if (q.t === "bug") {
    const picked = new Set();
    const box = el("div", "code"); box.setAttribute("role", "group"); box.setAttribute("aria-label", "code lines; click to mark as buggy");
    const chk = btn("check lines", "pillbtn go"); chk.disabled = true;
    const lines = q.lines.map((l, i) => {
      const b = el("button", "line", '<span class="n">' + (i + 1) + "</span>" + esc(l || " ")); b.setAttribute("aria-pressed", "false");
      b.onclick = () => { if (over) return; const n = i + 1; picked.has(n) ? picked.delete(n) : picked.add(n); b.classList.toggle("picked"); b.setAttribute("aria-pressed", picked.has(n)); chk.disabled = !picked.size; };
      box.append(b); return b;
    });
    card.append(el("div", "hint", "step 1: click every line with a bug (" + q.bugs.length + " bug" + (q.bugs.length > 1 ? "s" : "") + "). step 2: write the corrected line(s), like the exam asks."), box, row(chk));
    chk.onclick = () => {
      chk.parentNode.remove();
      const allowed = new Set(q.bugs.flat());
      const linesOk = [...picked].every(n => allowed.has(n)) && q.bugs.every(gr => gr.filter(n => picked.has(n)).length === 1);
      lines.forEach((b, i) => {
        const n = i + 1; b.disabled = true;
        if (picked.has(n)) b.classList.add(allowed.has(n) ? "isbug" : "notbug");
        else if (q.bugs.some(gr => gr[0] === n && !gr.some(m => picked.has(m)))) b.classList.add("missed");
      });
      if (!linesOk) { finish(false, "the bugs are on line" + (q.bugs.length > 1 ? "s " : " ") + q.bugs.map(gr => gr.join("/")).join(", ") + " (marked in amber if you missed them). " + q.fix + '<div class="model">' + esc(q.fixes.join("\n")) + "</div>"); return; }
      const fx = el("div", "stack");
      fx.append(el("div", "verdict ok", "✓ right lines. now write the fix" + (q.bugs.length > 1 ? "es" : "")));
      q.bugs.forEach((gr, k) => {
        const r = el("div", "fixrow"); const id = "fix" + k;
        r.innerHTML = '<label for="' + id + '">corrected line ' + gr[0] + "</label>";
        const inp = el("input"); inp.id = id; inp.type = "text"; inp.spellcheck = false; inp.autocomplete = "off"; inp.value = q.lines[gr[0] - 1].trim();
        r.append(inp); fx.append(r);
      });
      const cmp = btn("compare with the model fix", "pillbtn go"); fx.append(row(cmp)); card.append(fx);
      cmp.onclick = () => {
        cmp.parentNode.remove(); fx.querySelectorAll("input").forEach(i => i.readOnly = true);
        selfGrade('<div class="verdict">model fix</div><div class="model">' + esc(q.fixes.join("\n")) + '</div><div class="why">' + q.fix + "</div>",
          () => done(true, fb), () => done(false, fb), "my fix matches", "mine was wrong");
      };
    };
  }

  if (q.t === "fill") {
    const parts = esc(q.src).split("____");
    card.append(el("div", "code", '<div style="padding:0.4rem 0.9rem;white-space:pre">' + parts[0] + '<span class="blank">?</span>' + (parts[1] || "") + "</div>"));
    const ent = el("div", "entry"); const inp = el("input"); inp.type = "text"; inp.id = "ans"; inp.autocomplete = "off"; inp.spellcheck = false; inp.placeholder = "type the missing code";
    const chk = btn("check", "pillbtn go"); ent.append(inp, chk); card.append(ent);
    const run = () => {
      if (over || !inp.value.trim()) return;
      inp.disabled = true; chk.remove();
      if (q.accept.map(norm).includes(norm(inp.value))) { finish(true, 'model answer: <code>' + esc(q.model) + "</code>"); return; }
      selfGrade('<div class="verdict warn">compare with the model answer</div><div class="model">' + esc(q.model) + '</div><div class="why">free-form code is hard to auto-check. if yours does the same thing, take the credit.</div>',
        () => done(true, fb), () => done(false, fb), "mine is equivalent", "I had it wrong");
    };
    chk.onclick = run; inp.onkeydown = e => { if (e.key === "Enter") run(); };
    setTimeout(() => inp.focus({preventScroll: true}), 0);
  }
}

];
function mglyph(k) {
  const flat = k.flat(), mx = Math.max(...flat.map(Math.abs)) || 1;
  return '<span class="mglyph" aria-hidden="true">' + flat.map(v => '<i style="background:' +
    (v === 0 ? "color-mix(in srgb, var(--a) 18%, transparent)" : "color-mix(in srgb, var(--a) " + Math.round(45 + 55 * Math.abs(v) / mx) + "%, transparent)") + '"></i>').join("") + "</span>";
}
function steps(u) {
