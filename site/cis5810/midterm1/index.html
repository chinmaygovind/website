    .map(([t, d]) => `<span class="step ${d ? "on" : ""}"><i></i>${t}</span>`).join("") + "</span>";
}
function topbar() {
  const items = [["home", "units"], ["format", "exam format"], ["mock", "mock exam"], ["ref", "functions"], ["sheet", "cheat sheet"]];
  const cur = view.page === "unit" ? "home" : view.page;
  return `<header class="topbar"><div class="in"><button class="brand" data-go="home"><span class="sq"><i></i><i></i><i></i><i></i></span>cis 5810 · exam 1</button>
    <nav class="nav">${items.map(([p, t]) => `<button data-go="${p}" aria-current="${cur === p}">${t}</button>`).join("")}</nav></div></header>`;
}
function bindGo() { app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go({page: b.dataset.go})); }
function countdown() {
  const exam = new Date("2026-10-22T15:30:00-04:00"), now = new Date();
  const day = d => new Date(d.toLocaleString("en-US", {timeZone: "America/New_York"})).setHours(0, 0, 0, 0);
  const diff = Math.round((day(exam) - day(now)) / 864e5);
  if (now > new Date(exam.getTime() + 90 * 60e3)) return ["done", "good luck on the grades"];
  if (diff <= 0) return ["today", "3:30 pm, eat something first"];
  if (diff === 1) return ["tomorrow", "thursday, october 22"];
  return [diff + " days", "until thursday, october 22"];
}
function nextStep() {
  for (const u of UNITS) {
    const seen = S.read[u.id] || [];
    const unread = u.lessons.findIndex((_, i) => !seen.includes(i));
    if (unread >= 0) return {page: "unit", id: u.id, sec: "a" + unread};
    if (!pracDone(u)) return {page: "unit", id: u.id, sec: "practice"};
    if (!codeDone(u)) return {page: "unit", id: u.id, sec: "code"};
  }
  return {page: "mock"};
}

/* ---------- pages ---------- */
function page(accentId, kicker, title, sideHtml, extra) {
  app.innerHTML = topbar() + `<div style="--a:${color(accentId)}">
    <section class="uhead"><div class="in"><button class="crumb" data-go="home">← all units</button><div class="eyebrow">${kicker}</div><h1>${title}</h1>${extra || ""}</div></section>

  bindGo();
  return document.getElementById("main");
}

function renderUnit() {
  const u = unit(view.id), seen = S.read[u.id] = S.read[u.id] || [];
  if (view.sec.startsWith("a") && !seen.includes(+view.sec.slice(1))) { seen.push(+view.sec.slice(1)); save(); }
  const side = "<h3>ARTICLES</h3>" + u.lessons.map((l, i) => `<button class="navitem" data-sec="a${i}" aria-current="${view.sec === "a" + i}"><span class="num ${seen.includes(i) ? "on" : ""}">${seen.includes(i) ? "✓" : i + 1}</span><span>${l.h}</span></button>`).join("") +
    "<h3>PRACTICE</h3>" +
    `<button class="navitem" data-sec="practice" aria-current="${view.sec === "practice"}"><span class="num ${pracDone(u) ? "on" : ""}">${pracDone(u) ? "✓" : "?"}</span><span>practice round</span></button>` +
    `<button class="navitem" data-sec="code" aria-current="${view.sec === "code"}"><span class="num ${codeDone(u) ? "on" : ""}">${codeDone(u) ? "✓" : "{}"}</span><span>code lab</span></button>`;
  const main = page(u.id, u.tag, u.title, side, steps(u));
  app.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => { view.sec = b.dataset.sec; render(); window.scrollTo(0, 0); });
  if (view.sec.startsWith("a")) articleView(u, +view.sec.slice(1), main);
  else if (view.sec === "practice") practiceView(u, main);
  else codeView(u, main);
}

function articleView(u, i, main) {
  const L = u.lessons[i];
  const seen = S.read[u.id] = S.read[u.id] || [];
  if (!seen.includes(i)) { seen.push(i); save(); }
  const art = el("article", "", '<div class="eyebrow">article ' + (i + 1) + " of " + u.lessons.length + "</div><h2>" + L.h + "</h2>" + L.b());
  main.append(art);
  if (L.quick && L.quick.length) {
    const cy = el("div", "check-yourself", "<h4>check your understanding</h4>");
    L.quick.forEach(q => { const h = el("div"); cy.append(h); renderQ(h, q, () => {}); });
    art.append(cy);
  }
  const nav = el("div", "artnav");
  const prev = btn("← previous"); prev.disabled = i === 0; prev.onclick = () => { view.sec = "a" + (i - 1); render(); window.scrollTo(0, 0); };
  const next = btn(i < u.lessons.length - 1 ? "next: " + u.lessons[i + 1].h.toLowerCase() + " →" : "start practicing →", "pillbtn go");
  next.onclick = () => { view.sec = i < u.lessons.length - 1 ? "a" + (i + 1) : "practice"; render(); window.scrollTo(0, 0); };
  nav.append(prev, next); art.append(nav);
}

function practiceView(u, main) {
  const bank = u.practice, size = Math.min(7, bank.length), need = size - 1;
  const rec = S.prac[u.id] || {best: 0, mastered: false, missed: []};
  const s = session[u.id];
  if (!s) {
    main.innerHTML = `<article><div class="eyebrow">practice</div><h2>${rec.mastered ? "mastered. keep it warm" : "practice round"}</h2>
      <p class="lede">${size} questions from a bank of ${bank.length}: hand computations, true/false, written short answers${u.practice.some(q => q.t === "grid") ? " and grids" : ""}, like the exam. Get <b>${need} of ${size}</b> to master the unit.</p>
      <p>Questions you missed last time come up first. Best so far: <b>${rec.best} / ${size}</b>.</p></article>`;
    const st = btn(rec.best ? "start another round →" : "start round →", "pillbtn go"); const r = row(st); r.style.marginTop = "1.2rem"; main.append(r);
    st.onclick = () => {
      const missed = (rec.missed || []).filter(i => i < bank.length).sort(() => Math.random() - .5);
      const rest = bank.map((_, i) => i).filter(i => !missed.includes(i)).sort(() => Math.random() - .5);
      session[u.id] = {order: [...missed, ...rest].slice(0, size), i: 0, res: []}; render();
    };
    return;
  }
  if (s.i >= s.order.length) {
    const right = s.res.filter(Boolean).length, passed = right >= need;
    rec.best = Math.max(rec.best, right); rec.mastered = rec.mastered || passed; rec.missed = s.order.filter((_, k) => !s.res[k]);
    S.prac[u.id] = rec; save(); delete session[u.id];
    main.innerHTML = `<article><div class="prog">${s.res.map(r => `<i class="${r ? "ok" : "no"}"></i>`).join("")}</div><div class="big">${right} / ${s.order.length}</div>
      <h2>${passed ? "practice mastered" : "not yet, " + need + " needed"}</h2>
      <p>${passed ? (codeDone(u) ? "This unit is done. Pick the next one, or run a mock exam." : "Next up: the code lab.") : "The ones you missed come first next round. If a mistake surprised you, reread the matching article."}</p></article>`;
    const again = btn("practice again"); again.onclick = () => render();
    const bs = [again];
    if (passed && !codeDone(u)) { const c = btn("go to code lab →", "pillbtn go"); c.onclick = () => { view.sec = "code"; render(); }; bs.unshift(c); }
    const r = row(...bs); r.style.marginTop = "1.2rem"; main.append(r);
    return;
  }
  main.innerHTML = `<div class="stack" style="max-width:760px"><div class="prog">${s.order.map((_, k) => `<i class="${k < s.res.length ? (s.res[k] ? "ok" : "no") : (k === s.i ? "cur" : "")}"></i>`).join("")}</div><div class="eyebrow">question ${s.i + 1} of ${s.order.length}</div><div id="qhost"></div></div>`;
  renderQ(document.getElementById("qhost"), bank[s.order[s.i]], (ok, fb) => {
    s.res.push(ok);
    const nx = btn(s.i + 1 < s.order.length ? "next question →" : "see results", "pillbtn go");
    nx.onclick = () => { s.i++; render(); window.scrollTo(0, 0); };
    fb.append(row(nx));
  });
}

function codeView(u, main) {
  const solved = S.code[u.id] = S.code[u.id] || {};
  const i = Math.min(view.ex || 0, u.code.length - 1);
  const label = e => e.t === "bug" ? "find & fix" : e.t === "fill" ? "fill in" : "predict";
  main.innerHTML = `<div class="stack" style="max-width:760px"><div class="eyebrow">code lab</div>
    <p class="faint">Exam debugging questions give you code, an input and the wrong output, then ask for (1) each buggy line, (2) what it computes instead, (3) the corrected line. The bugs are in the algorithm's logic, not the syntax.</p>
    <div class="row">${u.code.map((e, j) => `<button class="pillbtn ${j === i ? "go" : ""}" data-ex="${j}">${solved[j] ? "✓ " : ""}${j + 1} · ${label(e)}</button>`).join("")}</div><div id="qhost"></div></div>`;
  main.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { view.ex = +b.dataset.ex; render(); });
  renderQ(document.getElementById("qhost"), u.code[i], (ok, fb) => {
    if (ok) { solved[i] = true; save(); }
    const bs = [];
    if (!ok) { const r = btn("try again"); r.onclick = () => render(); bs.push(r); }
    const nu = u.code.findIndex((_, j) => !solved[j]);
    if (nu >= 0) { const n = btn("next exercise →", "pillbtn go"); n.onclick = () => { view.ex = nu === i ? (i + 1) % u.code.length : nu; render(); }; bs.push(n); }
    else { const d = btn("code lab cleared. back to units", "pillbtn go"); d.onclick = () => go({page: "home"}); bs.push(d); }
    fb.append(row(...bs));
  });
}

function renderFormat() {
  const main = page("format", "what the paper actually looks like", "exam format");
  main.innerHTML = `<article>
    <p class="lede">The practice exam (Ed #370, key in #405) is the best guide: staff said it shows "both the content and style of the real exam". It's a handwritten paper in five sections, and each section mixes four kinds of question.</p>
    <h4>Compute by hand, showing every step</h4>
    <p>"For computational questions, clearly show all intermediate steps." Output and padding sizes, a box blur at the border, gradient magnitude and direction, NMS with bilinear interpolation, a 1-D reduce/expand/Laplacian rebuild, ratio tests both ways, projecting points through H and counting inliers, a 2×2 Lucas–Kanade solve. No calculator, so the numbers are friendly.</p>
    <h4>Fill in a grid</h4>
    <p>Mark "+" on pixels that survive NMS (2.2), or X/Y for strong and kept-weak pixels after hysteresis (2.3). The Canny practice bank has both.</p>
    <h4>True/false with a reason, and short explanations</h4>
    <p>"If a statement is false, briefly explain why." Plus why-questions: the dark frame, exact reconstruction, why 4 points, why RANSAC, why flat regions fail. In the practice banks these are the written questions: answer, then compare against a model answer and its checklist.</p>
    <h4>Debugging code</h4>
    <p>A function, its input, the observed output (often an error) and the expected output, then "there are exactly N bugs: identify the line, write the corrected version, explain the fix." The practice exam's bugs: convolution with no kernel flip; a Laplacian pyramid of the mask, LA used twice, and LS[0] returned; Lucas–Kanade with the wrong sign, an un-windowed gradient, and (AAᵀ)⁻¹. The code labs work the same way.</p>
    <div class="idea"><b>Rules to remember.</b> Unless told otherwise, assume zero padding and same output size. Syntax isn't tested, but the bugs live in calls from the projects: np.pad, np.arange, np.meshgrid, convolve2d, interp2 (Ed #374). You scan your paper and upload it to Gradescope in the last 5–10 minutes, then hand in the hard copy.</div>
    <h4>What's covered</h4>
    <p>Lectures through optical flow, HW 1–3 and Projects 1–4. Image morphing was dropped (Ed #370).</p></article>`;
}

function renderMock() {
  const main = page("mock", "16 questions, mixed like the real paper", "mock exam");
  if (!mock) {
    main.innerHTML = `<article><p class="lede">Three questions from each exam section (one of them a debugging question with a written fix) and one from Project 1. No hints until you answer. Best done after the units, with scratch paper.</p></article>`;
    const st = btn("start mock exam →", "pillbtn go"); const r = row(st); r.style.marginTop = "1.2rem"; main.append(r);
    st.onclick = () => {
      const pick = (a, n) => a.slice().sort(() => Math.random() - .5).slice(0, n);
      const qs = [];
      UNITS.forEach(u => {
        const n = u.id === "cam" ? 1 : 3, c = u.id === "cam" ? 0 : 1;
        pick(u.practice, n - c).forEach(q => qs.push({u: u.id, q}));
        pick(u.code.filter(e => e.t === "bug"), c).forEach(q => qs.push({u: u.id, q}));
      });
      mock = {qs, i: 0, res: []}; render();
    };
    return;
  }
  if (mock.i >= mock.qs.length) {
    const right = mock.res.filter(Boolean).length;
    const by = UNITS.map(u => { const ks = mock.qs.map((x, k) => x.u === u.id ? k : -1).filter(k => k >= 0); return {u, n: ks.length, r: ks.filter(k => mock.res[k]).length}; });
    main.innerHTML = `<article><div class="prog">${mock.res.map(r => `<i class="${r ? "ok" : "no"}"></i>`).join("")}</div><div class="big">${right} / ${mock.qs.length}</div>
      <div class="bars">${by.map(b => { const pc = b.n ? Math.round(100 * b.r / b.n) : 0; return `<div class="bar"><span>${b.u.title}</span><span class="track"><span class="fill" style="width:${pc}%;background:${pc >= 80 ? "var(--ok)" : pc >= 55 ? "var(--warn)" : "var(--bad)"}"></span></span><span class="pc">${b.r}/${b.n}</span></div>`; }).join("")}</div>
      <p>${by.filter(b => b.r < b.n).length ? "Reread: " + by.filter(b => b.r < b.n).map(b => b.u.title).join(", ") + "." : "Clean sweep. Now do the official practice exam on paper against an 80-minute clock."}</p></article>`;
    const a = btn("new mock exam", "pillbtn go"); a.onclick = () => { mock = null; render(); }; const r = row(a); r.style.marginTop = "1.2rem"; main.append(r);
    return;
  }
  const cur = mock.qs[mock.i];
  main.innerHTML = `<div class="stack" style="max-width:760px"><div class="prog">${mock.qs.map((_, k) => `<i class="${k < mock.res.length ? (mock.res[k] ? "ok" : "no") : (k === mock.i ? "cur" : "")}"></i>`).join("")}</div><div class="eyebrow">question ${mock.i + 1} of ${mock.qs.length} · ${unit(cur.u).title}</div><div id="qhost"></div></div>`;
  renderQ(document.getElementById("qhost"), cur.q, (ok, fb) => {
    mock.res.push(ok);
    const nx = btn(mock.i + 1 < mock.qs.length ? "next →" : "see results", "pillbtn go");
    nx.onclick = () => { mock.i++; render(); window.scrollTo(0, 0); }; fb.append(row(nx));
  });
}

function renderRef() {
  const main = page("ref", 'staff hint, ed #374: "np.array, np.pad, np.arange, np.meshgrid, convolve2d, interp2"', "functions");
  main.innerHTML = `<div class="scroll" style="max-width:900px"><table class="reftable"><tr><th>call</th><th>what to remember</th></tr>${REF.map(([c, d]) => `<tr><td>${esc(c)}</td><td>${d}</td></tr>`).join("")}</table></div>`;
}

function renderSheet() {
  const main = page("sheet", "one A4 page, both sides, handwritten only", "cheat sheet");
  const names = {all: "everything"}; UNITS.forEach(u => names[u.id] = u.title);
  const groups = [...new Set(SHEET.map(s => s[0]))];
  main.innerHTML = `<article><p class="lede">Tick items off as you write them onto your sheet. Writing it by hand is studying too.</p>${groups.map(g => `<div class="sheet"><h4>${names[g]}</h4>${SHEET.map((s, k) => s[0] !== g ? "" :
    `<label for="sh${k}"><input type="checkbox" id="sh${k}" data-k="${k}" ${S.sheet[k] ? "checked" : ""}><span>${s[1]}</span></label>`).join("")}</div>`).join("")}</article>`;
  main.querySelectorAll("[data-k]").forEach(c => c.onchange = () => { S.sheet[c.dataset.k] = c.checked; save(); });
}

function render() {
  ({home: renderHome, unit: renderUnit, format: renderFormat, mock: renderMock, ref: renderRef, sheet: renderSheet}[view.page])();
}
render();
</script>
