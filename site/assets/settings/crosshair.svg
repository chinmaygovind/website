<!-- Cursor picker: a thin sniper cross with a gap at the middle so it never
     hides the thing it is pointing at. Every line is drawn twice - a thick
     white one under a thin black one - which is what keeps it readable on a
     white page and on the black screensaver alike. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <g stroke-linecap="round" fill="none">
    <g stroke="#ffffff" stroke-width="6">
      <path d="M48 6 V34 M48 62 V90 M6 48 H34 M62 48 H90" />
      <circle cx="48" cy="48" r="21" />
    </g>
    <g stroke="#141414" stroke-width="2.6">
      <path d="M48 6 V34 M48 62 V90 M6 48 H34 M62 48 H90" />
      <circle cx="48" cy="48" r="21" />
    </g>
    <circle cx="48" cy="48" r="1.8" fill="#141414" stroke="none" />
  </g>
</svg>
